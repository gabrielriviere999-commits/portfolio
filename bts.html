<script>
var lastScroll = 0;

window.addEventListener("scroll", function () {
    var navbar = document.querySelector(".navbar");
    var current = window.scrollY;

    if (current > lastScroll && current > 50) {
        navbar.classList.add("hide");
    } else {
        navbar.classList.remove("hide");
    }

    lastScroll = current;
});

var supportsTransform = 'transform' in document.body.style;

if (!supportsTransform) {
    document.documentElement.classList.add('no-transform');
}
</script>

<script>
function openSubTab(evt, tabName) {
    var i, subtabs;
    subtabs = document.getElementsByClassName("subtabcontent");
    for (i = 0; i < subtabs.length; i++) {
        subtabs[i].style.display = "none";
    }
    document.getElementById(tabName).style.display = "block";
}

function switchTab(tabName, group, elmnt) {
    // Cacher tous les contenus du groupe
    var contents = document.getElementsByClassName(group);
    for (var i = 0; i < contents.length; i++) {
        contents[i].style.display = "none";
    }

    // Enlever la classe active de tous les boutons du groupe
    var buttons = document.getElementsByClassName(group + "_btn");
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove("active");
    }

    // Afficher le contenu demandé
    document.getElementById(tabName).style.display = "block";

    // Ajouter la classe active au bouton cliqué
    if (elmnt) elmnt.classList.add("active");
}

function activateTab(cityName) {
    var i, tabcontent, tablinks;

    // Masquer tous les contenus
    tabcontent = document.getElementsByClassName("tabcontent");
    for (i = 0; i < tabcontent.length; i++) {
        tabcontent[i].style.display = "none";
    }

    // Désactiver tous les onglets
    tablinks = document.getElementsByClassName("tablinks");
    for (i = 0; i < tablinks.length; i++) {
        tablinks[i].classList.remove("active");
    }

    // Afficher le contenu demandé
    document.getElementById(cityName).style.display = "block";

    // Activer le bouton correspondant
    for (i = 0; i < tablinks.length; i++) {
        if (tablinks[i].textContent.trim() === cityName) {
            tablinks[i].classList.add("active");
            break;
        }
    }
}
document.addEventListener("DOMContentLoaded", function() {
    activateTab("BTS");
});
</script>

<script>
function downloadFile(select) {
    const file = select.value;
    if (!file) return;

    // Teste si le navigateur supporte l'attribut download
    const a = document.createElement("a");
    const supportsDownload = "download" in a;

    if (supportsDownload) {
        // Mode normal : téléchargement
        a.href = file;
        a.download = "";
        document.body.appendChild(a);
        a.click();
        a.remove();
    } else {
        // Mode fallback (3DS, vieux navigateurs) : ouvrir dans un nouvel onglet
        window.open(file, "_blank");
    }

    // Réinitialise le menu
    select.value = "";
}
</script>

<script>
var slideIndex = {
  IP_et_routage: 0,
  HAProxy: 0,
  GLPI: 0,
  Infra_BTS: 0
};

function plusSlides(n, group) {
  slideIndex[group] = slideIndex[group] + n;
  showSlides(slideIndex[group], group);
}

function currentSlide(n, group) {
  slideIndex[group] = n;
  showSlides(slideIndex[group], group);
}

function showSlides(n, group) {
  var allSlides = document.getElementsByClassName("mySlide");
  var slides = [];
  var i;

  // Filtrer par data-group
  for (i = 0; i < allSlides.length; i++) {
    if (allSlides[i].getAttribute("data-group") === group) {
      slides.push(allSlides[i]);
    }
  }

  var allThumbs = document.getElementsByClassName("thumbnail");
  var thumbs = [];

  for (i = 0; i < allThumbs.length; i++) {
    if (allThumbs[i].getAttribute("data-group") === group) {
      thumbs.push(allThumbs[i]);
    }
  }

  if (slides.length === 0) {
    return;
  }

  if (n > slides.length) {
    slideIndex[group] = 1;
  }
  if (n < 1) {
    slideIndex[group] = slides.length;
  }

  // Masquer tous les slides du groupe
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }

  // Désactiver toutes les miniatures du groupe
  for (i = 0; i < thumbs.length; i++) {
    thumbs[i].className = thumbs[i].className.replace(" active", "");
  }

  var current = slides[slideIndex[group] - 1];
  current.style.display = "block";

  // Lazy-load PDF
  var iframes = current.getElementsByTagName("iframe");
  if (iframes.length > 0) {
    var iframe = iframes[0];
    var dataSrc = iframe.getAttribute("data-src");
    if (iframe && !iframe.src && dataSrc) {
      iframe.src = dataSrc;
    }
  }

  if (thumbs.length > 0 && thumbs[slideIndex[group] - 1]) {
    thumbs[slideIndex[group] - 1].className += " active";
  }

  var counter = document.getElementById("counter-" + group);
  if (counter) {
    counter.textContent = slideIndex[group] + " / " + slides.length;
  }
}
</script>

<script>
function openFullscreen(group) {
    var index = slideIndex[group] || 1;
    var slides = document.querySelectorAll('.mySlide[data-group="' + group + '"]');
    if (slides.length === 0) return;

    var activeSlide = slides[index - 1];
    if (!activeSlide) return;

    // 1) iframe (HTML, TXT, PDF)
    var iframe = activeSlide.querySelector("iframe");
    if (iframe) {
        var url = iframe.src || iframe.getAttribute("data-src");
        if (url) {
            window.open(url, "_blank");
            return;
        }
    }

    // 2) image
    var img = activeSlide.querySelector("img");
    if (img && img.src) {
        window.open(img.src, "_blank");
        return;
    }

    // 3) vidéo
    var video = activeSlide.querySelector("video");
    if (video && video.src) {
        window.open(video.src, "_blank");
        return;
    }

    console.log("Aucun contenu ouvrable trouvé dans cette slide");
}
</script>
