/* --- Styles généraux --- */
body {
    background-color: #C0C0C0;
    margin: 5;
    padding: 0;
    color: black;
    font-size: 25px;
    font-family: monospace;
    overflow-x: auto;
}

/* --- Barre de navigation --- */
.navbar {
    background-color: rgba(0, 0, 0, .2);
    position: fixed;
    z-index: 1000;
    padding: 2px;
    top: 0;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 3px;
}

.navbar.hide {
    transform: translateY(-100%);
    transition: transform 0.2s linear;
}

.no-transform .navbar {
    position: relative !important;
    top: 0 !important;
}

/* --- Onglets --- */
.tab {
    display: flex;
    align-items: center;
    margin-top: 0;
    width: 100%;
    white-space: nowrap;
    scrollbar-width: thin;
    overflow-x: auto
}

/* Style général des boutons d’onglets */
.tab button, .tab span {
    font-family: monospace;
    font-size: 14px;
    padding: 6px 12px;
    background: #C0C0C0;
    border: 2px solid;
    border-color: #FFFFFF #808080 #808080 #FFFFFF;
    cursor: pointer;
    margin-right: 2px;
    box-sizing: border-box;
    color: black;
}

/* Ajustement spécial pour les onglets dans la navbar (meilleur rendu Win98) */
.navbar .tab button, .navbar .tab span {
    padding: 10px 12px;
    opacity: 0.8;
}

/* Hover */
.tab button:hover, .tab span:hover {
    background: #D8D8D8;
}

/* Bouton actif */
.tab button.active, .tab span.active {
    border-color: #808080 #FFFFFF #FFFFFF #808080;
    background: #B0B0B0;
}

.tab span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.tab a, .win98-select {
    text-decoration: none;
}

.tab a:focus, .win98-select:focus, .tab button:focus {
	filter: brightness(0.8)
}

.win98-select {
    /* Style Win98 */
    font-family: monospace;
    font-size: 14px;
    background: #C0C0C0;
    opacity: 0.8;
    border: 2px solid;
    border-color: #FFFFFF #808080 #808080 #FFFFFF;
    color: black;
    cursor: pointer;
    box-sizing: border-box;

    /* Forme carrée */
    width: 40px;
    height: 40px;
    padding: 0;
    margin: 0;
    margin-right: 2px;

    /* Supprimer le style moderne du select */
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;

    /* Centrage du symbole */
    text-align: center;
    line-height: 36px;

    /* Empêche les décalages */
    display: inline-block;
    vertical-align: middle;
}

/* Hover Win98 */
.win98-select:hover {
    background: #D8D8D8;
}

/* Effet enfoncé Win98 */
.win98-select:active {
    border-color: #808080 #FFFFFF #FFFFFF #808080;
    background: #B0B0B0;
}

/* --- Galerie slideshow --- */
.slideshow-container {
  position: relative;
  max-width: 100%;
  margin-left: 0;
  margin-right: auto;
}

.mySlide {
  display: none;
  width: 100%;
  height: 280px;
  height: 70vh;
  overflow: hidden;
  text-align: left;
  /* Effet enfoncé */
  border: 2px solid;
  border-color: #808080 #FFFFFF #FFFFFF #808080;
  background-color: #C0C0C0;
  padding: 4px;
}

.mySlide img {
  max-height: 100%;
  max-width: 100%;
  object-fit: contain;
}

.mySlide iframe {
  width: 100%;
  height: 100%;
  border: none;
  overflow-x: auto;
  overflow-y: auto;
  display: block;
}

/* Empêche le dark mode forcé uniquement pour les iframes TXT/HTML */
iframe:not([src$=".pdf"]):not([src$=".PDF"]) {
    color-scheme: light;
    background-color: #C0C0C0;
}

.thumbnail-row {
  display: block;
  white-space: normal;
  padding: 4px;
  box-sizing: border-box;
  margin-top: 10px;
  font-size: 0;
}

.thumbnail {
  display: inline-block;
  vertical-align: top;
  width: 80px;
  height: 60px;
  margin: 2px;
  object-fit: cover;
  border: 2px solid #000;
  cursor: pointer;
  font-size: 40px;
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
}

.thumbnail:hover {
  opacity: 0.7;
}

.thumbnail.active {
  border: 2px solid #00f;
  opacity: 1;
}

.prev, .next, .openfullscreen {
  background: #C0C0C0;
  border: 2px solid;
  border-color: #FFFFFF #808080 #808080 #FFFFFF;
  font-family: monospace;
  font-size: 22px;
  color: black;
  padding: 1px 10px;
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
}

/* Effet bouton enfoncé */
.prev:active, .next:active, .openfullscreen:active {
  border-color: #808080 #FFFFFF #FFFFFF #808080;
  background: #B0B0B0;
}

.slide-counter {
  position: absolute;
  bottom: 0px;
  left: 180px;
  font-size: 25px;
}

/* --- Mode mobile --- */
@media screen and (max-width: 720px) {

    }
}

/* --- Bouton de téléchargement --- */
select {
    height: 40px;
    line-height: 40px;
    color: brown;
}

<script>
var lastScroll = 0;

window.addEventListener("scroll", function () {
    var navbar = document.querySelector(".navbar");
    var current = window.scrollY;

    if (current > lastScroll && current > 50) {
        navbar.classList.add("hide");
    } else {
        navbar.classList.remove("hide");
    }

    lastScroll = current;
});

var supportsTransform = 'transform' in document.body.style;

if (!supportsTransform) {
    document.documentElement.classList.add('no-transform');
}
</script>

<script>
function switchTab(tabName, group, elmnt) {
    var contents = document.getElementsByClassName(group);
    for (var i = 0; i < contents.length; i++) {
        contents[i].style.display = "none";
    }

    var buttons = document.getElementsByClassName(group + "_btn");
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].className = buttons[i].className.replace(" active", "");
    }

    document.getElementById(tabName).style.display = "block";

    if (elmnt) {
        elmnt.className += " active";
    }
}
</script>

<script>
function downloadFile(select) {
    const file = select.value;
    if (!file) return;

    // Teste si le navigateur supporte l'attribut download
    const a = document.createElement("a");
    const supportsDownload = "download" in a;

    if (supportsDownload) {
        // Mode normal : téléchargement
        a.href = file;
        a.download = "";
        document.body.appendChild(a);
        a.click();
        a.remove();
    } else {
        // Mode fallback (3DS, vieux navigateurs) : ouvrir dans un nouvel onglet
        window.open(file, "_blank");
    }

    // Réinitialise le menu
    select.value = "";
}
</script>

<script>
var slideIndex = {
  IP_et_routage: 0,
  HAProxy: 0,
  GLPI: 0,
  Infra_BTS: 0
};

function plusSlides(n, group) {
  slideIndex[group] = slideIndex[group] + n;
  showSlides(slideIndex[group], group);
}

function currentSlide(n, group) {
  slideIndex[group] = n;
  showSlides(slideIndex[group], group);
}

function showSlides(n, group) {
    var slides = document.querySelectorAll('.mySlide[data-group="' + group + '"]');
    var thumbs = document.querySelectorAll('.thumbnail[data-group="' + group + '"]');
    var total = slides.length;
    var i;

    if (total === 0) return;

    if (n > total) slideIndex[group] = 1;
    if (n < 1) slideIndex[group] = total;

    // Masquer tous les slides
    for (i = 0; i < total; i++) {
        slides[i].style.display = "none";
    }

    // Désactiver toutes les miniatures
    for (i = 0; i < thumbs.length; i++) {
        // fallback sans classList
        thumbs[i].className = thumbs[i].className.replace(" active", "");
    }

    var current = slides[slideIndex[group] - 1];
    current.style.display = "block";

    // Lazy-load iframe
    var iframe = current.querySelector("iframe[data-src]");
    if (iframe && !iframe.src) {
        iframe.src = iframe.getAttribute("data-src");
    }

    // Lazy-load image
    var img = current.querySelector("img[data-src]");
    if (img && !img.src) {
        img.src = img.getAttribute("data-src");
    }

    // Activer la miniature
    if (thumbs[slideIndex[group] - 1]) {
        thumbs[slideIndex[group] - 1].className += " active";
    }

    // Mettre à jour le compteur
    var counter = document.getElementById("counter-" + group);
    if (counter) {
        counter.textContent = slideIndex[group] + " / " + total;
    }
}
</script>

<script>
function openFullscreen(group) {
    var index = slideIndex[group] || 1;
    var slides = document.querySelectorAll('.mySlide[data-group="' + group + '"]');
    if (slides.length === 0) return;

    var activeSlide = slides[index - 1];
    if (!activeSlide) return;

    // 1) iframe (HTML, TXT, PDF)
    var iframe = activeSlide.querySelector("iframe");
    if (iframe) {
        var url = iframe.src || iframe.getAttribute("data-src");
        if (url) {
            window.open(url, "_blank");
            return;
        }
    }

    // 2) image
    var img = activeSlide.querySelector("img");
    if (img && img.src) {
        window.open(img.src, "_blank");
        return;
    }

    // 3) vidéo
    var video = activeSlide.querySelector("video");
    if (video && video.src) {
        window.open(video.src, "_blank");
        return;
    }

    console.log("Aucun contenu ouvrable trouvé dans cette slide");
}
</script>
