<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="outils.css">
<title>Photo 360°</title>
<style>
.info span{display:block;margin-bottom:10px;word-break:overflow-wrap:anywhere;word-break:break-word;}
#description360{white-space:pre-wrap;}

</style>
</head>
<body>
<canvas id="scene"></canvas>
<button onclick="openMenuPopup()" class="menu">≡</button>
<div id="popupMenuContent" style="display:none">
  <b class="titleb">Menu</b><hr class="titlehr">
  <div class="popupgrid">
    <div style="display:table-row;">
      <div style="display:table-cell;">
        <input type="file" id="fileinput">
      </div>
      <div style="display:table-cell;">
        <input id="pastefileinput" placeholder="Ou cliquer et Ctrl+V" maxlength="0">
      </div>
    </div>
  </div>
  <hr>
  <div id="canvas2dOptions">
    <label>Interaction : <input type="number" id="renduInteractionInput" min="100" step="1000" value="125000"></label>
    <label>Inertie : <input type="number" id="renduInertieInput" min="100" step="1000" value="250000"></label>
    <label>Repos : <input type="number" id="renduReposInput" min="100" step="1000" value="700000"></label>
    <button id="btnResetQualite" onclick="resetQualiteRendu()">Valeurs par défaut</button>
  </div>
  <label><input type="checkbox" id="chkWebGL">Moteur WebGL</label>

  </div>
</div>

  <div id="ligneBas">
    <button class="btnDir" id="btnGauche">←</button>
    <button class="btnDir" id="btnBas">↓</button>
    <button class="btnDir" id="btnDroite">→</button>
  </div>
</div>

  <span id="fov">75°</span> <input type="range" id="fovSlider" min="5" max="100" step="1" value="75">
</div>

<script src="outils.js"></script>

<script>
/* MENU */
function openMenuPopup() {
  var container = document.getElementById("popupMenuContent");
  openPopup(container);
}
function openPhotos360Popup() {
  var container = document.getElementById("popupPhotos360Content");
  container.innerHTML = window.popupPhotos360HTML;
  openPopup(container);
}
/* DOM */
/* Deux canvases : celui du HTML (Canvas 2D) et celui du moteur WebGL,
   créé à la demande. `canvas` pointe toujours sur le canvas actif. */
var canvas2d = document.getElementById("scene");
var canvas = canvas2d;
var ctx = canvas.getContext("2d", {
  alpha: false
});
ctx.imageSmoothingEnabled = true;
var statut = document.getElementById("statut");
var fovAff = document.getElementById("fov");
var dropPage = document.getElementById("dropPage");
var err = document.getElementById("err");
var chkRotation = document.getElementById("chkRotation");
var btnReset = document.getElementById("btnReset");
var fileinput = document.getElementById("fileinput");
var fovSlider = document.getElementById("fovSlider");
var btnGauche = document.getElementById("btnGauche");
var btnDroite = document.getElementById("btnDroite");
var btnHaut = document.getElementById("btnHaut");
var btnBas = document.getElementById("btnBas");
var renduInteractionInput = document.getElementById("renduInteractionInput");
var renduInertieInput = document.getElementById("renduInertieInput");
var renduReposInput = document.getElementById("renduReposInput");
var chkWebGL = document.getElementById("chkWebGL");
/* CAMÉRA */
var yaw = 0;
var pitch = 0;
var fov = 75;
var FOV_MIN = 5;
var FOV_MAX = 100;
var autoRotation = false;
var vitesseX = 0;
var vitesseY = 0;
var saisie = false;
var interactionTemporaire360 = false;
var timerInteraction360 = null;
var DUREE_INTERACTION360 = 180;
var touches = {
  gauche: false,
  droite: false,
  haut: false,
  bas: false
};
/* IMAGE */
var imageSourceOriginale = null;
/* RENDU 360° EN CANVAS 2D, SANS WEBGL ET SANS TRIANGLES.
 * La photo est une équirectangulaire 2:1.
 * Pour chaque pixel du petit buffer de rendu :
 *   pixel écran -> rayon caméra -> yaw/pitch
 *              -> longitude/latitude
 *              -> pixel dans la photo 360
 * Le buffer est ensuite agrandi par Canvas.
 * On garde deux qualités :
 *   - pendant le mouvement : petit buffer + échantillonnage rapide
 *   - au repos             : buffer plus grand + interpolation bilinéaire */
/* Les tailles max du buffer sont initialisées plus bas,
   dans la section QUALITÉ DE RENDU, à partir de RENDU_DEFAUTS. */
var buffer360 = document.createElement("canvas");
var buffer360Ctx = buffer360.getContext("2d", { alpha: false });
var buffer360ImageData = null;
var buffer360Data = null;
var buffer360W = 0;
var buffer360H = 0;
/* Petit cache des coordonnées de rayon caméra. */
var rayX360 = null;
var rayY360 = null;
var rayZ360 = null;
var dernierFovRendu = -1;
/* DIRTY FLAG */
var sale = true;
function bornerPitch(p) {
  if (p < -1.55) return -1.55;
  if (p > 1.55) return 1.55;
  return p;
}
// Choisit la taille du buffer. Le buffer garde exactement le même rapport largeur/hauteur que l'écran.
function obtenirTailleBuffer360() {
  var w = Math.max(1, canvas.width);
  var h = Math.max(1, canvas.height);
  var aspect = w / h;
  var maxPixels;
  // Flèches (clavier ET boutons) : mouvement volontaire et contrôlé, on lui donne le budget d'interaction, pas celui d'inertie.
  if (
    saisie || interactionTemporaire360 || touches.gauche || touches.droite || touches.haut || touches.bas
  ) {
    maxPixels = RENDU_INTERACTION_MAX_PIXELS;
  } else if (
    vitesseX !== 0 || vitesseY !== 0 ||
    autoRotation
  ) {
    maxPixels = RENDU_INERTIE_MAX_PIXELS;
  } else {
    maxPixels = RENDU_REPOS_MAX_PIXELS;
  }
  // Plafond : l'image ne peut pas offrir plus de détails que sa propre résolution dans l'angle visible. Au-delà, on calcule des pixels identiques pour rien.
  var img = imageSourceOriginale;
  if (img) {
    var iw = img.naturalWidth || img.width;
    var ih = img.naturalHeight || img.height;
    // Nombre de pixels image visibles ≈ (iw * fovH/360) * (ih * fovV/180).
    var fovH = 2 * Math.atan(Math.tan(fov * Math.PI / 360) * aspect) * 180 / Math.PI;
    var utile = (iw * fovH / 360) * (ih * fov / 180);
    if (utile < maxPixels) {
      maxPixels = Math.max(1, utile);
    }
  }
  var bh = Math.round(Math.sqrt(maxPixels / aspect));
  var bw = Math.round(bh * aspect);
  bw = Math.min(bw, w);
  bh = Math.min(bh, h);
  return {
    w: bw,
    h: bh
  };
}
// Recrée les rayons caméra uniquement lorsque la résolution ou le FOV change.
function preparerRayons360(w, h, focal) {
  if (
    rayX360 && buffer360W === w && buffer360H === h && dernierFovRendu === fov
  ) {
    return;
  }
  var n = w * h;
  rayX360 = new Float32Array(n);
  rayY360 = new Float32Array(n);
  rayZ360 = new Float32Array(n);
  var cx = w * 0.5;
  var cy = h * 0.5;
  var i = 0;
  var y;
  var x;
  for (y = 0; y < h; y++) {
    var sy = y + 0.5;
    for (x = 0; x < w; x++) {
      var sx = x + 0.5;
      var rx = (sx - cx) / focal;
      var ry = -(sy - cy) / focal;
      var rz = 1;
      var longueur = Math.sqrt(rx * rx + ry * ry + rz * rz);
      rayX360[i] = rx / longueur;
      rayY360[i] = ry / longueur;
      rayZ360[i] = rz / longueur;
      i++;
    }
  }
  buffer360W = w;
  buffer360H = h;
  dernierFovRendu = fov;
}
// Prépare le ImageData du buffer.
function preparerBuffer360(w, h) {
  if (buffer360.width !== w || buffer360.height !== h) {
    buffer360.width = w;
    buffer360.height = h;
    buffer360ImageData = buffer360Ctx.createImageData(w, h);
    buffer360Data = buffer360ImageData.data;
    // Le changement de taille invalide les rayons.
    buffer360W = 0;
    buffer360H = 0;
  }
  if (!buffer360ImageData) {
    buffer360ImageData = buffer360Ctx.createImageData(w, h);
    buffer360Data = buffer360ImageData.data;
  }
}
// Rendu pixel par pixel. C'est la projection inverse : on part de l'écran et on cherche quel pixel de la photo équirectangulaire doit être affiché.
function dessinerPhoto360() {
  if (!imageSourceOriginale) return;
  // Moteur WebGL : rendu par shader, pas de buffer 2D.
  if (webglActif) {
    dessinerWebGL();
    return;
  }
  var taille = obtenirTailleBuffer360();
  var w = taille.w;
  var h = taille.h;
  preparerBuffer360(w, h);
  var focal = (h * 0.5) / Math.tan(fov * Math.PI / 360);
  preparerRayons360(w, h, focal);
  var img = imageSourceOriginale;
  var iw = img.naturalWidth || img.width;
  var ih = img.naturalHeight || img.height;
  // Prépare la texture source une seule fois.
  if (
    !texture360SourceCanvas ||
    texture360SourceCanvas.width !== iw ||
    texture360SourceCanvas.height !== ih ||
    texture360SourceImage !== img
  ) {
    texture360SourceCanvas = document.createElement("canvas");
    texture360SourceCanvas.width = iw;
    texture360SourceCanvas.height = ih;
    texture360SourceCtx = texture360SourceCanvas.getContext("2d", {
      willReadFrequently: true
    });
    texture360SourceCtx.drawImage(img, 0, 0, iw, ih);
    texture360SourceImage = img;
    texture360SourceImageData = texture360SourceCtx.getImageData(0, 0, iw, ih);
    texture360SourceData = texture360SourceImageData.data;
  }
  var src = texture360SourceData;
  var dst = buffer360Data;
  var cyaw = Math.cos(yaw);
  var syaw = Math.sin(yaw);
  var cpitch = Math.cos(pitch);
  var spitch = Math.sin(pitch);
  var iw1 = iw - 1;
  var ih1 = ih - 1;
  var INV_2PI = 1 / (Math.PI * 2);
  var INV_PI = 1 / Math.PI;
  var i;
  var p = 0;
  var n = w * h;
  for (i = 0; i < n; i++) {
    var x = rayX360[i];
    var y = rayY360[i];
    var z = rayZ360[i];
    // Pitch
    var py = y * cpitch - z * spitch;
    var pz = y * spitch + z * cpitch;
    // Yaw
    var wx = x * cyaw + pz * syaw;
    var wy = py;
    var wz = -x * syaw + pz * cyaw;
    // Sphère -> équirectangulaire
    var longitude = Math.atan2(wx, wz);
    // atan2 retourne déjà [-PI, PI], donc u est déjà dans [0, 1].
    var u = longitude * INV_2PI + 0.5;
    // Protection numérique pour asin()
    if (wy < -1) wy = -1;
    else if (wy > 1) wy = 1;
    var v = 0.5 - Math.asin(wy) * INV_PI;
    var sx = u * iw1;
    var sy = v * ih1;
    // NEAREST NEIGHBOR UNIQUEMENT
    var ix = (sx + 0.5) | 0;
    var iy = (sy + 0.5) | 0;
    var si = (iy * iw + ix) * 4;
    dst[p++] = src[si];
    dst[p++] = src[si + 1];
    dst[p++] = src[si + 2];
    dst[p++] = 255;
  }
  buffer360Ctx.putImageData(buffer360ImageData, 0, 0);
  // Pixels purs : l'agrandissement du buffer se fait sans lissage.
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buffer360, 0, 0, canvas.width, canvas.height);
}
/* TEXTURE 360° */
var texture360SourceCanvas = null;
var texture360SourceCtx = null;
var texture360SourceImage = null;
var texture360SourceImageData = null;
var texture360SourceData = null;
function definirTexture360(image) {
  imageSourceOriginale = image;
  texture360SourceCanvas = null;
  texture360SourceCtx = null;
  texture360SourceImage = null;
  texture360SourceImageData = null;
  texture360SourceData = null;
  buffer360W = 0;
  buffer360H = 0;
  dernierFovRendu = -1;
  // Moteur WebGL : envoyer la nouvelle image au GPU (tuiles / réduction).
  if (webglActif && gl && prog && image) {
    envoyerTexture(image, image.naturalWidth || image.width, image.naturalHeight || image.height);
  }
  sale = true;
}
/* FIN DU RENDU 360° */
/* ============================================================
   MOTEUR WEBGL (optionnel, activé par la case à cocher)
   Même caméra (yaw / pitch / fov, mêmes conventions) que le
   moteur Canvas 2D : le shader reconstruit le rayon de chaque
   pixel et échantillonne la texture équirectangulaire.
   L'image est découpée en tuiles verticales si elle dépasse
   la taille max du GPU. Les réglages de qualité Canvas 2D
   (buffer réduit) ne s'appliquent pas à ce moteur.
   ============================================================ */
var webglActif = false;
var canvasGL = null;
var gl = null;
var prog = null, uni = {}, attribPos = null;
var tuiles = [];
var texDummy = null;
var TUILES_MAX = 4;
var VERT =
  "attribute vec2 aPos;\n" +
  "varying vec2 vNdc;\n" +
  "void main() {\n" +
  "  vNdc = aPos;\n" +
  "  gl_Position = vec4(aPos, 0.0, 1.0);\n" +
  "}\n";
var FRAG =
  "precision highp float;\n" +
  "uniform float uYaw;\n" +
  "uniform float uPitch;\n" +
  "uniform float uTanF;\n" +
  "uniform float uAspect;\n" +
  "uniform float uTuiles;\n" +
  "uniform float uPad;\n" +
  "uniform sampler2D uTex0;\n" +
  "uniform sampler2D uTex1;\n" +
  "uniform sampler2D uTex2;\n" +
  "uniform sampler2D uTex3;\n" +
  "varying vec2 vNdc;\n" +
  "const float PI = 3.141592653589793;\n" +
  "void main() {\n" +
  "  float cy = cos(uYaw),  sy = sin(uYaw);\n" +
  "  float cp = cos(uPitch), sp = sin(uPitch);\n" +
  "  vec3 fwd = vec3(sy * cp, sp, -cy * cp);\n" +
  "  vec3 right = vec3(cy, 0.0, sy);\n" +
  "  vec3 up = vec3(-sy * sp, cp, cy * sp);\n" +
  "  vec3 ray = fwd + right * (vNdc.x * uTanF * uAspect) + up * (vNdc.y * uTanF);\n" +
  "  ray = normalize(ray);\n" +
  "  float u = fract(atan(ray.x, -ray.z) / (2.0 * PI) + 0.5);\n" +
  "  float v = 0.5 + asin(clamp(ray.y, -1.0, 1.0)) / PI;\n" +
  "  float f = u * uTuiles;\n" +
  "  float idx = floor(f);\n" +
  "  float lu = uPad + (f - idx) * (1.0 - 2.0 * uPad);\n" +
  "  vec2 luv = vec2(lu, v);\n" +
  "  vec4 col;\n" +
  "  if (idx < 0.5)      { col = texture2D(uTex0, luv); }\n" +
  "  else if (idx < 1.5) { col = texture2D(uTex1, luv); }\n" +
  "  else if (idx < 2.5) { col = texture2D(uTex2, luv); }\n" +
  "  else                { col = texture2D(uTex3, luv); }\n" +
  "  gl_FragColor = col;\n" +
  "}\n";
function initGL() {
  try {
    gl = canvasGL.getContext("webgl") || canvasGL.getContext("experimental-webgl");
  } catch (e) {
    gl = null;
  }
  if (!gl) return false;
  function compiler(type, source) {
    var s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) return null;
    return s;
  }
  var vs = compiler(gl.VERTEX_SHADER, VERT);
  var fs = compiler(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) return false;
  prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.bindAttribLocation(prog, 0, "aPos");
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
  gl.useProgram(prog);
  // Un seul grand triangle couvrant tout l'écran.
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  attribPos = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(attribPos);
  gl.vertexAttribPointer(attribPos, 2, gl.FLOAT, false, 0, 0);
  TUILES_MAX = Math.min(4, gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS) || 8);
  uni.yaw = gl.getUniformLocation(prog, "uYaw");
  uni.pitch = gl.getUniformLocation(prog, "uPitch");
  uni.tanF = gl.getUniformLocation(prog, "uTanF");
  uni.aspect = gl.getUniformLocation(prog, "uAspect");
  uni.tuiles = gl.getUniformLocation(prog, "uTuiles");
  uni.pad = gl.getUniformLocation(prog, "uPad");
  uni.tex0 = gl.getUniformLocation(prog, "uTex0");
  uni.tex1 = gl.getUniformLocation(prog, "uTex1");
  uni.tex2 = gl.getUniformLocation(prog, "uTex2");
  uni.tex3 = gl.getUniformLocation(prog, "uTex3");
  gl.uniform1i(uni.tex0, 0);
  gl.uniform1i(uni.tex1, 1);
  gl.uniform1i(uni.tex2, 2);
  gl.uniform1i(uni.tex3, 3);
  // Texture 1x1 pour les unités inutilisées.
  texDummy = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texDummy);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
  return true;
}
/* Bande verticale avec bouclage horizontal. */
function dessinerBande(g, source, W, H, x, largeur, xDest) {
  x = ((x % W) + W) % W;
  if (x + largeur <= W) {
    g.drawImage(source, x, 0, largeur, H, xDest, 0, largeur, H);
  } else {
    var part1 = W - x;
    g.drawImage(source, x, 0, part1, H, xDest, 0, part1, H);
    g.drawImage(source, 0, 0, largeur - part1, H, xDest + part1, 0, largeur - part1, H);
  }
}
/* Tuile avec "pad" pixels de recouvrement de chaque côté (anti-couture). */
function creerTuile(source, W, H, xDebut, largeur, pad) {
  var c = document.createElement("canvas");
  c.width = largeur + 2 * pad;
  c.height = H;
  var g = c.getContext("2d");
  g.drawImage(source, xDebut, 0, largeur, H, pad, 0, largeur, H);
  dessinerBande(g, source, W, H, xDebut - pad, pad, 0);
  dessinerBande(g, source, W, H, xDebut + largeur, pad, pad + largeur);
  return c;
}
function envoyerTexture(source, largeur, hauteur) {
  if (!gl) return null;
  var max = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  var redimensionnee = false;
  var i;
  if (hauteur > max) {
    var sh = max / hauteur;
    var ch = document.createElement("canvas");
    ch.width = Math.max(1, Math.floor(largeur * sh));
    ch.height = max;
    ch.getContext("2d").drawImage(source, 0, 0, ch.width, ch.height);
    source = ch; largeur = ch.width; hauteur = ch.height;
    redimensionnee = true;
  }
  var n = 1;
  if (largeur > max) n = Math.ceil(largeur / max);
  if (n > TUILES_MAX) {
    var sw = (TUILES_MAX * max) / largeur;
    var cw = document.createElement("canvas");
    cw.width = TUILES_MAX * max;
    cw.height = Math.max(1, Math.floor(hauteur * sw));
    cw.getContext("2d").drawImage(source, 0, 0, cw.width, cw.height);
    source = cw; largeur = cw.width; hauteur = cw.height;
    n = TUILES_MAX;
    redimensionnee = true;
  }
  var pad = 4;
  var maxChunkPx = max - 2 * pad;
  var chunkPx = Math.min(Math.floor(largeur / n), maxChunkPx);
  var largeurTuiles = chunkPx * n;
  if (largeurTuiles !== largeur) {
    var creg = document.createElement("canvas");
    creg.width = largeurTuiles;
    creg.height = hauteur;
    creg.getContext("2d").drawImage(source, 0, 0, largeurTuiles, hauteur);
    source = creg;
    largeur = creg.width;
  }
  var padFrac = pad / (chunkPx + 2 * pad);
  for (i = 0; i < tuiles.length; i++) gl.deleteTexture(tuiles[i]);
  tuiles = [];
  for (i = 0; i < n; i++) {
    var t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE,
      creerTuile(source, largeur, hauteur, i * chunkPx, chunkPx, pad));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    tuiles.push(t);
  }
  for (i = n; i < 4; i++) {
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_2D, texDummy);
  }
  gl.uniform1f(uni.tuiles, n);
  gl.uniform1f(uni.pad, padFrac);
  sale = true;
  return { w: largeur, h: hauteur, tuiles: n, redimensionnee: redimensionnee };
}
/* Rendu WebGL d'une frame. */
function dessinerWebGL() {
  if (!gl || !prog) return;
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform1f(uni.yaw, yaw);
  // La texture est envoyée avec UNPACK_FLIP_Y_WEBGL (retournée verticalement) :
  // il faut donc passer le tangage opposé pour garder les mêmes conventions
  // de caméra que le moteur Canvas 2D (glisser vers le bas = regarder en haut).

  var url = "https://www.openstreetmap.org/?mlat=" + gps360.lat + "&mlon=" + gps360.lon + "#map=18/" + gps360.lat + "/" + gps360.lon;
  gps.innerHTML = "";
  var a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.appendChild(document.createTextNode("GPS : " + txt + " (OpenStreetMap)"));
  gps.appendChild(a);
}
/* Analyse les octets d'un JPEG et met à jour l'affichage GPS. */
function analyserGpsOctets(octets) {
  gps360 = null;
  try {
    gps360 = extraireGpsExif(new Uint8Array(octets));
  } catch (e) {
    gps360 = null;
  }
  try {
    description360 = extraireDescription(new Uint8Array(octets));
  } catch (e) {
    description360 = "";
  }
  afficherGps();
  afficherDescription();
}
/* Lien de téléchargement de l'image chargée. */
function majLienTelechargement() {
  var cont = document.getElementById("telechargement");
  cont.innerHTML = "";
  if (!imageSourceOriginale || !imageSourceOriginale.src) {
    return;
  }
  var src = imageSourceOriginale.src;
  // Nom de fichier : déduit de l'URL (extension comprise), ou générique.
  var nom = "photo360.png";
  if (src.indexOf("data:") !== 0) {
    // Dernier segment de chemin, nettoyé de la query et du fragment.
    var m = src.match(/([^\/?#]+?)(\.([a-z0-9]+))?(\?|#|$)/i);
    if (m && m[1]) {
      nom = m[1] + (m[3] ? "." + m[3] : "");
    }
  }
  var a = document.createElement("a");
  a.href = src;
  a.download = nom;
  a.appendChild(document.createTextNode("Télécharger l'image"));
  cont.appendChild(a);
}
/* Lecture GPS depuis un File (input / drag-drop). */
function chargerGpsFichier(f) {
  gps360 = null;
  description360 = "";
  afficherGps();
  afficherDescription();
  if (!f) return;
  // Vieux moteurs : FileReader ou readAsArrayBuffer peuvent manquer. Le GPS est optionnel : on abandonne silencieusement.
  try {
    if (typeof FileReader !== "function" || !FileReader.prototype.readAsArrayBuffer) {
      return;
    }
    var lecteur = new FileReader();
    lecteur.onload = function(e) { analyserGpsOctets(e.target.result); };
    lecteur.onerror = function() {};
    lecteur.readAsArrayBuffer(f);
  } catch (e) {}
}
/* Lecture GPS depuis une URL (same-origin ; XHR, pas d'API moderne). */
function chargerGpsUrl(src) {
  gps360 = null;
  description360 = "";
  afficherGps();
  afficherDescription();
  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", src, true);
    xhr.responseType = "arraybuffer";
    xhr.onload = function() {
      if (xhr.status === 200 || xhr.status === 0) {
        analyserGpsOctets(xhr.response);
      }
    };
    xhr.onerror = function() {};
    xhr.send(null);
  } catch (e) {}
}
/* CHARGEMENT IMAGE */
function chargerFichier(f) {
  if (!f) {
    return;
  }
  try {
    chargerGpsFichier(f);
  } catch (e) {}
  var lecteur = new FileReader();
  lecteur.onload =
    function(e) {
      var img =
        new Image();
      img.onload =
        function() {
          definirTexture360(img);
          statut.textContent = f.name + " - " + img.naturalWidth + "x" + img.naturalHeight;
          masquerErreur();
          yaw = 0;
          pitch = 0;
          vitesseX = 0;
          vitesseY = 0;
          majLienTelechargement();
          sale = true;
        };
      img.onerror =
        function() {
          afficherErreur("Impossible de décoder cette image.");
        };
      img.src = e.target.result;
    };
  lecteur.onerror =
    function() {
      afficherErreur("Lecture du fichier impossible.");
    };
  lecteur.readAsDataURL(f);
}
/* CHARGEMENT D'UNE PHOTO PAR CHEMIN (fichier servi par le site) */
function chargerPhoto(src) {
  statut.textContent = "Chargement de " + src + "...";
  chargerGpsUrl(src);
  var img = new Image();
  img.onload = function() {
    definirTexture360(img);
    statut.textContent = src + " - " + img.naturalWidth + "x" + img.naturalHeight;
    masquerErreur();
    yaw = 0;
    pitch = 0;
    vitesseX = 0;
    vitesseY = 0;
    majLienTelechargement();
    sale = true;
  };
  img.onerror = function() {
    afficherErreur("Impossible de charger : " + src);
    statut.textContent = "Texture de démonstration";
  };
  img.src = src;
}
/* INTERACTION SOURIS */
var dernierX = 0;
var dernierY = 0;
var pincement = null;
function commencer(x, y) {
  saisie = true;
  dernierX = x;
  dernierY = y;
  vitesseX = 0;
  vitesseY = 0;
  canvas.className = "saisie";
  // On passe immédiatement en qualité d'interaction.
  sale = true;
}
function deplacer(x, y) {
  var dx = x - dernierX;
  var dy = y - dernierY;
  dernierX = x;
  dernierY = y;
  var sensibiliteRotation = 2;
  var k = (fov * Math.PI / 180) / Math.max(1, canvas.clientWidth);
  k *= sensibiliteRotation;
  yaw -= dx * k;
  pitch = bornerPitch(pitch - dy * k);
  vitesseX = -dx * k;
  vitesseY = -dy * k;
  sale = true;
}
function terminer() {
  saisie = false;
  canvas.className = "";
  sale = true;
  // Désactiver inertie d'après clic
  vitesseX = 0;
  vitesseY = 0;
}
/* SOURIS */
/* Écouteurs au niveau window avec test de cible : ils restent valables
 * quel que soit le canvas actif (Canvas 2D ou WebGL). */
window.addEventListener("mousedown",
  function(e) {
    if (e.target !== canvas) return;
    e.preventDefault();
    commencer(e.clientX, e.clientY);
  },
  false
);
window.addEventListener("mousemove",
  function(e) {
    if (saisie) {
      deplacer(e.clientX, e.clientY);
    }
  },
  false
);
window.addEventListener("mouseup", terminer, false);
/* TACTILE */
function gererTouchStart(e) {
  if (e.target !== canvas) return;
  if (e.touches.length === 1) {
    commencer(e.touches[0].clientX, e.touches[0].clientY);
  } else if (e.touches.length === 2) {
    pincement = distanceTouches(e.touches);
  }
  e.preventDefault();
}
window.addEventListener("touchstart", gererTouchStart, {
  passive: false
});
canvas.addEventListener("touchstart", gererTouchStart, {
  passive: false
});
window.addEventListener("touchmove",
  function(e) {
    if (e.touches.length === 1 && saisie) {
      deplacer(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2 && pincement !== null) {
      var d = distanceTouches(e.touches);
      if (d > 0) {
        fov = fov * (pincement / d);
        fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
        pincement = d;
        sale = true;
      }
    }
    if (saisie || pincement !== null) e.preventDefault();
  },
  {
    passive:false
  }
);
window.addEventListener("touchend",
  function(e) {
    if (e.touches.length === 0 && (saisie || pincement !== null)) {
      terminer();
      pincement = null;
    } else if (e.touches.length === 1 && saisie) {
      saisie = false;
      commencer(e.touches[0].clientX, e.touches[0].clientY);
    }
  },
  {
    passive:false
  }
);
function distanceTouches(t) {
  var dx = t[0].clientX - t[1].clientX;
  var dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}
/* MOLETTE */
function molette(e) {
  var d = e.deltaY || e.wheelDelta || 0;
  if (d > 0) {
    fov += 5;
  } else if (d < 0) {
    fov -= 5;
  }
  fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
  activerInteractionTemporaire360();
  sale = true;
  e.preventDefault();
}
window.addEventListener("wheel", function(e) {
    if (e.target !== canvas) return;
    molette(e);
  },
  {
    passive:false
  }
);
/* CLAVIER */
function menuOuvert() {
  return !!document.querySelector('.popup-overlay');
}
window.addEventListener("keydown",  function(e) {
    if(menuOuvert())return;   
    // Ctrl + / Ctrl -
    if (e.ctrlKey) {
      if (
        e.key === "+" || e.key === "="
      ) {
        fov -= 5;
        fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
        activerInteractionTemporaire360();
        sale = true;
        e.preventDefault();
        return;
      }
      if (e.key === "-" || e.key === "_") {
        fov += 5;
        fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
        activerInteractionTemporaire360();
        sale = true;
        e.preventDefault();
        return;
      }
    }
    // Flèches
    if (e.keyCode === 37) {
      touches.gauche = true;
      activerInteractionTemporaire360();
    } else if (e.keyCode === 39) {
      touches.droite = true;
      activerInteractionTemporaire360();
    } else if (e.keyCode === 38) {
      touches.haut = true;
      activerInteractionTemporaire360();
    } else if (e.keyCode === 40) {
      touches.bas = true;
      activerInteractionTemporaire360();
    } else {
      return;
    }
    e.preventDefault();
  },
  false
);
window.addEventListener("keyup",
  function(e) {
    if (e.keyCode === 37) {
      touches.gauche = false;
    } else if (e.keyCode === 39) {
      touches.droite = false;
    } else if (e.keyCode === 38) {
      touches.haut = false;
    } else if (e.keyCode === 40) {
      touches.bas = false;
    }
  },
  false
);
/* Perte de focus : le keyup d'une flèche maintenue ne nous parvient jamais (alt-tab, popup, mise en veille). On remet tout à zéro. */
window.addEventListener("blur",
  function() {
    saisie = false;
    touches.gauche = false;
    touches.droite = false;
    touches.haut = false;
    touches.bas = false;
    vitesseX = 0;
    vitesseY = 0;
    canvas.className = "";
    sale = true;
  },
  false
);
document.addEventListener("visibilitychange",
  function() {
    if (document.hidden) {
      touches.gauche = false;
      touches.droite = false;
      touches.haut = false;
      touches.bas = false;
      saisie = false;
      vitesseX = 0;
      vitesseY = 0;
      sale = true;
    }
  },
  false
);
/* FOV */
fovSlider.addEventListener("input",
  function() {
    fov = parseInt(fovSlider.value, 10) || 75;
    fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
    activerInteractionTemporaire360();
    sale = true;
  },
  false
);
/* QUALITÉ DE RENDU (pixels max du buffer) */
var CLE_STOCKAGE_RENDU = "photo360QualiteRendu";
var RENDU_DEFAUTS = {
  interaction: 125000,
  inertie: 250000,
  repos: 700000
};
/* Initialisation à partir de RENDU_DEFAUTS : source unique. */
var RENDU_INTERACTION_MAX_PIXELS = RENDU_DEFAUTS.interaction;
var RENDU_INERTIE_MAX_PIXELS = RENDU_DEFAUTS.inertie;
var RENDU_REPOS_MAX_PIXELS = RENDU_DEFAUTS.repos;
function appliquerQualiteRendu(interaction, inertie, repos) {
  RENDU_INTERACTION_MAX_PIXELS = interaction;
  RENDU_INERTIE_MAX_PIXELS = inertie;
  RENDU_REPOS_MAX_PIXELS = repos;
  renduInteractionInput.value = interaction;
  renduInertieInput.value = inertie;
  renduReposInput.value = repos;
  // Le changement de taille du buffer est géré automatiquement par preparerBuffer360 / preparerRayons360 au prochain rendu.
  sale = true;
}
function sauvegarderQualiteRendu() {
  try {
    localStorage.setItem(
      CLE_STOCKAGE_RENDU,
      JSON.stringify({
        interaction: RENDU_INTERACTION_MAX_PIXELS,
        inertie: RENDU_INERTIE_MAX_PIXELS,
        repos: RENDU_REPOS_MAX_PIXELS
      })
    );
  } catch (e) {
    // localStorage indisponible (navigation privée, etc.) : on ignore.
  }
}
function chargerQualiteRendu() {
  try {
    var brut = localStorage.getItem(CLE_STOCKAGE_RENDU);
    if (!brut) {
      return;
    }
    var o = JSON.parse(brut);
    appliquerQualiteRendu(
      Math.max(1000, parseInt(o.interaction, 10) || RENDU_DEFAUTS.interaction),
      Math.max(1000, parseInt(o.inertie, 10) || RENDU_DEFAUTS.inertie),
      Math.max(1000, parseInt(o.repos, 10) || RENDU_DEFAUTS.repos)
    );
  } catch (e) {
    // Valeur corrompue : on garde les défauts.
  }
}
function resetQualiteRendu() {
  appliquerQualiteRendu(
    RENDU_DEFAUTS.interaction,
    RENDU_DEFAUTS.inertie,
    RENDU_DEFAUTS.repos
  );
  sauvegarderQualiteRendu();
}
function lierEntreeRendu(input, appliquer) {
  function maj() {
    var v = parseInt(input.value, 10);
    if (isNaN(v) || v < 1000) {
      v = 1000;
    }
    appliquer(v);
    // Sauvegarde à la validation du champ (pas à chaque frappe).
    sauvegarderQualiteRendu();
    sale = true;
  }
  input.addEventListener("change", maj, false);
}
lierEntreeRendu(renduInteractionInput, function(v) {
  RENDU_INTERACTION_MAX_PIXELS = v;
});
lierEntreeRendu(renduInertieInput, function(v) {
  RENDU_INERTIE_MAX_PIXELS = v;
});
lierEntreeRendu(renduReposInput, function(v) {
  RENDU_REPOS_MAX_PIXELS = v;
});
/* BOUTONS DIRECTIONNELS */
function boutonMaintenir(btn, cle) {
  /* Chaque bouton garde son propre état "enfoncé" : un mouseup/touchend ailleurs (par exemple en relâchant un AUTRE bouton) ne le relâche pas. */
  var enfonce = false;
  function activer() {
    enfonce = true;
    touches[cle] = true;
    btn.classList.add("pressed");
    activerInteractionTemporaire360();
  }
  function relacher() {
    enfonce = false;
    touches[cle] = false;
    btn.classList.remove("pressed");
  }
  btn.addEventListener("mousedown", activer, false);
  btn.addEventListener("touchstart",
    function(e) {
      e.preventDefault();
      activer();
    },
    {
      passive:false
    }
  );
  btn.addEventListener("mouseleave", function() { if (enfonce) relacher(); }, false);
  window.addEventListener("mouseup", function() { if (enfonce) relacher(); }, false);
  /* touchend part de l'élément où le doigt a commencé : attaché au bouton lui-même, pas à window, pour ne pas relâcher les autres boutons. */
  btn.addEventListener("touchend", relacher, false);
  btn.addEventListener("touchcancel", relacher, false);
}
boutonMaintenir(btnGauche, "gauche");
boutonMaintenir(btnDroite, "droite");
boutonMaintenir(btnHaut, "haut");
boutonMaintenir(btnBas, "bas");
/* FICHIER */
fileinput.addEventListener("change",
  function() {
    if (fileinput.files && fileinput.files[0]) {
      chargerFichier(fileinput.files[0]);
    }
    fileinput.value = "";
  },
  false
);
/* STYLE DRAG & DROP */
window.addEventListener("dragover",
  function(e) {
    e.preventDefault();
    dropPage.className = "actif";
  },
  false
);
window.addEventListener("dragleave",
  function() {
    dropPage.className = "";
  }, false);
window.addEventListener("drop",
  function(e) {
    e.preventDefault();
    dropPage.className = "";
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
      chargerFichier(e.dataTransfer.files[0]);
    }
  },
  false
);
/* BOUTONS */
function majAutoRotation() {
  autoRotation = chkRotation.checked;
  sale = true;
}
if(chkRotation.checked) { majAutoRotation(); }
chkRotation.addEventListener("change", majAutoRotation, false);
function resetPhoto360() {
  yaw = 0;
  pitch = 0;
  fov = 75;
  vitesseX = 0;
  vitesseY = 0;
  sale = true;
}
/* ERREURS */
function afficherErreur(msg) {
  err.textContent = msg;
  err.style.display = "block";
  if (
    typeof err._timer !== "undefined"
  ) {
    clearTimeout(err._timer);
  }
  err._timer =
    setTimeout(
      function() {
        masquerErreur();
      },
      5000
    );
}
function masquerErreur() {
  err.style.display = "none";
}
/* DÉMARRAGE */
var demo = textureDemonstration();
definirTexture360(demo);
statut.textContent = "Texture de démonstration - " + demo.width + "x" + demo.height;
/* État initial du moteur, tous les cas confondus (par priorité) :
 * 1) ?webgl=true|false (ou 1|0) dans l'URL ;
 * 2) sinon le dernier choix mémorisé dans le localStorage ;
 * 3) sinon l'attribut "checked" de la case dans le HTML ;
 * 4) sinon Canvas 2D (case décochée).
 * majMoteurWebGL() est TOUJOURS appelée : la case ne peut jamais
 * afficher un état différent du moteur réellement actif, et si
 * l'initialisation WebGL échoue elle se décoche d'elle-même. */
try {
  var mWebGL = window.location.search.match(/[?&]webgl=(true|false|1|0)\b/i);
  if (mWebGL) {
    chkWebGL.checked = /^(true|1)$/i.test(mWebGL[1]);
  } else {
    var memWebGL = chargerMoteurWebGL();
    if (memWebGL !== null) {
      chkWebGL.checked = (memWebGL === "1");
    }
  }
  majMoteurWebGL();
} catch (e) {}
// Restaure la dernière qualité de rendu sauvegardée (si présente).
chargerQualiteRendu();
redimensionner();
var requestFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || window.msRequestAnimationFrame ||
  function (callback) {
    return window.setTimeout(function () {
      callback(new Date().getTime());
    }, 16);
  };
requestFrame(boucle);
