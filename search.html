<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recherche</title>
<meta name="description" content="Rechercher les noms ou les contenus des fichiers texte et .html mais uniquement les noms pour les .pdf et autres fichiers.">
<style>
  body {
    background-color: #C0C0C0;
    font-family: sans-serif;
    margin: 1em;
    color: #222;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 4px;
    font-size: 14px;
    font-family: sans-serif;
    color: black;
    background-color: white;
    border: 2px solid #808080; /* bordure sombre par défaut */
    border-right-color: #fff;  /* clair à droite */
    border-bottom-color: #fff; /* clair en bas */
    outline: none;
  }

  #results a {
    display: block;
    margin: 0.3em 0;
    text-decoration: none;
    color: #0066cc;
    word-wrap: break-word;
    word-break: break-all;    
  }
  #results a:hover {
    text-decoration: underline;
  }
  #results ul {
  list-style-type: disc;   /* puce ronde classique */
  padding-left: 1em;     /* espace pour la puce */
  }
  #results li {
    margin: 0;
    padding: 2px 0;
    line-height: 1;
  }

.win98-btn {
  padding: 2px 6px;
  background: #C0C0C0;
  border: 2px solid #fff;
  border-right-color: #404040;
  border-bottom-color: #404040;
  font-family: monospace;
  font-size: 12px;
  text-decoration: none;
  display: inline-block;
  color: black !important; /* empêche le bleu */
}

/* Hover Win98 */
.win98-btn:hover {
  background: #E0E0E0;
}

/* Enfoncé Win98 */
.win98-btn:active {
  border: 2px solid #404040;
  border-right-color: #fff;
  border-bottom-color: #fff;
}
</style>
</head>
<body>
<main>
  <h1>Recherche</h1>
  <p style="font-size:14px;">Vous pouvez rechercher les noms ou les contenus des fichiers texte et .html mais uniquement les noms pour les .pdf et autres fichiers.</p>
  <input id="search" onkeyup="doSearch()" placeholder="Rechercher..." aria-label="Champ de recherche">
  <div id="count" style="margin: 0.5em 0; font-family: sans-serif;"></div>
  <div id="results"></div>

  <!-- Inclusion automatique de l’index généré -->
  <script src="docs.js"></script>

  <script>
  console.log(docs); // Debug : vérifier que docs est bien chargé

function doSearch() {
  var q = document.getElementById("search").value.toLowerCase();
  var out = "<ul>";
  var found = 0;

  for (var i=0; i<docs.length; i++) {
    if (docs[i].content.toLowerCase().indexOf(q) !== -1) {
      out += "<li>"
          + "<a href='" + docs[i].url + "' target='_self'>" + docs[i].title + "</a>"
          + " <a href='" + docs[i].url + "' download class='win98-btn'>Télécharger</a>"
          + "</li>";
      found++;
    }
  }

  out += "</ul>";

  // Affichage du compteur
  document.getElementById("count").textContent =
      found > 0 ? found + " résultat(s)" : "Aucun résultat";

  // Affichage des résultats
  document.getElementById("results").innerHTML =
      found > 0 ? out : "";
  
  // Sauvegarde
  sessionStorage.setItem("lastQuery", q);
  sessionStorage.setItem("lastResults", out);
  sessionStorage.setItem("lastCount", found);
}

// Au chargement de la page, restaurer
window.onload = function() {
  if (sessionStorage.getItem("lastQuery")) {
    document.getElementById("search").value = sessionStorage.getItem("lastQuery");
    document.getElementById("results").innerHTML = sessionStorage.getItem("lastResults");
  }
  if (sessionStorage.getItem("lastCount")) {
    var c = sessionStorage.getItem("lastCount");
    document.getElementById("count").textContent =
        c > 0 ? c + " résultat(s)" : "Aucun résultat";
  }
};
  </script>
</main>
</body>
</html>
