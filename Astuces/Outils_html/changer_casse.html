<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changer la casse</title>
<style>
body { background-color: #C0C0C0; }
textarea { width: 100%; height: 150px; overflow-x: auto; white-space: nowrap; }
pre { background: #eee; padding: 10px; white-space: pre-wrap; }
button { margin-top: 10px; padding: 6px 10px }
</style>
</head>
<body>

<h3>Changer la casse</h3>
<textarea id="input"></textarea>

<br>
<button onclick="minuscule()">minuscule</button>
<button onclick="majuscule()">MAJUSCULE</button>
<button onclick="inverser()">Inverser Casse</button>
<button onclick="copier()">Copier</button>

<h3>Résultat</h3>
<pre id="output"></pre>

<script>
// ------------------------------
// Compatibilité maximale (ES3)
// ------------------------------

function minuscule() {
  var txt = document.getElementById("input").value;
  document.getElementById("output").textContent = txt.toLowerCase();
}

function majuscule() {
  var txt = document.getElementById("input").value;
  document.getElementById("output").textContent = txt.toUpperCase();
}

function inverser() {
  var txt = document.getElementById("input").value;
  var out = "";
  for (var i = 0; i < txt.length; i++) {
    var c = txt.charAt(i);
    var lower = c.toLowerCase();
    var upper = c.toUpperCase();
    out += (c === lower) ? upper : lower;
  }
  document.getElementById("output").textContent = out;
}

// Bouton copier compatible anciens navigateurs
function copier() {
  var texte = document.getElementById("output").textContent;

  var temp = document.createElement("textarea");
  temp.value = texte;
  document.body.appendChild(temp);
  temp.select();

  try { document.execCommand("copy"); } catch (e) {}

  document.body.removeChild(temp);
}
</script>

</body>
</html>
