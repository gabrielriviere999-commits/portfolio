<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCR Multi-fichiers → PDF texte invisible</title>

<style>
/* ================================
   GLOBAL
================================ */

body {
  font-family: sans-serif;
  background: #008080;
  margin: 0;
  padding: 20px;
  color: black;
}

/* ================================
   FENÊTRE WIN98
================================ */

.win98-window {
  background: #c0c0c0;
  border: 2px solid #fff;
  border-right-color: #404040;
  border-bottom-color: #404040;
  padding: 0;
  width: 700px;
  margin: auto;
}

.win98-titlebar {
  background: #000080;
  color: white;
  padding: 4px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Bouton X */
.win98-titlebar button {
  width: 18px;
  height: 18px;
  padding: 0;
  margin: 0;
  font-size: 12px;
  line-height: 14px;
  text-align: center;
  background: #c0c0c0;
  border: 2px solid #fff;
  border-right-color: #404040;
  border-bottom-color: #404040;
  cursor: pointer;
}

.win98-titlebar button:hover {
  background: #e0e0e0;
  border-right-color: #202020;
  border-bottom-color: #202020;
}

.win98-titlebar button:active {
  background: #c0c0c0;
  border: 2px solid #404040;
  border-right-color: #fff;
  border-bottom-color: #fff;
  padding: 0;
  line-height: 13px;
}

.win98-content {
  padding: 10px;
}

/* ================================
   BOUTONS GÉNÉRIQUES WIN98
================================ */

button, .btn, input[type="file"] {
  font-family: inherit;
  background: #c0c0c0;
  border: 2px solid #fff;
  border-right-color: #404040;
  border-bottom-color: #404040;
  padding: 4px 8px;
  cursor: pointer;
}

button:hover, .btn:hover, input[type="file"]:hover {
  background: #dcdcdc;
  border-right-color: #202020;
  border-bottom-color: #202020;
}

button:active, .btn:active, input[type="file"]:active {
  background: #c0c0c0;
  border: 2px solid #404040;
  border-right-color: #fff;
  border-bottom-color: #fff;
  padding-top: 5px;
  padding-left: 9px;
}

/* ================================
   LISTE DE FICHIERS
================================ */

#fileList {
  list-style: none;
  padding: 0;
  margin-top: 10px;
}

#fileList li {
  padding: 8px;
  margin: 4px 0;
  background: #fff;
  border: 1px solid #000;
  cursor: grab;
  user-select: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#fileList li.dragging {
  opacity: 0.5;
}

.upBtn, .downBtn {
  background: #cce5ff;
}

.deleteBtn {
  background: #ff4444;
  color: white;
}

/* ================================
   ZONE DE DÉPÔT
================================ */

#dropZone {
  border: 2px dashed #000;
  background: #e0e0e0;
  padding: 20px;
  text-align: center;
  margin-bottom: 10px;
}

#dropZone.dragover {
  background: #ffffcc;
}
</style>
</head>
<body>
  <h3>OCR Multi-fichiers → PDF texte invisible</h3>

  <div id="dropZone">Déposez vos fichiers ici (images ou PDF)</div>

  <input type="file" id="files" multiple accept=".png,.jpg,.jpeg,.pdf">
  <ul id="fileList"></ul>

  <button id="convertBtn">Convertir</button>

<button id="about-btn">À propos des libraries / Crédits</button>
<button id="compat-btn">Compatibilité</button>

  <!-- OCR -->
  <script src="tesseract.min.js"></script>

  <!-- jsPDF -->
  <script src="jspdf.umd.min.js"></script>

  <!-- PDF-lib -->
  <script src="pdf-lib.min.js"></script>

  <script>
    const input = document.getElementById("files");
    const fileList = document.getElementById("fileList");
    const dropZone = document.getElementById("dropZone");
    const btn = document.getElementById("convertBtn");
    const statusEl = document.getElementById("status");

    let selectedFiles = [];

    // -----------------------------
    // 1) Ajout via input
    // -----------------------------
    input.onchange = () => {
      addFiles(Array.from(input.files));
    };

    // -----------------------------
    // 2) Ajout via drag & drop
    // -----------------------------
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      addFiles(Array.from(e.dataTransfer.files));
    });

    function addFiles(files) {
      for (const f of files) {
        if (f.type.match(/image|pdf/)) {
          selectedFiles.push(f);
        }
      }
      renderList();
    }

    // -----------------------------
    // 3) Affichage + tri + suppression + flèches
    // -----------------------------
    function renderList() {
      fileList.innerHTML = "";

      selectedFiles.forEach((file, index) => {
        const li = document.createElement("li");
        li.draggable = true;
        li.dataset.index = index;

        const nameSpan = document.createElement("span");
        nameSpan.textContent = file.name;

        // Boutons
        const controls = document.createElement("div");

        const up = document.createElement("button");
        up.textContent = "↑";
        up.className = "btn upBtn";
        up.onclick = () => moveUp(index);

        const down = document.createElement("button");
        down.textContent = "↓";
        down.className = "btn downBtn";
        down.onclick = () => moveDown(index);

        const del = document.createElement("button");
        del.textContent = "❌";
        del.className = "btn deleteBtn";
        del.onclick = () => {
          selectedFiles.splice(index, 1);
          renderList();
        };

        controls.appendChild(up);
        controls.appendChild(down);
        controls.appendChild(del);

        li.appendChild(nameSpan);
        li.appendChild(controls);

        // Drag & drop
        li.addEventListener("dragstart", () => {
          li.classList.add("dragging");
        });

        li.addEventListener("dragend", () => {
          li.classList.remove("dragging");
          updateOrder();
        });

        fileList.appendChild(li);
      });
    }

    // -----------------------------
    // 4) Fonctions flèches
    // -----------------------------
    function moveUp(i) {
      if (i === 0) return;
      const tmp = selectedFiles[i];
      selectedFiles[i] = selectedFiles[i - 1];
      selectedFiles[i - 1] = tmp;
      renderList();
    }

    function moveDown(i) {
      if (i === selectedFiles.length - 1) return;
      const tmp = selectedFiles[i];
      selectedFiles[i] = selectedFiles[i + 1];
      selectedFiles[i + 1] = tmp;
      renderList();
    }

    // -----------------------------
    // 5) Drag & drop interne
    // -----------------------------
    fileList.addEventListener("dragover", (e) => {
      e.preventDefault();
      const dragging = fileList.querySelector(".dragging");
      const after = getDragAfterElement(fileList, e.clientY);
      if (after == null) {
        fileList.appendChild(dragging);
      } else {
        fileList.insertBefore(dragging, after);
      }
    });

    function getDragAfterElement(container, y) {
      const items = [...container.querySelectorAll("li:not(.dragging)")];
      return items.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function updateOrder() {
      const newOrder = [];
      fileList.querySelectorAll("li").forEach(li => {
        newOrder.push(selectedFiles[li.dataset.index]);
      });
      selectedFiles = newOrder;
      renderList();
    }

    // -----------------------------
    // 6) Conversion OCR → PDF
    // -----------------------------
    btn.onclick = async () => {
      if (typeof WebAssembly !== "object") {
        alert("OCR non supporté sur ce navigateur.");
        return;
      }

      if (!selectedFiles.length) {
        alert("Aucun fichier.");
        return;
      }

      const { jsPDF } = window.jspdf;
      const finalPDF = new jsPDF({ unit: "pt", format: "a4" });

      let firstPage = true;

      for (const file of selectedFiles) {
        if (file.type === "application/pdf") {
          await processPDF(file, finalPDF, firstPage);
        } else {
          await processImage(file, finalPDF, firstPage);
        }
        firstPage = false;
      }

      finalPDF.save("resultat_ocr.pdf");
      statusEl.textContent = "PDF généré.";
    };

    // -----------------------------
    // 7) Traitement image
    // -----------------------------
    async function processImage(file, finalPDF, firstPage) {
      statusEl.textContent = "OCR image : " + file.name;

      const url = URL.createObjectURL(file);
      const img = new Image();
      img.src = url;
      await img.decode();

      const textData = await Tesseract.recognize(url, "fra+eng", {
        logger: m => statusEl.textContent = m.status + " " + Math.round((m.progress||0)*100) + "%"
      });

      addPageWithOCR(finalPDF, img, textData.data.words, firstPage);
      URL.revokeObjectURL(url);
    }

    // -----------------------------
    // 8) Traitement PDF image-only
    // -----------------------------
    async function processPDF(file, finalPDF, firstPage) {
      statusEl.textContent = "Lecture PDF : " + file.name;

      const arrayBuffer = await file.arrayBuffer();
      const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
      const pages = pdfDoc.getPages();

      for (let i = 0; i < pages.length; i++) {
        statusEl.textContent = "Extraction page " + (i+1);

        const png = await pages[i].renderToImage({ scale: 2 });
        const img = new Image();
        img.src = png;
        await img.decode();

        const textData = await Tesseract.recognize(png, "fra+eng", {
          logger: m => statusEl.textContent = m.status + " " + Math.round((m.progress||0)*100) + "%"
        });

        addPageWithOCR(finalPDF, img, textData.data.words, firstPage);
        firstPage = false;
      }
    }

    // -----------------------------
    // 9) Ajout page image + texte invisible
    // -----------------------------
    function addPageWithOCR(doc, img, words, firstPage) {
      if (!firstPage) doc.addPage();

      const pageW = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();

      const ratio = Math.min(pageW / img.width, pageH / img.height);
      const w = img.width * ratio;
      const h = img.height * ratio;
      const x = (pageW - w) / 2;
      const y = (pageH - h) / 2;

      doc.addImage(img, "JPEG", x, y, w, h);

      const invisible = new doc.GState({ opacity: 0 });
      doc.setGState(invisible);

      doc.setFontSize(10);
      doc.setTextColor(0, 0, 0);

      for (const word of words) {
        const bx = x + (word.bbox.x0 * ratio);
        const by = y + (word.bbox.y1 * ratio);
        doc.text(word.text, bx, by);
      }

      doc.setGState(new doc.GState({ opacity: 1 }));
    }

/* ============================
   Infos
============================ */
document.getElementById("about-btn").onclick = function () {
  window.location.href = "credits.txt";
};

document.getElementById("compat-btn").onclick = function () {
  window.location.href = "compatibilite.txt";
};
  </script>
</body>
</html>
