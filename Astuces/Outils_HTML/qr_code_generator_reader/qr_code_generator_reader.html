<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Générateur & Lecteur de QR Code</title>

<style>
body {
  font-family: monospace;
  background: #008080;
  padding: 1rem;
  margin: 0;
}

.section {
  background: #C0C0C0;
  border: 2px solid #FFFFFF;
  border-right-color: #404040;
  border-bottom-color: #404040;
  padding: 10px;
  margin-bottom: 1rem;
}

h1, h2 {
  font-weight: bold;
  color: #000000;
  margin-top: 0;
}

label {
  font-weight: bold;
}

textarea, input {
  width: 100%;
  padding: 4px;
  margin: 4px 0;
  box-sizing: border-box;
  border: 2px solid #FFFFFF;
  border-right-color: #404040;
  border-bottom-color: #404040;
  background: #FFFFFF;
  font-family: monospace;
  font-size: 14px;
}

textarea {
  height: 150px;
}

button {
  padding: 4px 10px;
  margin-top: 4px;
  cursor: pointer;
  background: #C0C0C0;
  border: 2px solid #FFFFFF;
  border-right-color: #404040;
  border-bottom-color: #404040;
  font-family: monospace;
}

button:hover {
  background: #E0E0E0;
}

a.btn {
  display: inline-block;
  padding: 4px 10px;
  margin-top: 4px;
  cursor: pointer;
  background: #C0C0C0;
  border: 2px solid #FFFFFF;
  border-right-color: #404040;
  border-bottom-color: #404040;
  font-family: monospace;
  color: black;
  text-decoration: none;
}

a.btn:hover {
  background: #E0E0E0;
}

a.btn:active {
  border: 2px solid #404040;
  border-right-color: #FFFFFF;
  border-bottom-color: #FFFFFF;
}

textarea:hover,
input:hover {
  background: #FFFFE0;
}

button:active {
  border: 2px solid #404040;
  border-right-color: #FFFFFF;
  border-bottom-color: #FFFFFF;
}

#qrcode {
  margin-top: 1rem;
  background: #FFFFFF;
  padding: 10px;
  border: 2px inset #808080;
}

#video {
  width: 100%;
  max-width: 320px;
  background: #000000;
  border: 2px inset #808080;
}
</style>
</head>
<body>

<h1>Générateur & Lecteur de QR Code</h1>

<div class="section">
  <h2>Générer un QR Code</h2>

  <label for="text">Texte / Numéro</label>
  <textarea id="text"></textarea>

<div class="block">
  <h2>Couleurs du QR</h2>

  <label>Couleur du QR :</label>
  <input type="color" id="qrColor" value="#000000"><br><br>

  <label>Couleur du fond :</label>
  <input type="color" id="bgColor" value="#ffffff">
</div>

  <button id="btn-generate">Générer</button>

  <div id="qrcode"></div>

  <button id="export-png">Exporter PNG</button>
  <button id="export-jpg">Exporter JPG</button>

</div>

<div class="section">
  <h2>Décoder un QR Code (PNG ou JPG)</h2>

  <input type="file" id="file-input" accept="image/*">
  <canvas id="canvas-file" style="display:none;"></canvas>

  <pre id="decode-file" style="
    white-space: pre-wrap;
    background:#FFFFFF;
    padding:10px;
    border:2px inset #808080;
    margin-top:10px;
  "></pre>

  <button id="copy-btn">Copier</button>
  <span id="copy-feedback"
        style="margin-left:8px;color:green;font-weight:bold;display:none;font-family:monospace;">
    Copié
  </span>

  <a href="credits.txt" class="btn">À propos des libraries / Crédits</a>
</div>

<!-- Librairies nécessaires -->
<script src="zxing-es5.min.js"></script>
<script src="qrcode.js"></script>

<script>
/* ============================
   UTF‑8 / Base64
============================ */
function decodeUTF8(str) {
  try {
    var bytes = new Uint8Array(str.split('').map(function(c){ return c.charCodeAt(0); }));
    return new TextDecoder("utf-8").decode(bytes);
  } catch(e) {
    return str;
  }
}

function encodeBase64(str) {
  try { return btoa(unescape(encodeURIComponent(str))); }
  catch(e) { return btoa(str); }
}

function decodeBase64(str) {
  try { return decodeURIComponent(escape(atob(str))); }
  catch(e) { return atob(str); }
}

/* ============================
   GÉNÉRATION QR (COMPATIBLE 3DS)
============================ */
var text = document.getElementById("text");
var btnGen = document.getElementById("btn-generate");
var qrDiv = document.getElementById("qrcode");

function drawQRImage(img) {
  var canvas = document.createElement("canvas");
  canvas.width = img.width;
  canvas.height = img.height;

  var ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0);

  var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  var data = imgData.data;

  var fg = document.getElementById("qrColor").value;
  var bg = document.getElementById("bgColor").value;

  var fgR = parseInt(fg.slice(1, 3), 16);
  var fgG = parseInt(fg.slice(3, 5), 16);
  var fgB = parseInt(fg.slice(5, 7), 16);

  var bgR = parseInt(bg.slice(1, 3), 16);
  var bgG = parseInt(bg.slice(3, 5), 16);
  var bgB = parseInt(bg.slice(5, 7), 16);

  for (var i = 0; i < data.length; i += 4) {
    if (data[i] < 128) {
      data[i] = fgR;
      data[i+1] = fgG;
      data[i+2] = fgB;
    } else {
      data[i] = bgR;
      data[i+1] = bgG;
      data[i+2] = bgB;
    }
  }

  ctx.putImageData(imgData, 0, 0);

// === Rognage automatique du contour ===
var w = canvas.width;
var h = canvas.height;
var d = ctx.getImageData(0, 0, w, h).data;

var minX = w, minY = h, maxX = 0, maxY = 0;

for (var y = 0; y < h; y++) {
  for (var x = 0; x < w; x++) {
    var i = (y * w + x) * 4;

    // Pixel non-fond (donc partie du QR)
    if (d[i] !== bgR || d[i+1] !== bgG || d[i+2] !== bgB) {
      if (x < minX) minX = x;
      if (y < minY) minY = y;
      if (x > maxX) maxX = x;
      if (y > maxY) maxY = y;
    }
  }
}

var newW = maxX - minX + 1;
var newH = maxY - minY + 1;

var cropped = document.createElement("canvas");
cropped.width = newW;
cropped.height = newH;

var cctx = cropped.getContext("2d");
cctx.drawImage(canvas, minX, minY, newW, newH, 0, 0, newW, newH);

qrDiv.innerHTML = "";
qrDiv.appendChild(cropped);
return;

  qrDiv.innerHTML = "";
  qrDiv.appendChild(canvas);
}

function generateQR() {
  var value = text.value.trim();
  qrDiv.innerHTML = "";

  var qr = qrcode(0, 'H');
  qr.addData(value, 'Byte');
  qr.make();

  var imgTag = qr.createImgTag(4);
  var src = imgTag.match(/src="([^"]+)"/)[1];

  var img = new Image();
  var is3DS = navigator.userAgent.indexOf("Nintendo 3DS") !== -1;

  if (is3DS) {
    img.src = src;
    setTimeout(function(){ drawQRImage(img); }, 50);
  } else {
    img.onload = function(){ drawQRImage(img); };
    img.src = src;
  }
}

btnGen.onclick = generateQR;
document.getElementById("qrColor").oninput = generateQR;
document.getElementById("bgColor").oninput = generateQR;

/* ============================
   EXPORT PNG / JPG
============================ */
document.getElementById("export-png").onclick = function () {
  var qrCanvas = qrDiv.querySelector("canvas");
  if (!qrCanvas) return;
  download("code.png", qrCanvas.toDataURL("image/png"));
};

document.getElementById("export-jpg").onclick = function () {
  var qrCanvas = qrDiv.querySelector("canvas");
  if (!qrCanvas) return;
  download("code.jpg", qrCanvas.toDataURL("image/jpeg"));
};

function download(filename, dataUrl) {
  var a = document.createElement("a");
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* ============================
   DÉCODAGE FICHIER (PC SEULEMENT)
============================ */
var fileInput = document.getElementById("file-input");
var canvasFile = document.getElementById("canvas-file");
var ctxFile = canvasFile.getContext("2d");
var decodeFile = document.getElementById("decode-file");

if (typeof ZXing === "undefined" || !ZXing.BrowserQRCodeReader) {
  fileInput.disabled = true;
  decodeFile.innerText = "Lecture QR désactivée (ZXing non chargé).";
} else {

  var readerZX = new ZXing.BrowserQRCodeReader();

  fileInput.onchange = function (e) {
    var file = e.target.files[0];
    if (!file) return;

    var img = new Image();
    img.onload = function () {

      var maxSize = 1000;
      var scale = Math.min(maxSize / img.width, maxSize / img.height, 1);

      canvasFile.width = img.width * scale;
      canvasFile.height = img.height * scale;

      ctxFile.drawImage(
        img,
        0, 0, img.width, img.height,
        0, 0, canvasFile.width, canvasFile.height
      );

      var tempImg = new Image();
      tempImg.onload = function () {
        readerZX.decodeFromImageElement(tempImg)
          .then(function(result){ decodeFile.innerText = result.text; })
          .catch(function(){ decodeFile.innerText = "Aucun QR détecté."; });
      };

      tempImg.src = canvasFile.toDataURL("image/png");
    };

    img.src = URL.createObjectURL(file);
  };
}
</script>
</body>
</html>
