<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur de tableau HTML</title>

<link rel="stylesheet" href="handsontable.full.min.css">
<script src="handsontable.full.min.js"></script>

<style>
body { background:#C0C0C0; font-family:sans-serif; padding:20px; }
textarea { width:100%; height:150px; }
#preview { background:white; height:400px; overflow:auto; margin-top:10px; }
.win98-btn { padding:8px 12px; background:#C0C0C0; border:2px solid #fff; border-right-color:#404040; border-bottom-color:#404040; font-size:14px; text-decoration:none; display:inline-block; color:black; }
.win98-btn:active { border:2px solid #404040; border-right-color:#fff; border-bottom-color:#fff; }
.win98-btn:hover { background:#E0E0E0; }
input { margin:5px; }
</style>

</head>
<body>

<h2>Éditeur de tableau HTML</h2>

<textarea id="input" placeholder="Collez ici un tableau HTML ou du texte brut..."></textarea>

<br>

<label>Séparateur :</label> <input type="text" id="sep" value=";" style="width:40px;">
<button onclick="alignerGlobal('left')">Aligner tout à gauche</button>
<button onclick="alignerGlobal('center')">Aligner tout au centre</button>
<button onclick="alignerGlobal('right')">Aligner tout à droite</button>
<button onclick="couleurGlobal('color')">Couleur texte (global)</button>
<button onclick="couleurGlobal('backgroundColor')">Couleur fond (global)</button>

<br>
<button onclick="convertir()" class="win98-btn">Convertir</button>
<button onclick="copierCode()" class="win98-btn">Copier le code</button>

<h3>Aperçu</h3>
<div id="preview"></div>

<h3>HTML généré (modifiable)</h3>
<textarea id="output"></textarea>
<button onclick="mettreAJourDepuisHTML()" class="win98-btn">Mettre à jour le tableau</button>
<p></p>
<a href="credits.txt" class="win98-btn">À propos des libraries / Crédits</a>

<script>
var hot = null;
var styles = {};

function convertir() {
    var input = document.getElementById("input").value.trim();
    var rows = [];
    var sep = document.getElementById("sep").value || ";";

    if (input.indexOf("<table") === 0) {
        chargerDepuisHTML(input);
        return;
    } else {
        var lines = input.split("\n");
        for (var i = 0; i < lines.length; i++) {
            rows.push(lines[i].split(sep));
        }
    }

    if (hot) {
        hot.destroy();
        hot = null;
    }
    initTable(rows);
}

function mettreAJourDepuisHTML() {
    var html = document.getElementById("output").value.trim();

    // Si c'est un tableau → Handsontable
    if (html.indexOf("<table") !== -1) {
        chargerDepuisHTML(html);
        return;
    }

    // Sinon → affichage brut dans l’aperçu
    if (hot) {
        hot.destroy();
        hot = null;
    }

    document.getElementById("preview").innerHTML = html;
}

function chargerDepuisHTML(html) {
    if (html.indexOf("<table") === -1) return;

    var container = document.createElement("div");
    container.innerHTML = html;
    var table = container.querySelector("table");
    if (!table) return;

    var rows = [];
    var trs = table.querySelectorAll("tr");

    for (var i = 0; i < trs.length; i++) {
        var cells = trs[i].querySelectorAll("td");
        var row = [];

        for (var j = 0; j < cells.length; j++) {
            row.push(cells[j].innerHTML.replace(/<br>/g, "\n"));
        }

        rows.push(row);
    }

    if (hot) {
        hot.destroy();
        hot = null;
    }

    initTable(rows);
}

function initTable(rows) {
    var preview = document.getElementById("preview");
    preview.innerHTML = "";

    hot = new Handsontable(preview, {
        data: rows,
        rowHeaders: true,
        colHeaders: true,
        mergeCells: true,
        wordWrap: true,
        enterBeginsEditing: true,

        // Entrée = retour ligne
        beforeKeyDown: function(e) {
            if (e.key !== "Enter") return;

            var editor = hot.getActiveEditor();

            // Si on est en train d'éditer une cellule
            if (editor && editor.isOpened()) {
                e.stopImmediatePropagation();
                e.preventDefault();

                var textarea = editor.TEXTAREA;
                var start = textarea.selectionStart;
                var end = textarea.selectionEnd;
                var value = textarea.value;

                // Insertion propre du saut de ligne
                textarea.value =
                    value.substring(0, start) +
                    "\n" +
                    value.substring(end);

                // replacer le curseur
                textarea.selectionStart = textarea.selectionEnd = start + 1;
            }
        },

        cells: function () {
            return {
                renderer: function(instance, td, row, col, prop, value) {
                    var key = row + "-" + col;
                    td.innerHTML = (value || "").replace(/\n/g, "<br>");

                    if (styles[key]) {
                        for (var s in styles[key]) {
                            td.style[s] = styles[key][s];
                        }
                    }
                }
            };
        },

        contextMenu: {
            items: {
                row_above: { name: "Insérer ligne au-dessus" },
                row_below: { name: "Insérer ligne en dessous" },
                col_left: { name: "Insérer colonne gauche" },
                col_right: { name: "Insérer colonne droite" },
                remove_row: { name: "Supprimer ligne" },
                remove_col: { name: "Supprimer colonne" },
                mergeCells: { name: "Fusionner / Défusionner" },

                "sep1": "---------",

                align_left: { name: "Aligner à gauche", callback: function () { setStyle("textAlign", "left"); } },
                align_center: { name: "Aligner au centre", callback: function () { setStyle("textAlign", "center"); } },
                align_right: { name: "Aligner à droite", callback: function () { setStyle("textAlign", "right"); } },

                "sep2": "---------",

                text_color: { name: "Couleur texte", callback: function () { choisirCouleur("color"); } },
                bg_color: { name: "Couleur fond", callback: function () { choisirCouleur("backgroundColor"); } },
                border_color: { name: "Couleur bordure", callback: function () { choisirCouleur("borderColor"); } }
            }
        },

        afterChange: updateOutput,
        afterMergeCells: updateOutput,
        afterUnmergeCells: updateOutput,
        afterCreateRow: function(index, amount) {
            shiftStylesRow(index, amount);
            updateOutput();
        },

        afterCreateCol: function(index, amount) {
            shiftStylesCol(index, amount);
            updateOutput();
        },

        afterRemoveRow: function(index, amount) {
            shiftStylesRow(index, -amount);
            updateOutput();
        },

        afterRemoveCol: function(index, amount) {
            shiftStylesCol(index, -amount);
            updateOutput();
        }
    });

    updateOutput();
}

function setStyle(prop, value) {
    var selected = hot.getSelected();
    if (!selected) return;

    var r1 = selected[0][0];
    var c1 = selected[0][1];
    var r2 = selected[0][2];
    var c2 = selected[0][3];

    for (var r = r1; r <= r2; r++) {
        for (var c = c1; c <= c2; c++) {
            var key = r + "-" + c;
            styles[key] = styles[key] || {};
            styles[key][prop] = value;
        }
    }
    hot.render();
    updateOutput();
}

function choisirCouleur(prop) {
    var color = prompt("Couleur (red, #ff0000...)");
    if (color) setStyle(prop, color);
}

function alignerGlobal(direction) {
    if (!hot) return;

    var data = hot.getData();
    for (var r = 0; r < data.length; r++) {
        for (var c = 0; c < data[r].length; c++) {
            var key = r + "-" + c;
            styles[key] = styles[key] || {};
            styles[key].textAlign = direction;
        }
    }

    hot.render();
    updateOutput();
}

function couleurGlobal(prop) {
    if (!hot) return;

    var color = prompt("Couleur (red, #ff0000...)");
    if (!color) return;

    var data = hot.getData();
    for (var r = 0; r < data.length; r++) {
        for (var c = 0; c < data[r].length; c++) {
            var key = r + "-" + c;
            styles[key] = styles[key] || {};
            styles[key][prop] = color;
        }
    }

    hot.render();
    updateOutput();
}

function shiftStylesRow(startRow, delta) {
    var newStyles = {};

    for (var key in styles) {
        var parts = key.split("-");
        var r = parseInt(parts[0], 10);
        var c = parseInt(parts[1], 10);

        if (r >= startRow) {
            r += delta;
        }

        newStyles[r + "-" + c] = styles[key];
    }

    styles = newStyles;
}

function shiftStylesCol(startCol, delta) {
    var newStyles = {};

    for (var key in styles) {
        var parts = key.split("-");
        var r = parseInt(parts[0], 10);
        var c = parseInt(parts[1], 10);

        if (c >= startCol) {
            c += delta;
        }

        newStyles[r + "-" + c] = styles[key];
    }

    styles = newStyles;
}
function updateOutput() {
    if (!hot) return;

    var data = hot.getData();
    var merges = hot.getPlugin("mergeCells").mergedCellsCollection.mergedCells;

    var html = '<table border="1" style="border-collapse:collapse;">';

    for (var r = 0; r < data.length; r++) {
        html += "<tr>";

        for (var c = 0; c < data[r].length; c++) {

            var merge = null;
            for (var m = 0; m < merges.length; m++) {
                if (merges[m].row === r && merges[m].col === c) {
                    merge = merges[m];
                    break;
                }
            }

            var key = r + "-" + c;
            var styleStr = "";

            if (styles[key]) {
                for (var s in styles[key]) {
                    styleStr += s.replace(/[A-Z]/g, function (m) { return "-" + m.toLowerCase(); }) 
                              + ":" + styles[key][s] + ";";
                }
            }

            if (merge) {
                html += '<td rowspan="' + merge.rowspan + '" colspan="' + merge.colspan + '" style="' + styleStr + '">' +
                        (data[r][c] || "&nbsp;") + "</td>";
            } else {
                var covered = false;
                for (var m = 0; m < merges.length; m++) {
                    var M = merges[m];
                    if (r >= M.row && r < M.row + M.rowspan &&
                        c >= M.col && c < M.col + M.colspan &&
                        !(r === M.row && c === M.col)) {
                        covered = true;
                        break;
                    }
                }

                if (!covered) {
                    html += '<td style="' + styleStr + '">' +
                            (data[r][c] || "&nbsp;") + "</td>";
                }
            }
        }

        html += "</tr>";
    }

    html += "</table>";

    document.getElementById("output").value = html;
}

function copierCode() {
    var texte = document.getElementById("output").value;

    var temp = document.createElement("textarea");
    temp.value = texte;
    document.body.appendChild(temp);
    temp.select();

    try { document.execCommand("copy"); } catch (e) {}

    document.body.removeChild(temp);
}
</script>

</body>
</html>
