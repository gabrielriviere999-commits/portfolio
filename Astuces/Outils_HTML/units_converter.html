<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertisseur d'unités</title>

<style>
  body { margin:20px; background:#C0C0C0; font-family:sans-serif; }

  .dropdown {
    border:1px solid #444;
    background:#fff;
    padding:6px;
    cursor:pointer;
    user-select:none;
  }

  .dropdown-selected {
    font-weight:bold;
  }

  .dropdown-list {
    border:1px solid #444;
    background:#fff;
    margin-top:4px;
    max-height:200px;
    overflow-y:auto;
    display:none;
  }

  .dropdown-list div {
    padding:6px;
    border-bottom:1px solid #ccc;
  }

  .dropdown-list div:hover {
    background:#e0e0e0;
  }

  .block {
    background:#e8e8e8;
    padding:10px;
    margin-top:15px;
    border-radius:5px;
  }
</style>
</head>
<body>

<h1>Convertisseur</h1>

<!-- CATEGORIE -->
<div class="block">
  <label>Catégorie :</label>
  <div class="dropdown" id="catDrop">
    <div class="dropdown-selected" id="catSelected" tabindex="0">—</div>
    <div class="dropdown-list" id="catList"></div>
  </div>
</div>

<div class="block">
  <label for="inputValue">Valeur à convertir :</label>
  <input type="text" id="inputValue" value="1">
</div>

<!-- DE -->
<div class="block">
  <label>Rechercher "De" :</label>
  <input type="text" id="searchFrom">

  <!-- MENU DE RECHERCHE SÉPARÉ -->
  <div class="dropdown-list" id="fromSearchList" style="display:none;"></div>

  <label>De :</label>
  <div class="dropdown" id="fromDrop">
    <div class="dropdown-selected" id="fromSelected" tabindex="0">—</div>
    <div class="dropdown-list" id="fromList"></div>
  </div>
</div>

<!-- VERS -->
<div class="block">
  <label>Rechercher "Vers" :</label>
  <input type="text" id="searchTo">

  <!-- MENU DE RECHERCHE SÉPARÉ POUR VERS -->
  <div class="dropdown-list" id="toSearchList" style="display:none;"></div>

  <label>Vers :</label>
  <div class="dropdown" id="toDrop">
    <div class="dropdown-selected" id="toSelected" tabindex="0">—</div>
    <div class="dropdown-list" id="toList"></div>
  </div>
</div>

<p>
  Résultat : <strong id="result">—</strong>
  <button id="copyBtn">Copier</button>
  <span id="copyFeedback" style="margin-left:10px; color:green; display:none;">Copié !</span>
</p>

<script>
// ===============================
// 1. Catégories
// ===============================
var categories = {
    distance:{base:"m",units:{m:1,km:1000,cm:0.01,mm:0.001,mi:1609.344,yd:0.9144,ft:0.3048,in:0.0254,nmi:1852}},
    acceleration:{base:"m/s²",units:{"m/s²":1,"cm/s²":0.01,"ft/s²":0.3048,"in/s²":0.0254,"km/h·s":1000/3600,"mi/h·s":1609.344/3600,"mi/h·min":1609.344/(3600*60),g:9.80665}},
    masse:{base:"kg",units:{kg:1,g:0.001,mg:0.000001,t:1000,lb:0.45359237,oz:0.0283495231,stone:6.35029318}},
    volume:{base:"L",units:{L:1,mL:0.001,m3:1000,"ft3":28.316846592,gal_US:3.785411784,qt_US:0.946352946,pt_US:0.473176473,cup_US:0.2365882365}},
    volume_sec:{base:"L",units:{L:1,cup_dry_US:0.2365882365,pt_dry_US:0.550610471,qt_dry_US:1.101220942,gal_dry_US:4.40488377,bushel_US:35.23907017}},
    surface:{base:"m²",units:{"m²":1,"cm²":0.0001,"mm²":0.000001,"km²":1000000,ha:10000,"ft²":0.09290304,"in²":0.00064516,acre:4046.8564224}},
    vitesse:{base:"m/s",units:{"m/s":1,"km/h":1000/3600,"mph":1609.344/3600,"kn":1852/3600,"ft/s":0.3048}},
    temps:{base:"s",units:{s:1,ms:0.001,min:60,h:3600,jour:86400,semaine:604800,an:31557600}},
    energie:{base:"J",units:{J:1,kJ:1000,Wh:3600,kWh:3600000,cal:4.184,kcal:4184,BTU:1055.05585}},
    puissance:{base:"W",units:{W:1,kW:1000,MW:1000000,hp_mec:745.699872,hp_met:735.49875}},
    force:{base:"N",units:{N:1,kN:1000,dyn:0.00001,lbf:4.4482216152605,kgf:9.80665}},
    pression:{base:"Pa",units:{Pa:1,kPa:1000,bar:100000,mbar:100,psi:6894.757293168,atm:101325,mmHg:133.3223684211}},
    densite:{base:"kg/m³",units:{"kg/m³":1,"g/cm³":1000,"g/L":1,"lb/ft³":16.01846337}},
    debit:{base:"m³/s",units:{"m³/s":1,"m³/h":1/3600,"L/s":0.001,"L/min":0.001/60,"L/h":0.001/3600,"gal_US/min":3.785411784/60}},
    angle:{base:"rad",units:{rad:1,deg:Math.PI/180,grad:Math.PI/200,tour:2*Math.PI}},
    lumiere:{base:"lx",units:{lx:1,"foot-candle":10.76391041671}},
    temperature:{special:true,units:["C","F","K"]},
    custom:{special:"custom",units:{}},
    donnees:{units:{
        "b":1,"B":8,"kB":8000,"MB":8000000,"GB":8000000000,"TB":8000000000000,
        "PB":8000000000000000,"EB":8000000000000000000,
        "KiB":8192,"MiB":8388608,"GiB":8589934592,"TiB":8796093022208,
        "PiB":9007199254740992,"EiB":9223372036854775808
    }}
};

// ===============================
// 1.2 Dictionnaire
// ===============================
var unitNames = {
  "km": "kilomètre",
  "m": "mètre",
  "cm": "centimètre",
  "mm": "millimètre",
  "mi": "mile",
  "yd": "yard",
  "ft": "pied",
  "in": "pouce",
  "kg": "kilogramme",
  "g": "gramme",
  "mg": "milligramme",
  "lb": "livre",
  "oz": "once",
  "L": "litre",
  "mL": "millilitre",
  "°C": "celsius",
  "°F": "fahrenheit",
  "K": "kelvin"
};

// ===============================
// 2. Extraire les unités
// ===============================
function getUnitList(cat) {
  if (!cat) return [];
  if (cat.special === true) return cat.units;

  var arr = [];
  for (var k in cat.units) arr.push(k);
  return arr;
}

// ===============================
// 3. Liste globale des unités + map unité → catégorie
// ===============================

var allUnits = [];
var unitToCategory = {};

function buildGlobalUnitList() {
  var catName, cat, units, i;

  for (catName in categories) {
    cat = categories[catName];
    units = getUnitList(cat);

    for (i = 0; i < units.length; i++) {
      var u = units[i];
      allUnits.push(u);
      unitToCategory[u] = catName;
    }
  }
}

// ===============================
// 4. Dropdown générique
// ===============================
function createDropdown(selectedId, listId, onSelect) {
  var selected = document.getElementById(selectedId);
  var list = document.getElementById(listId);
  var isOpen = false;
  var options = [];
  var activeIndex = -1;

  list.style.display = "none";

function highlight() {
  var i;
  for (i = 0; i < options.length; i++) {
    options[i].style.background = (i === activeIndex) ? "#ddd" : "";
  }

  // scroll automatique
  if (activeIndex >= 0 && activeIndex < options.length) {
    options[activeIndex].scrollIntoView({
      block: "nearest"
    });
  }
}

  selected.onclick = function () {
    if (isOpen) {
      list.style.display = "none";
      isOpen = false;
      activeIndex = -1;
      highlight();
    } else {
      list.style.display = "block";
      isOpen = true;
      activeIndex = (options.length > 0) ? 0 : -1;
      highlight();
    }
  };

  selected.onkeydown = function (e) {
    var code = e.keyCode || e.which;

    // Entrée ou Espace : ouvrir / valider
    if (code === 13 || code === 32) {
      if (!isOpen) {
        selected.onclick(); // ouvre le menu
      } else {
        if (activeIndex >= 0 && activeIndex < options.length) {
          options[activeIndex].onclick(); // sélectionne l’option
        }
      }
      if (e.preventDefault) e.preventDefault();
      return false;
    }

    if (!isOpen) return;

    if (code === 40) { // ↓
      activeIndex++;
      if (activeIndex >= options.length) activeIndex = 0;
      highlight();
      if (e.preventDefault) e.preventDefault();
      return false;
    }

    if (code === 38) { // ↑
      activeIndex--;
      if (activeIndex < 0) activeIndex = options.length - 1;
      highlight();
      if (e.preventDefault) e.preventDefault();
      return false;
    }
  };

  function fill(arr) {
    list.innerHTML = "";
    options = [];
    activeIndex = -1;

    var i;
    for (i = 0; i < arr.length; i++) {
      (function (opt) {
        var div = document.createElement("div");

        var label = opt;
        if (unitNames[opt]) {
          label = opt + " — " + unitNames[opt];
        }

        div.appendChild(document.createTextNode(label));

        div.onclick = function () {
          selected.innerHTML = label;
          list.style.display = "none";
          isOpen = false;
          activeIndex = -1;
          highlight();
          onSelect(opt);
        };

        list.appendChild(div);
        options.push(div);
      })(arr[i]);
    }
  }

  return fill;
}

// ===============================
// 5. Variables global + création des 3 menus
// ===============================
var selectedCategory = null;
var selectedFrom = null;
var selectedTo = null;

var fillCategory = createDropdown("catSelected", "catList", function(opt){
  selectedCategory = opt;
  updateUnits();
});

var fillFrom = createDropdown("fromSelected", "fromList", function(opt){
  selectedFrom = opt;

  // Trouver la catégorie de cette unité
  var catName = unitToCategory[opt];

  // Si la catégorie change
  if (catName && selectedCategory !== catName) {
    selectedCategory = catName;
    document.getElementById("catSelected").innerHTML = catName;

    // Mettre à jour les unités
    updateUnits();

    // Réappliquer la sélection automatiquement
    document.getElementById("fromSelected").innerHTML = opt;
    selectedFrom = opt;
  }

  convert();
});

var fillTo = createDropdown("toSelected", "toList", function(opt){
  selectedTo = opt;

  var catName = unitToCategory[opt];

  if (catName && selectedCategory !== catName) {
    selectedCategory = catName;
    document.getElementById("catSelected").innerHTML = catName;

    updateUnits();

    document.getElementById("toSelected").innerHTML = opt;
    selectedTo = opt;
  }

  convert();
});

// ===============================
// 6. Mise à jour des unités
// ===============================
function updateUnits() {
  var cat = categories[selectedCategory];
  var units = getUnitList(cat);

  fillFrom(units);
  fillTo(units);

  selectedFrom = null;
  selectedTo = null;

  document.getElementById("fromSelected").innerHTML = "—";
  document.getElementById("toSelected").innerHTML = "—";
  document.getElementById("result").innerHTML = "—";
}

// ===============================
// 7. Recherche globale (De + Vers)
// ===============================
// --- Recherche "De" avec noms + clavier + scroll ---
document.getElementById("searchFrom").oninput = function () {
  var q = this.value.toLowerCase();
  var list = document.getElementById("fromSearchList");
  var i;

  list.innerHTML = "";

  if (q === "") {
    list.style.display = "none";
    return;
  }

  var filtered = [];
  for (i = 0; i < allUnits.length; i++) {
    var u = allUnits[i];
    var name = unitNames[u] ? unitNames[u].toLowerCase() : "";

    if (u.toLowerCase().indexOf(q) !== -1 || name.indexOf(q) !== -1) {
      filtered.push(u);
    }
  }

  for (i = 0; i < filtered.length; i++) {
    (function(unit){
      var div = document.createElement("div");

      var label = unit;
      if (unitNames[unit]) {
        label = unit + " — " + unitNames[unit];
      }

      div.appendChild(document.createTextNode(label));

      div.onclick = function () {
        var catName = unitToCategory[unit];

        if (selectedCategory !== catName) {
          selectedCategory = catName;
          document.getElementById("catSelected").innerHTML = catName;
          updateUnits();
        }

        selectedFrom = unit;
        document.getElementById("fromSelected").innerHTML = label;

        list.style.display = "none";
        convert();
      };

      list.appendChild(div);
    })(filtered[i]);
  }

  list.style.display = filtered.length ? "block" : "none";
};


// --- Navigation clavier pour la recherche "De" ---
(function(){
  var input = document.getElementById("searchFrom");
  var list  = document.getElementById("fromSearchList");
  var searchOptions = [];
  var activeIndex = -1;

  function highlight() {
    var i;
    for (i = 0; i < searchOptions.length; i++) {
      searchOptions[i].style.background = (i === activeIndex) ? "#ddd" : "";
    }
    if (activeIndex >= 0 && activeIndex < searchOptions.length) {
      searchOptions[activeIndex].scrollIntoView({ block: "nearest" });
    }
  }

  var oldInput = input.oninput;
  input.oninput = function(){
    oldInput.call(this);

    searchOptions = [];
    var children = list.children;
    var i;
    for (i = 0; i < children.length; i++) {
      searchOptions.push(children[i]);
    }

    activeIndex = (searchOptions.length > 0) ? 0 : -1;
    highlight();
  };

  input.onkeydown = function(e){
    var code = e.keyCode || e.which;

    if (list.style.display !== "block") return;

    if (code === 40) { // ↓
      activeIndex++;
      if (activeIndex >= searchOptions.length) activeIndex = 0;
      highlight();
      e.preventDefault();
      return false;
    }

    if (code === 38) { // ↑
      activeIndex--;
      if (activeIndex < 0) activeIndex = searchOptions.length - 1;
      highlight();
      e.preventDefault();
      return false;
    }

    if (code === 13) { // Entrée
      if (activeIndex >= 0 && activeIndex < searchOptions.length) {
        searchOptions[activeIndex].onclick();
      }
      e.preventDefault();
      return false;
    }
  };
})();

// --- Recherche "Vers" avec noms + clavier + scroll ---
document.getElementById("searchTo").oninput = function () {
  var q = this.value.toLowerCase();
  var list = document.getElementById("toSearchList");
  var i;

  list.innerHTML = "";

  if (q === "") {
    list.style.display = "none";
    return;
  }

  var filtered = [];
  for (i = 0; i < allUnits.length; i++) {
    var u = allUnits[i];
    var name = unitNames[u] ? unitNames[u].toLowerCase() : "";

    if (u.toLowerCase().indexOf(q) !== -1 || name.indexOf(q) !== -1) {
      filtered.push(u);
    }
  }

  for (i = 0; i < filtered.length; i++) {
    (function(unit){
      var div = document.createElement("div");

      var label = unit;
      if (unitNames[unit]) {
        label = unit + " — " + unitNames[unit];
      }

      div.appendChild(document.createTextNode(label));

      div.onclick = function () {
        var catName = unitToCategory[unit];

        if (selectedCategory !== catName) {
          selectedCategory = catName;
          document.getElementById("catSelected").innerHTML = catName;
          updateUnits();
        }

        selectedTo = unit;
        document.getElementById("toSelected").innerHTML = label;

        list.style.display = "none";
        convert();
      };

      list.appendChild(div);
    })(filtered[i]);
  }

  list.style.display = filtered.length ? "block" : "none";
};

// --- Navigation clavier pour la recherche "Vers" ---
(function(){
  var input = document.getElementById("searchTo");
  var list  = document.getElementById("toSearchList");
  var searchOptions = [];
  var activeIndex = -1;

  function highlight() {
    var i;
    for (i = 0; i < searchOptions.length; i++) {
      searchOptions[i].style.background = (i === activeIndex) ? "#ddd" : "";
    }

      searchOptions[activeIndex].scrollIntoView({ block: "nearest" });

  }

  input.oninput = function(){
    oldInput.call(this);

    searchOptions = [];
    var children = list.children;

    for (i = 0; i < children.length; i++) {
      searchOptions.push(children[i]);
    }

    activeIndex = (searchOptions.length > 0) ? 0 : -1;
    highlight();
  };

  input.onkeydown = function(e){
    var code = e.keyCode || e.which;

    if (list.style.display !== "block") return;

    if (code === 40) { // ↓
      activeIndex++;
      if (activeIndex >= searchOptions.length) activeIndex = 0;
      highlight();
      e.preventDefault();
      return false;
    }

    if (code === 38) { // ↑
      activeIndex--;
      if (activeIndex < 0) activeIndex = searchOptions.length - 1;
      highlight();
      e.preventDefault();
      return false;
    }

    if (code === 13) { // Entrée
      if (activeIndex >= 0 && activeIndex < searchOptions.length) {
        searchOptions[activeIndex].onclick();
      }
      e.preventDefault();
      return false;
    }
  };
})();

// ===============================
// 8. Conversion
// ===============================
function convert() {
  if (!selectedCategory || !selectedFrom || !selectedTo) return;

  var cat = categories[selectedCategory];

  // Récupérer la valeur entrée
  var val = parseFloat(document.getElementById("inputValue").value);
  if (isNaN(val)) {
    document.getElementById("result").innerHTML = "—";
    return;
  }

  // ============================
  // CAS SPÉCIAL : TEMPÉRATURE
  // ============================
  if (cat.special === true) {
    var res = null;

    if (selectedFrom === "C" && selectedTo === "F") res = val * 9/5 + 32;
    else if (selectedFrom === "F" && selectedTo === "C") res = (val - 32) * 5/9;
    else if (selectedFrom === "C" && selectedTo === "K") res = val + 273.15;
    else if (selectedFrom === "K" && selectedTo === "C") res = val - 273.15;
    else if (selectedFrom === "F" && selectedTo === "K") res = (val - 32) * 5/9 + 273.15;
    else if (selectedFrom === "K" && selectedTo === "F") res = (val - 273.15) * 9/5 + 32;
    else res = val;

    document.getElementById("result").innerHTML =
      val + " " + selectedFrom + " = " + res + " " + selectedTo;
    return;
  }

  // ============================
  // CAS SPÉCIAL : CUSTOM
  // ============================
  if (cat.special === "custom") {
    var uFrom = cat.units[selectedFrom];
    var uTo = cat.units[selectedTo];

    if (!uFrom || !uTo) return;

    var ratio = uFrom / uTo;
    var res = val * ratio;

    document.getElementById("result").innerHTML =
      val + " " + selectedFrom + " = " + res + " " + selectedTo;
    return;
  }

  // ============================
  // CAS NORMAL : BASE MULTIPLICATIVE
  // ============================
  var units = cat.units;
  var baseFrom = units[selectedFrom];
  var baseTo = units[selectedTo];

  if (!baseFrom || !baseTo) return;

  var ratio = baseFrom / baseTo;
  var res = val * ratio;

  document.getElementById("result").innerHTML =
    val + " " + selectedFrom + " = " + res + " " + selectedTo;
}

document.getElementById("inputValue").oninput = convert;

// ===============================
// 9. Initialisation
// ===============================
(function init() {
  buildGlobalUnitList();

  var catNames = [];
  for (var k in categories) catNames.push(k);

  fillCategory(catNames);
})();

// ===============================
// 10. COPIE + FEEDBACK
// ===============================
document.getElementById("copyBtn").onclick = function () {
  var text = document.getElementById("result").innerHTML;

  // Créer un textarea caché
  var temp = document.createElement("textarea");
  temp.value = text;
  temp.style.position = "absolute";
  temp.style.left = "-9999px";
  document.body.appendChild(temp);

  // Sélectionner + copier
  temp.select();
  try {
    document.execCommand("copy");
  } catch (e) {
    // La 3DS ne supporte pas toujours execCommand,
    // mais au moins ça ne plante pas.
  }

  // Supprimer le textarea
  document.body.removeChild(temp);

  // Feedback visuel
  var fb = document.getElementById("copyFeedback");
  fb.style.display = "inline";

  // Disparition après 1 seconde
  setTimeout(function () {
    fb.style.display = "none";
  }, 1000);
};

document.getElementById("inputValue").value = "1";
convert();
</script>

</body>
</html>
