<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau HTML</title>
<style>
body { background-color: #C0C0C0; }
textarea { width: 100%; height: 150px; overflow-x: auto; white-space: pre; }
pre { background: #eee; padding: 10px; white-space: pre; }
button { margin-top: 10px; padding: 6px 10px; }

.selectedCell {
    outline: 2px solid blue;
}
</style>
</head>
<body>          

<h3>Tableau HTML</h3>

Séparateur : <input id="sep" value=";" size="1">
<br><br>
Texte : <input type="color" id="txtcolor" value="#000000">
Fond : <input type="color" id="bgcolor" value="#ffffff">
Bordure : <input type="color" id="bordercolor" value="#000000">
Épaisseur : <input type="number" id="borderwidth" value="1" min="0" max="10" style="width:50px;">
Alignement :
<select id="align">
  <option value="left">Gauche</option>
  <option value="center">Centre</option>
  <option value="right">Droite</option>
</select>
<br><br>
<input type="checkbox" id="limitwidth"> Largeur : <input type="number" id="maxwidth" value="300" min="50" max="2000" style="width:60px;"> px
&nbsp;&nbsp;
<button onclick="resetParams()" style="background-color:#ff4444; color:black;">Valeurs par défaut</button>

<br><br>
<textarea id="input"></textarea>

<br>
<button onclick="convertir()" style="background-color:#ff8800; color:black;">Convertir</button>
<button onclick="copier()" style="background-color:#4CAF50; color:black;">Copier</button>
<button onclick="effacerTout()" style="background-color:#ff4444; color:black;">Effacer tout</button>

<h3>Résultat</h3>
<textarea id="output" style="width:100%; height:200px; font-family:monospace; white-space:pre;"></textarea>

<h3>Aperçu</h3>
<input type="checkbox" id="fusionMode"> Activer la fusion
<div id="preview" style="background:white; padding:10px;"></div>

<script>
// ------------------------------
// Compatibilité maximale (ES3)
// ------------------------------

function setText(el, txt) {
    if (el.textContent !== undefined) el.textContent = txt;
    else el.innerText = txt; // IE6/IE7
}

function getText(el) {
    return (el.textContent !== undefined) ? el.textContent : el.innerText;
}

function escapeHTML(str) {
  if (!str) return "";
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function htmlTable(rows, txt, bg, border, bw, align) {
  if (!rows || !rows.length) return "";

  var maxCols = 0;
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].length > maxCols) maxCols = rows[i].length;
  }

  // Style des cellules : ajout du wrap
  var cellStyle =
    "color:" + txt + ";" +
    "background:" + bg + ";" +
    "border:" + bw + "px solid " + border + ";" +
    "padding:4px;" +
    "text-align:" + align + ";" +
    "word-wrap:break-word;" +
    "overflow-wrap:break-word;";

  // Style du tableau
  var tableStyle = "border:" + bw + "px solid " + border + ";";

  // Limitation de largeur si coché
  var limitEl = document.getElementById("limitwidth");
  if (limitEl && limitEl.checked) {
    var mwEl = document.getElementById("maxwidth");
    var mw = mwEl ? mwEl.value : "300";
    tableStyle += "width:" + mw + "px;table-layout:fixed;";
  }

  var out = '<table border="' + bw + '" cellspacing="0" cellpadding="4" style="' + tableStyle + '">\n';

  for (var r = 0; r < rows.length; r++) {
    out += "  <tr>\n";

    for (var c = 0; c < maxCols; c++) {
      var cell = rows[r][c];

      if (cell) {
        while (cell.length && (cell.charAt(0) === " " || cell.charAt(0) === "\t")) {
          cell = cell.substring(1);
        }
        while (cell.length && (cell.charAt(cell.length - 1) === " " || cell.charAt(cell.length - 1) === "\t")) {
          cell = cell.substring(0, cell.length - 1);
        }
      }

      if (!cell) cell = "&nbsp;";

      if (cell === "&nbsp;") {
        out += '    <td style="' + cellStyle + '">&nbsp;</td>\n';
      } else {
        out += '    <td style="' + cellStyle + '">' + escapeHTML(cell) + "</td>\n";
      }
    }

    out += "  </tr>\n";
  }

  out += "</table>";
  return out;
}

// ------------------------------
// Conversion
// ------------------------------
function convertir() {
  var texte = document.getElementById("input").value;
  var sep = document.getElementById("sep").value || ";";
  var align = document.getElementById("align").value;

  if (!texte) {
    document.getElementById("output").value = "Aucune donnée.";
    document.getElementById("preview").innerHTML = "";
    return;
  }

  var txt = document.getElementById("txtcolor").value;
  var bg = document.getElementById("bgcolor").value;
  var border = document.getElementById("bordercolor").value;
  var bw = document.getElementById("borderwidth").value;

  var lignes = texte.split("\n");
  var rows = [];
  for (var i = 0; i < lignes.length; i++) {
    rows.push(lignes[i].split(sep));
  }

  var table = htmlTable(rows, txt, bg, border, bw, align);

  document.getElementById("output").value = table;
  document.getElementById("preview").innerHTML = table;
  enableCellMerging();
}

// Bouton copier compatible anciens navigateurs
function copier() {
  var texte = document.getElementById("output").value;

  var temp = document.createElement("textarea");
  temp.value = texte;
  document.body.appendChild(temp);
  temp.select();

  try { document.execCommand("copy"); } catch (e) {}

  document.body.removeChild(temp);

  var btn = event.target;
  var old = btn.textContent;
  btn.textContent = "Copié !";

  setTimeout(function() {
    btn.textContent = old;
  }, 800);
}

// Bouton Effacer tout
function effacerTout() {
  document.getElementById("input").value = "";
  document.getElementById("output").value = "";
  document.getElementById("preview").innerHTML = "";

  localStorage.removeItem("input_text");
  localStorage.removeItem("output_text");
}

// Valeurs par défaut
function resetParams() {
  document.getElementById("sep").value = ";";
  document.getElementById("txtcolor").value = "#000000";
  document.getElementById("bgcolor").value = "#ffffff";
  document.getElementById("bordercolor").value = "#000000";
  document.getElementById("borderwidth").value = "1";
  document.getElementById("align").value = "left";
  document.getElementById("limitwidth").checked = false;
  document.getElementById("maxwidth").value = "300";

  localStorage.setItem("sep", ";");
  localStorage.setItem("txtcolor", "#000000");
  localStorage.setItem("bgcolor", "#ffffff");
  localStorage.setItem("bordercolor", "#000000");
  localStorage.setItem("borderwidth", "1");
  localStorage.setItem("align", "left");
  localStorage.setItem("limitwidth", "0");
  localStorage.setItem("maxwidth", "300");

  convertir();
}

// ------------------------------
// Sauvegarde/Restauration
// ------------------------------

function saveState() {
  localStorage.setItem("input_text", document.getElementById("input").value);
  localStorage.setItem("sep", document.getElementById("sep").value);
  localStorage.setItem("txtcolor", document.getElementById("txtcolor").value);
  localStorage.setItem("bgcolor", document.getElementById("bgcolor").value);
  localStorage.setItem("bordercolor", document.getElementById("bordercolor").value);
  localStorage.setItem("borderwidth", document.getElementById("borderwidth").value);
  localStorage.setItem("align", document.getElementById("align").value);
  localStorage.setItem("limitwidth", document.getElementById("limitwidth").checked ? "1" : "0");
  localStorage.setItem("maxwidth", document.getElementById("maxwidth").value);
}

document.getElementById("input").oninput = saveState;
document.getElementById("sep").oninput = saveState;

document.getElementById("txtcolor").oninput = function() {
  saveState();
  convertir();
};
document.getElementById("bgcolor").oninput = function() {
  saveState();
  convertir();
};
document.getElementById("bordercolor").oninput = function() {
  saveState();
  convertir();
};
document.getElementById("borderwidth").oninput = function() {
  saveState();
  convertir();
};
document.getElementById("align").oninput = function() {
  saveState();
  convertir();
};
document.getElementById("limitwidth").oninput = function() {
  saveState();
  convertir();
};
document.getElementById("maxwidth").oninput = function() {
  saveState();
  convertir();
};

// Edition manuelle du HTML
document.getElementById("output").oninput = function () {
  document.getElementById("preview").innerHTML = this.value;
  enableCellMerging();
};

var selectedCell = null;

function indexInRow(cell) {
    var tds = cell.parentNode.getElementsByTagName("td");
    for (var i = 0; i < tds.length; i++) {
        if (tds[i] === cell) return i;
    }
    return -1;
}

function rowIndex(row) {
    var rows = row.parentNode.getElementsByTagName("tr");
    for (var i = 0; i < rows.length; i++) {
        if (rows[i] === row) return i;
    }
    return -1;
}

function enableCellMerging() {
    var preview = document.getElementById("preview");
    var cells = preview.getElementsByTagName("td");

    for (var i = 0; i < cells.length; i++) {
        cells[i].onclick = function() {

    // Si la fusion n'est pas activée → ne rien faire
    if (!document.getElementById("fusionMode").checked) {
        return;
    }

    if (!selectedCell) {
        selectedCell = this;
        this.className = "selectedCell";
        return;
    }

    if (selectedCell === this) {
        this.className = "";
        selectedCell = null;
        return;
    }

    var A = selectedCell;
    var B = this;
    A.className = "";
    selectedCell = null;

    var rowA = A.parentNode;
    var rowB = B.parentNode;

    var indexA = indexInRow(A);
    var indexB = indexInRow(B);

    // Fusion horizontale
    if (rowA === rowB && Math.abs(indexA - indexB) === 1) {
        var first = indexA < indexB ? A : B;
        var second = indexA < indexB ? B : A;

        var colspan = first.getAttribute("colspan");
        colspan = colspan ? parseInt(colspan,10)+1 : 2;
        first.setAttribute("colspan", colspan);

        second.parentNode.removeChild(second);
    }

    // Fusion verticale
    else if (indexA === indexB) {
        var table = rowA.parentNode;
        var rows = table.getElementsByTagName("tr");

        var rA = rowIndex(rowA);
        var rB = rowIndex(rowB);

        if (Math.abs(rA - rB) === 1) {
            var top = rA < rB ? A : B;
            var bottom = rA < rB ? B : A;

            var rowspan = top.getAttribute("rowspan");
            rowspan = rowspan ? parseInt(rowspan,10)+1 : 2;
            top.setAttribute("rowspan", rowspan);

            bottom.parentNode.removeChild(bottom);
        }
    }

    document.getElementById("output").value = document.getElementById("preview").innerHTML;
    enableCellMerging();
};
cells[i].ondblclick = function() {
    var td = this;

    // empêcher la fusion pendant l'édition
    selectedCell = null;
    td.className = "";

    td.setAttribute("contenteditable", "true");
    td.focus();

    td.onblur = function() {
        td.removeAttribute("contenteditable");

        // mise à jour du code HTML
        document.getElementById("output").value =
            document.getElementById("preview").innerHTML;

        // réactiver la fusion
        enableCellMerging();
    };
};
    }
}

window.onload = function() {
  var savedInput = localStorage.getItem("input_text");
  var savedSep = localStorage.getItem("sep");
  var t = localStorage.getItem("txtcolor");
  var b = localStorage.getItem("bgcolor");
  var bc = localStorage.getItem("bordercolor");
  var bw = localStorage.getItem("borderwidth");
  var al = localStorage.getItem("align");
  var lw = localStorage.getItem("limitwidth");
  var mw = localStorage.getItem("maxwidth");

  if (savedInput !== null) document.getElementById("input").value = savedInput;
  if (savedSep !== null) document.getElementById("sep").value = savedSep;
  if (t) document.getElementById("txtcolor").value = t;
  if (b) document.getElementById("bgcolor").value = b;
  if (bc) document.getElementById("bordercolor").value = bc;
  if (bw) document.getElementById("borderwidth").value = bw;
  if (al) document.getElementById("align").value = al;
  if (lw === "1") document.getElementById("limitwidth").checked = true;
  if (mw) document.getElementById("maxwidth").value = mw;

  convertir();
};
</script>

</body>
</html>
