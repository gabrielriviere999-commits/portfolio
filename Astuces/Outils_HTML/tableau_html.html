<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau HTML</title>
<style>
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 10px;
  background: #C0C0C0;
}

/* Toolbar Win98 */
.toolbar {
  display: block;
  padding: 6px;
  background: #c0c0c0;
  border: 2px solid;
  border-color: #fff #404040 #404040 #fff;
  margin-bottom: 10px;
}

.toolbar button {
  margin: 2px;
}

/* Boutons Win98 */
button {
  background: #d4d0c8;
  border: 2px solid;
  border-color: #fff #404040 #404040 #fff;
  padding: 4px 8px;
  font-family: "MS Sans Serif", sans-serif;
  font-size: 12px;
  cursor: pointer;
}

button:active,
button.active {
  border-color: #404040 #fff #fff #404040;
  background: #c0c0c0;
}

/* TABLEAU */
table {
  border-collapse: collapse;
  background: #fff;
  border: 2px solid #000;
}

td {
  border: 1px solid #000;
  padding: 6px;
}

td.selected {
  outline: 2px solid #0078d7;
  outline-offset: -2px;
}

.palette {
  display: block;
}

.palette .color {
  display: inline-block;
  width: 22px;
  height: 22px;
  border: 1px solid #444;
  margin-right: 4px;
  margin-bottom: 4px;
  cursor: pointer;
}

/* HEX INPUT */
.hexInputBox {
  display: block;
  margin-top: 6px;
}

#hexColorInput {
  width: 80px;
  padding: 4px;
  font-family: monospace;
}

/* CODE BOX */
#codeBox {
  width: 100%;
  height: 200px;
  margin-top: 10px;
  font-family: monospace;
}
</style>
</head>
<body>

<div class="toolbar">
  <!-- Lignes -->
  <button id="addRowAbove">+ Ligne au-dessus</button>
  <button id="addRowBelow">+ Ligne en dessous</button>
  <button id="delRow">- Supprimer ligne</button>

  <!-- Colonnes -->
  <button id="addColLeft">+ Colonne à gauche</button>
  <button id="addColRight">+ Colonne à droite</button>
  <button id="delCol">- Supprimer colonne</button>

  <!-- Alignement -->
  <button data-align="left">Gauche</button>
  <button data-align="center">Centre</button>
  <button data-align="right">Droite</button>

  <!-- Sélection multiple -->
  <label>
    <input type="checkbox" id="multiSelectMode">
    Sélection multiple
  </label>

  <!-- Modes d’application -->
  <div id="colorModes">
    <button data-mode="text">Texte</button>
    <button data-mode="bg">Fond</button>
    <button data-mode="border">Bordure</button>
  </div>

  <!-- Palette de couleurs -->
  <div id="colorPalette" class="palette">
    <div class="color" data-col="#000000" style="background:#000"></div>
    <div class="color" data-col="#ffffff" style="background:#fff; border:1px solid #000"></div>
    <div class="color" data-col="#ff0000" style="background:#f00"></div>
    <div class="color" data-col="#00aa00" style="background:#0a0"></div>
    <div class="color" data-col="#0000ff" style="background:#00f"></div>
    <div class="color" data-col="#ff9900" style="background:#f90"></div>
    <div class="color" data-col="#ffff00" style="background:#ff0"></div>
  </div>

<div class="hexInputBox">
  <input type="text" id="hexColorInput" placeholder="#RRGGBB" maxlength="7">
  <button id="applyHexColor">OK</button>
</div>

  <label>Épaisseur :
    <select id="borderWidth">
      <option value="1px" selected>1</option>
      <option value="2px">2</option>
      <option value="3px">3</option>
      <option value="4px">4</option>
      <option value="5px">5</option>
      <option value="6px">6</option>
      <option value="8px">8</option>
      <option value="10px">10</option>
    </select>
  </label>
</div>

<table id="editorTable" style="border-collapse:collapse; border:1px solid #000;">
  <tbody>
    <tr>
      <td contenteditable="true">Cellule 1,1</td>
      <td contenteditable="true">Cellule 1,2</td>
      <td contenteditable="true">Cellule 1,3</td>
    </tr>
    <tr>
      <td contenteditable="true">Cellule 2,1</td>
      <td contenteditable="true">Cellule 2,2</td>
      <td contenteditable="true">Cellule 2,3</td>
    </tr>
    <tr>
      <td contenteditable="true">Cellule 3,1</td>
      <td contenteditable="true">Cellule 3,2</td>
      <td contenteditable="true">Cellule 3,3</td>
    </tr>
  </tbody>
</table>

<!-- CODE HTML -->
<h3>Code du tableau</h3>
<button id="generateCode">Générer le code</button>
<textarea id="codeBox"></textarea>
<button id="updateFromCode">Mettre à jour le tableau</button>
<button id="copyCode">Copier le code</button>

<script>
/* ============================
   POLYFILLS
============================ */

// matches()
if (!Element.prototype.matches) {
  Element.prototype.matches =
    Element.prototype.msMatchesSelector ||
    Element.prototype.webkitMatchesSelector ||
    function(selector) {
      var nodes = (this.parentNode || document).querySelectorAll(selector);
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i] === this) return true;
      }
      return false;
    };
}

// closest()
function closest(el, selector) {
  while (el && el.nodeType === 1) {
    if (el.matches(selector)) return el;
    el = el.parentNode;
  }
  return null;
}

// addClass / removeClass
function addClass(el, cls) {
  if (el.className.indexOf(cls) === -1) {
    el.className += " " + cls;
  }
}

function removeClass(el, cls) {
  el.className = el.className.replace(cls, "").replace("  ", " ");
}

// NodeList loop helper
function forEachNode(list, fn) {
  for (var i = 0; i < list.length; i++) fn(list[i], i);
}

/* ============================
   VARIABLES
============================ */

var table = document.getElementById('editorTable');
var selectedCells = [];
var colorMode = "text";

/* ============================
   SÉLECTION MULTIPLE
============================ */

table.addEventListener('click', function(e) {
  var t = e.target;
  if (t && t.nodeName === 'TD') {

    var multi = document.getElementById('multiSelectMode').checked;

    if (multi) {
      toggleSelect(t);
    } else {
      clearSelection();
      selectCell(t);
    }
  }
});

document.addEventListener('click', function(e) {
  var t = e.target;
  var isCell = t && t.nodeName === 'TD';
  var isTable = closest(t, '#editorTable');
  var isTools = closest(t, '.toolbar');

  if (!isCell && !isTable && !isTools) {
    clearSelection();
  }
});

function selectCell(cell) {
  addClass(cell, "selected");
  selectedCells.push(cell);
}

function toggleSelect(cell) {
  if (cell.className.indexOf("selected") !== -1) {
    removeClass(cell, "selected");
    var idx = selectedCells.indexOf(cell);
    if (idx !== -1) selectedCells.splice(idx, 1);
  } else {
    selectCell(cell);
  }
}

function clearSelection() {
  for (var i = 0; i < selectedCells.length; i++) {
    removeClass(selectedCells[i], "selected");
  }
  selectedCells = [];
}

function getColumnCount() {
  if (!table.rows.length) return 0;
  return table.rows[0].cells.length;
}

function getCellPosition(cell) {
  return { rowIndex: cell.parentNode.rowIndex, cellIndex: cell.cellIndex };
}

/* ============================
   LIGNES
============================ */

document.getElementById('addRowAbove').onclick = function() {
  if (!selectedCells.length) return;
  var pos = getCellPosition(selectedCells[0]);
  var cols = getColumnCount();
  var newRow = table.insertRow(pos.rowIndex);

  for (var i = 0; i < cols; i++) {
    var c = newRow.insertCell(i);
    c.contentEditable = "true";
    c.innerHTML = "&nbsp;";
  }
};

document.getElementById('addRowBelow').onclick = function() {
  if (!selectedCells.length) return;
  var pos = getCellPosition(selectedCells[0]);
  var cols = getColumnCount();
  var newRow = table.insertRow(pos.rowIndex + 1);

  for (var i = 0; i < cols; i++) {
    var c = newRow.insertCell(i);
    c.contentEditable = "true";
    c.innerHTML = "&nbsp;";
  }
};

document.getElementById('delRow').onclick = function() {
  if (!selectedCells.length) return;
  var pos = getCellPosition(selectedCells[0]);
  if (table.rows.length > 1) table.deleteRow(pos.rowIndex);
  clearSelection();
};

/* ============================
   COLONNES
============================ */

document.getElementById('addColLeft').onclick = function() {
  if (!selectedCells.length) return;
  var pos = getCellPosition(selectedCells[0]);

  for (var r = 0; r < table.rows.length; r++) {
    var c = table.rows[r].insertCell(pos.cellIndex);
    c.contentEditable = "true";
    c.innerHTML = "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;";
  }
};

document.getElementById('addColRight').onclick = function() {
  if (!selectedCells.length) return;
  var pos = getCellPosition(selectedCells[0]);

  for (var r = 0; r < table.rows.length; r++) {
    var c = table.rows[r].insertCell(pos.cellIndex + 1);
    c.contentEditable = "true";
    c.innerHTML = "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;";
  }
};

document.getElementById('delCol').onclick = function() {
  if (!selectedCells.length) return;
  var pos = getCellPosition(selectedCells[0]);

  for (var r = 0; r < table.rows.length; r++) {
    table.rows[r].deleteCell(pos.cellIndex);
  }
  clearSelection();
};

/* ============================
   ALIGNEMENT
============================ */

var alignButtons = document.querySelectorAll('button[data-align]');
forEachNode(alignButtons, function(btn) {
  btn.onclick = function() {
    var align = btn.getAttribute('data-align');
    for (var j = 0; j < selectedCells.length; j++) {
      selectedCells[j].style.textAlign = align;
    }
  };
});

/* ============================
   PALETTE + MODES
============================ */

var modeButtons = document.querySelectorAll('#colorModes button');
forEachNode(modeButtons, function(btn) {
  btn.onclick = function() {
    colorMode = btn.getAttribute('data-mode');

    forEachNode(modeButtons, function(b) {
      removeClass(b, "active");
    });

    addClass(btn, "active");
  };
});

var paletteColors = document.querySelectorAll('#colorPalette .color');
forEachNode(paletteColors, function(el) {
  el.onclick = function() {
    var col = el.getAttribute('data-col');
    applyColor(col);
  };
});

function applyColor(col) {
  var r, c2;

  if (colorMode === "text") {
    if (selectedCells.length > 0) {
      for (var i = 0; i < selectedCells.length; i++) {
        selectedCells[i].style.color = col;
      }
    } else {
      for (r = 0; r < table.rows.length; r++) {
        for (c2 = 0; c2 < table.rows[r].cells.length; c2++) {
          table.rows[r].cells[c2].style.color = col;
        }
      }
    }
  }

  else if (colorMode === "bg") {
    if (selectedCells.length > 0) {
      for (var i2 = 0; i2 < selectedCells.length; i2++) {
        selectedCells[i2].style.backgroundColor = col;
      }
    } else {
      for (r = 0; r < table.rows.length; r++) {
        for (c2 = 0; c2 < table.rows[r].cells.length; c2++) {
          table.rows[r].cells[c2].style.backgroundColor = col;
        }
      }
    }
  }

  else if (colorMode === "border") {
    if (selectedCells.length > 0) {
      for (var i3 = 0; i3 < selectedCells.length; i3++) {
        selectedCells[i3].style.borderColor = col;
      }
    } else {
      for (r = 0; r < table.rows.length; r++) {
        for (c2 = 0; c2 < table.rows[r].cells.length; c2++) {
          table.rows[r].cells[c2].style.borderColor = col;
        }
      }
    }
    table.style.borderColor = col;
  }
}

document.getElementById('applyHexColor').onclick = function () {
  var col = document.getElementById('hexColorInput').value;

  // enlever espaces
  col = col.replace(/^\s+|\s+$/g, "");

  // ajouter # si besoin
  if (/^[0-9A-Fa-f]{6}$/.test(col)) {
    col = "#" + col;
  }

  // valider format final
  if (!/^#[0-9A-Fa-f]{6}$/.test(col)) {
    return;
  }

  // appliquer selon mode
  applyColor(col);
};
/* ============================
   EPAISSEUR
============================ */

document.getElementById('borderWidth').onchange = function() {
  var w = this.value;
  var col = table.style.borderColor || "#000";

  table.style.borderWidth = w;
  table.style.borderColor = col;

  for (var r = 0; r < table.rows.length; r++) {
    for (var c = 0; c < table.rows[r].cells.length; c++) {
      table.rows[r].cells[c].style.borderWidth = w;
      table.rows[r].cells[c].style.borderColor = col;
    }
  }
};

/* ============================
   EXPORT HTML
============================ */

function updateCodeBox() {
  var clone = table.cloneNode(true);
  clone.removeAttribute("id");

  for (var r = 0; r < clone.rows.length; r++) {
    for (var c = 0; c < clone.rows[r].cells.length; c++) {
      var cell = clone.rows[r].cells[c];

      cell.removeAttribute("contenteditable");
      removeClass(cell, "selected");

      // Bordure inline pour compatibilité externe
      var col = cell.style.borderColor || "#000";
      cell.style.border = "1px solid " + col;

      if (!cell.className.replace(" ", "")) cell.removeAttribute("class");
    }
  }

  document.getElementById('codeBox').value = clone.outerHTML;
}

document.getElementById('generateCode').onclick = updateCodeBox;

/* ============================
   IMPORT HTML
============================ */

document.getElementById('updateFromCode').onclick = function() {
  var code = document.getElementById('codeBox').value;
  var container = document.createElement('div');
  container.innerHTML = code;

  var newTable = container.querySelector('table');
  if (newTable) {
    newTable.id = "editorTable";
    table.parentNode.replaceChild(newTable, table);
    table = newTable;
    selectedCells = [];
    rebindTableEvents();
  }
};

function rebindTableEvents() {
  for (var r = 0; r < table.rows.length; r++) {
    for (var c = 0; c < table.rows[r].cells.length; c++) {
      table.rows[r].cells[c].contentEditable = "true";
    }
  }

  table.addEventListener('click', function(e) {
    var t = e.target;
    if (t && t.nodeName === 'TD') {
      var multi = document.getElementById('multiSelectMode').checked;

      if (multi) toggleSelect(t);
      else {
        clearSelection();
        selectCell(t);
      }
    }
  });
}

/* ============================
   COPIE
============================ */

document.getElementById('copyCode').onclick = function(e) {
  var code = document.getElementById('codeBox');

  var temp = document.createElement("textarea");
  temp.value = code.value;
  document.body.appendChild(temp);
  temp.select();

  try { document.execCommand("copy"); } catch (err) {}

  document.body.removeChild(temp);

  var btn = e.target;
  var old = btn.textContent;
  btn.textContent = "Copié !";

  setTimeout(function() {
    btn.textContent = old;
  }, 800);
};
</script>

</body>
</html>
