<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changer la casse</title>
<style>
body { background-color: #C0C0C0; }
textarea { width: 100%; height: 150px; overflow-x: auto; white-space: pre; }
pre { background: #eee; padding: 10px; white-space: pre-wrap; }
button { margin-top: 10px; padding: 6px 10px; }
label { display: inline-block; white-space: nowrap; margin-right: 10px; vertical-align: middle; }
</style>
</head>
<body>

<h3>Changer la casse</h3>
<textarea id="input"></textarea>

<br>
<label><input type="checkbox" id="chk_min">minuscule</label>
<label><input type="checkbox" id="chk_maj">MAJUSCULE</label>
<label><input type="checkbox" id="chk_inv">iNVERSER CASSE</label>
<br>
<label><input type="checkbox" id="chk_acc">Sans accents</label>
<label><input type="checkbox" id="chk_spc">Nettoyer espaces</label>
<label><input type="checkbox" id="chk_quo">Guillemets → "</label>
<label><input type="checkbox" id="chk_squo">Demi‑guillemets → '</label>
<br>
<button onclick="toutDecocher()" style="background-color:#ffaa00; color:black;">Tout décocher</button>
<h4>Remplacements personnalisés</h4>
<div id="repl_container"></div>
<button onclick="ajouterRemplacement()" style="background-color:#dddddd;">
  Ajouter un remplacement
</button>
<br><br>
<button onclick="appliquerTransformations()" style="background-color:#ff8800; color:black;">Appliquer</button>
<button onclick="copier()" style="background-color:#4CAF50; color:black;">Copier</button>
<button onclick="effacerTout()" style="background-color:#ff4444; color:black;">Effacer tout</button>

<h3>Résultat</h3>
<textarea id="output" readonly style="width:100%; height:200px; font-family:monospace; white-space:pre;"></textarea>

<script>
// ------------------------------
// Compatibilité maximale (ES3)
// ------------------------------

function setText(el, txt) {
    if (el.textContent !== undefined) el.textContent = txt;
    else el.innerText = txt; // IE6/IE7
}

function getText(el) {
    return (el.textContent !== undefined) ? el.textContent : el.innerText;
}

function appliquerTransformations() {
  var txt = document.getElementById("input").value;

  // 1) minuscule
  if (document.getElementById("chk_min").checked) {
    txt = txt.toLowerCase();
  }

  // 2) majuscule
  if (document.getElementById("chk_maj").checked) {
    txt = txt.toUpperCase();
  }

  // 3) inverser casse
  if (document.getElementById("chk_inv").checked) {
    var out = "";
    for (var i = 0; i < txt.length; i++) {
      var c = txt.charAt(i);
      var lower = c.toLowerCase();
      var upper = c.toUpperCase();
      out += (c === lower) ? upper : lower;
    }
    txt = out;
  }

  // 4) sans accents
  if (document.getElementById("chk_acc").checked) {
    txt = sansAccents(txt);
  }

  // 5) nettoyer espaces
  if (document.getElementById("chk_spc").checked) {
    // tabulations → _
    txt = txt.replace(/\t/g, "_");
    // espaces multiples → un seul espace
    txt = txt.replace(/ +/g, " ");
    // espace simple → _
    txt = txt.replace(/ /g, "_");
  }

  // 6) convertir guillemets typographiques → "
  if (document.getElementById("chk_quo").checked) {
    txt = txt.replace(/[«»“”„‟❝❞⹂〝〞〟＂『』「」]/g, '"');
  }

  // 7) convertir demi-guillemets typographiques → '
  if (document.getElementById("chk_squo").checked) {
    txt = txt.replace(/[‘’‚‛`]/g, "'");
  }

  txt = appliquerRemplacementsPersonnalises(txt);
  setText(document.getElementById("output"), txt);
}

function exclusiviteCasse(chk) {
  if (chk === "min") {
    document.getElementById("chk_maj").checked = false;
    document.getElementById("chk_inv").checked = false;
  }
  if (chk === "maj") {
    document.getElementById("chk_min").checked = false;
    document.getElementById("chk_inv").checked = false;
  }
  if (chk === "inv") {
    document.getElementById("chk_min").checked = false;
    document.getElementById("chk_maj").checked = false;
  }
  saveChecks();
}

function toutDecocher() {
  document.getElementById("chk_min").checked = false;
  document.getElementById("chk_maj").checked = false;
  document.getElementById("chk_inv").checked = false;
  document.getElementById("chk_acc").checked = false;
  document.getElementById("chk_spc").checked = false;
  document.getElementById("chk_quo").checked = false;
  document.getElementById("chk_squo").checked = false;
  saveChecks();
}

function sansAccents(str) {
  // Table complète pan‑européenne
  var map = {
    // Français
    'à':'a','á':'a','â':'a','ã':'a','ä':'a','å':'a',
    'ç':'c',
    'è':'e','é':'e','ê':'e','ë':'e',
    'ì':'i','í':'i','î':'i','ï':'i',
    'ò':'o','ó':'o','ô':'o','õ':'o','ö':'o',
    'ù':'u','ú':'u','û':'u','ü':'u',
    'ÿ':'y','ý':'y',
    'À':'A','Á':'A','Â':'A','Ã':'A','Ä':'A','Å':'A',
    'Ç':'C',
    'È':'E','É':'E','Ê':'E','Ë':'E',
    'Ì':'I','Í':'I','Î':'I','Ï':'I',
    'Ò':'O','Ó':'O','Ô':'O','Õ':'O','Ö':'O',
    'Ù':'U','Ú':'U','Û':'U','Ü':'U',
    'Ý':'Y',
    'œ':'oe','Œ':'OE',

    // Scandinave
    'ø':'o','Ø':'O',
    'æ':'ae','Æ':'AE',

    // Allemand
    'ß':'ss',

    // Turc
    'ğ':'g','Ğ':'G',
    'ş':'s','Ş':'S',
    'ı':'i','İ':'I',

    // Roumain
    'ă':'a','Ă':'A',
    'ș':'s','Ș':'S',
    'ț':'t','Ț':'T',

    // Polonais
    'ą':'a','Ą':'A',
    'ć':'c','Ć':'C',
    'ę':'e','Ę':'E',
    'ł':'l','Ł':'L',
    'ń':'n','Ń':'N',
    'ś':'s','Ś':'S',
    'ź':'z','Ź':'Z',
    'ż':'z','Ż':'Z',

    // Tchèque / Slovaque
    'č':'c','Č':'C',
    'ď':'d','Ď':'D',
    'ě':'e','Ě':'E',
    'ň':'n','Ň':'N',
    'ř':'r','Ř':'R',
    'š':'s','Š':'S',
    'ť':'t','Ť':'T',
    'ž':'z','Ž':'Z',

    // Croate / Slovène / Serbe latin
    'đ':'d','Đ':'D',

    // Hongrois
    'ő':'o','Ő':'O',
    'ű':'u','Ű':'U',

    // Baltes
    'ū':'u','Ū':'U',
    'ī':'i','Ī':'I',
    'ļ':'l','Ļ':'L',
    'ķ':'k','Ķ':'K',
    'ģ':'g','Ģ':'G'
  };

  // 1) Remplacer les lettres précomposées
  var out = "";
  for (var i = 0; i < str.length; i++) {
    var ch = str.charAt(i);
    out += map[ch] || ch;
  }

  // 2) Supprimer les accents combinés (compatibilité totale)
  // couvre : Ő, Š, Ž, Ț, Ğ, etc. même en version combinée
  out = out.replace(/[\u0300-\u036f]/g, "");

  return out;
}

// Bouton copier compatible anciens navigateurs
function copier() {
  var texte = document.getElementById("output").textContent;

  var temp = document.createElement("textarea");
  temp.value = texte;
  document.body.appendChild(temp);
  temp.select();

  try { document.execCommand("copy"); } catch (e) {}

  document.body.removeChild(temp);
}

// Bouton Effacer tout
function effacerTout() {
  document.getElementById("input").value = "";
  setText(document.getElementById("output"), "");

  localStorage.removeItem("casse_input");
  localStorage.removeItem("casse_output");
}

// ------------------------------
// Sauvegarde / Restauration
// ------------------------------

function saveState() {
  localStorage.setItem("casse_input", document.getElementById("input").value);
  localStorage.setItem("casse_output", getText(document.getElementById("output")));
}

function saveChecks() {
  localStorage.setItem("chk_min", document.getElementById("chk_min").checked ? "1" : "0");
  localStorage.setItem("chk_maj", document.getElementById("chk_maj").checked ? "1" : "0");
  localStorage.setItem("chk_inv", document.getElementById("chk_inv").checked ? "1" : "0");
  localStorage.setItem("chk_acc", document.getElementById("chk_acc").checked ? "1" : "0");
  localStorage.setItem("chk_spc", document.getElementById("chk_spc").checked ? "1" : "0");
  localStorage.setItem("chk_quo", document.getElementById("chk_quo").checked ? "1" : "0");
  localStorage.setItem("chk_squo", document.getElementById("chk_squo").checked ? "1" : "0");
}

document.getElementById("chk_min").onchange = function() {
  exclusiviteCasse("min");
  saveChecks();
};

document.getElementById("chk_maj").onchange = function() {
  exclusiviteCasse("maj");
  saveChecks();
};

document.getElementById("chk_inv").onchange = function() {
  exclusiviteCasse("inv");
  saveChecks();
};
document.getElementById("chk_acc").onchange = saveChecks;
document.getElementById("chk_spc").onchange = saveChecks;
document.getElementById("chk_quo").onchange = saveChecks;
document.getElementById("chk_squo").onchange = saveChecks;

document.getElementById("input").oninput = saveState;
document.getElementById("output").oninput = saveState;

window.onload = function() {
  var savedInput = localStorage.getItem("casse_input");
  var savedOutput = localStorage.getItem("casse_output");

  if (savedInput !== null) document.getElementById("input").value = savedInput;
  if (savedOutput !== null) setText(document.getElementById("output"), savedOutput);

  var cmin = localStorage.getItem("chk_min");
  var cmaj = localStorage.getItem("chk_maj");
  var cinv = localStorage.getItem("chk_inv");
  var cacc = localStorage.getItem("chk_acc");
  var cspc = localStorage.getItem("chk_spc");
  var cquo = localStorage.getItem("chk_quo");
  var csquo = localStorage.getItem("chk_squo");

  if (cmin !== null) document.getElementById("chk_min").checked = (cmin === "1");
  if (cmaj !== null) document.getElementById("chk_maj").checked = (cmaj === "1");
  if (cinv !== null) document.getElementById("chk_inv").checked = (cinv === "1");
  if (cacc !== null) document.getElementById("chk_acc").checked = (cacc === "1");
  if (cspc !== null) document.getElementById("chk_spc").checked = (cspc === "1");
  if (cquo !== null) document.getElementById("chk_quo").checked = (cquo === "1");
  if (csquo !== null) document.getElementById("chk_squo").checked = (csquo === "1");

  chargerReplacements();
};

/* ============================================================
   Remplacements personnalisés — Bloc complet, autonome, ES3
   ============================================================ */

function ajouterRemplacement(from, to) {
  var cont = document.getElementById("repl_container");

  var div = document.createElement("div");

  var inp1 = document.createElement("input");
  inp1.type = "text";
  inp1.value = from || "";
  inp1.placeholder = "chercher";

  var inp2 = document.createElement("input");
  inp2.type = "text";
  inp2.value = to || "";
  inp2.placeholder = "remplacer";

  var btn = document.createElement("button");
  btn.textContent = "X";
  btn.onclick = function() {
    cont.removeChild(div);
    saveReplacements();
  };

  div.appendChild(inp1);                         // children[0]
  div.appendChild(document.createTextNode(" → "));
  div.appendChild(inp2);                         // children[1]
  div.appendChild(btn);                          // children[2]

  cont.appendChild(div);

  inp1.oninput = saveReplacements;
  inp2.oninput = saveReplacements;

  saveReplacements();
}

function saveReplacements() {
  var cont = document.getElementById("repl_container");
  var list = [];

  for (var i = 0; i < cont.children.length; i++) {
    var div = cont.children[i];
    var from = div.children[0].value;
    var to   = div.children[1].value;
    list.push({from: from, to: to});
  }

  localStorage.setItem("repl_list", JSON.stringify(list));
}

function chargerReplacements() {
  var saved = localStorage.getItem("repl_list");
  if (saved) {
    var arr = JSON.parse(saved);
    for (var i = 0; i < arr.length; i++) {
      ajouterRemplacement(arr[i].from, arr[i].to);
    }
  }
}

function appliquerRemplacementsPersonnalises(txt) {
  var cont = document.getElementById("repl_container");

  for (var i = 0; i < cont.children.length; i++) {
    var div = cont.children[i];
    var from = div.children[0].value;
    var to   = div.children[1].value;

    if (from !== "") {
      txt = txt.split(from).join(to); // ES3 compatible
    }
  }

  return txt;
}
</script>

</body>
</html>
