<style>
/* --- Styles généraux --- */
body {
    background-color: #C0C0C0;
    margin: 5;
    padding: 0;
    color: black;
    font-size: 14px;
    font-family: monospace;
    overflow-x: auto;
}

.win98-btn { padding:2px 6px; background:#C0C0C0; border:2px solid #fff; border-right-color:#404040; border-bottom-color:#404040; text-decoration:none; display:inline-block; color:black; }
.win98-btn:active { border:2px solid #404040; border-right-color:#fff; border-bottom-color:#fff; }
.win98-btn:hover { background:#E0E0E0; }

/* --- Barre de navigation --- */
.navbar {
    background-color: rgba(0, 0, 0, .2);
    position: fixed;
    z-index: 1000;
    padding: 2px;
    top: 0;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 3px;
}

.navbar.hide {
    transform: translateY(-100%);
    transition: transform 0.2s linear;
}

.no-transform .navbar {
    position: relative !important;
    top: 0 !important;
}

/* --- Onglets --- */
.tab {
    display: flex;
    align-items: center;
    margin-top: 0;
    width: 100%;
    white-space: nowrap;
    scrollbar-width: thin;
    overflow-x: auto;
}

/* Style général des boutons d’onglets */
.tab button, .tab span {
    font-family: monospace;
    font-size: 14px;
    padding: 6px 12px;
    background: #C0C0C0;
    border: 2px solid;
    border-color: #FFFFFF #808080 #808080 #FFFFFF;
    cursor: pointer;
    margin-right: 2px;
    box-sizing: border-box;
    color: black;
}

/* Ajustement spécial pour les onglets dans la navbar (meilleur rendu Win98) */
.navbar .tab button, .navbar .tab span {
    padding: 10px 12px;
    opacity: 0.8;
}

/* Hover */
.tab button:hover, .tab span:hover {
    background: #D8D8D8;
}

/* Bouton actif */
.tab button.active, .tab span.active {
    border-color: #808080 #FFFFFF #FFFFFF #808080;
    background: #B0B0B0;
}

.tab span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.tab a, .win98-select {
    text-decoration: none;
}

.tab a:focus, .win98-select:focus, .tab button:focus {
	filter: brightness(0.8)
}

.win98-select {
    /* Style Win98 */
    font-family: monospace;
    font-size: 14px;
    background: #C0C0C0;
    opacity: 0.8;
    border: 2px solid;
    border-color: #FFFFFF #808080 #808080 #FFFFFF;
    color: black;
    cursor: pointer;
    box-sizing: border-box;

    /* Forme carrée */
    width: 40px;
    height: 40px;
    padding: 0;
    margin: 0;
    margin-right: 2px;

    /* Supprimer le style moderne du select */
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;

    /* Centrage du symbole */
    text-align: center;
    line-height: 36px;

    /* Empêche les décalages */
    display: inline-block;
    vertical-align: middle;
}

/* Hover Win98 */
.win98-select:hover {
    background: #D8D8D8;
}

/* Effet enfoncé Win98 */
.win98-select:active {
    border-color: #808080 #FFFFFF #FFFFFF #808080;
    background: #B0B0B0;
}

/* --- Mode mobile --- */
@media screen and (max-width: 720px) {
    iframe {
        zoom: 0.5;
    }
}
</style>
</head>

<!-- Scripts -->
<script>
var lastScroll = 0;

window.addEventListener("scroll", function () {
    var navbar = document.querySelector(".navbar");
    var current = window.scrollY;

    if (current > lastScroll && current > 50) {
        navbar.classList.add("hide");
    } else {
        navbar.classList.remove("hide");
    }

    lastScroll = current;
});

var supportsTransform = 'transform' in document.body.style;

if (!supportsTransform) {
    document.documentElement.classList.add('no-transform');
}
</script>
