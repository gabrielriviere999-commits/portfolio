<style>
/* --- Styles généraux --- */
body {
    background-color: #C0C0C0;
    margin: 5;
    padding: 0;
    color: black;
    font-size: 25px;
    font-family: monospace;
    overflow-x: auto;
}

/* --- Barre de navigation --- */
.navbar {
    background-color: rgba(0, 0, 0, .2);
    position: fixed;
    z-index: 1000;
    padding: 2px;
    top: 0;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 3px;
}

.navbar.hide {
    transform: translateY(-100%);
    transition: transform 0.2s linear;
}

.no-transform .navbar {
    position: relative !important;
    top: 0 !important;
}

/* --- Onglets --- */
.tab {
    display: flex;
    align-items: center;
    margin-top: 0;
    width: 100%;
    white-space: nowrap;
    scrollbar-width: thin;
}

/* Style général des boutons d’onglets */
.tab button, .tab span {
    font-family: monospace;
    font-size: 14px;
    padding: 6px 12px;
    background: #C0C0C0;
    border: 2px solid;
    border-color: #FFFFFF #808080 #808080 #FFFFFF;
    cursor: pointer;
    margin-right: 2px;
    box-sizing: border-box;
    color: black;
}

/* Ajustement spécial pour les onglets dans la navbar (meilleur rendu Win98) */
.navbar .tab button, .navbar .tab span {
    padding: 10px 12px;
    opacity: 0.8;
}

/* Hover */
.tab button:hover, .tab span:hover {
    background: #D8D8D8;
}

/* Bouton actif */
.tab button.active, .tab span.active {
    border-color: #808080 #FFFFFF #FFFFFF #808080;
    background: #B0B0B0;
}

.tab span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.win98-select {
    /* Style Win98 */
    font-family: monospace;
    font-size: 14px;
    background: #C0C0C0;
    opacity: 0.8;
    border: 2px solid;
    border-color: #FFFFFF #808080 #808080 #FFFFFF;
    color: black;
    cursor: pointer;
    box-sizing: border-box;

    /* Forme carrée */
    width: 40px;
    height: 40px;
    padding: 0;
    margin: 0;
    margin-right: 2px;

    /* Supprimer le style moderne du select */
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;

    /* Centrage du symbole */
    text-align: center;
    line-height: 36px;

    /* Empêche les décalages */
    display: inline-block;
    vertical-align: middle;
}

/* Hover Win98 */
.win98-select:hover {
    background: #D8D8D8;
}

/* Effet enfoncé Win98 */
.win98-select:active {
    border-color: #808080 #FFFFFF #FFFFFF #808080;
    background: #B0B0B0;
}

/* --- Galerie slideshow --- */
.slideshow-container {
  position: relative;
  max-width: 100%;
  margin-left: 0;
  margin-right: auto;
}

.mySlide {
  display: none;
  width: 100%;
  height: 70vh;
  overflow: hidden;
  text-align: left;
  /* Effet enfoncé */
  border: 2px solid;
  border-color: #808080 #FFFFFF #FFFFFF #808080;
  background-color: #C0C0C0;
  padding: 4px;
}

/* Spécial Nintendo 3DS */
@media screen and (max-device-width: 400px) and (max-device-height: 240px) {
  .mySlide {
    padding-bottom: 100px;
  }
}

.mySlide img {
  max-height: 100%;
  max-width: 100%;
  object-fit: contain;
}

.mySlide iframe {
  width: 100%;
  height: 100%;
  border: none;
  overflow-x: auto;
  overflow-y: auto;
  display: block;
}

/* Empêche le dark mode forcé uniquement pour les iframes TXT/HTML */
iframe:not([src$=".pdf"]):not([src$=".PDF"]) {
    color-scheme: light;
    background-color: #C0C0C0;
}

.thumbnail-row {
  display: block;
  white-space: normal;
  padding: 4px;
  box-sizing: border-box;
  margin-top: 10px;
  font-size: 0;
}

.thumbnail {
  display: inline-block;
  vertical-align: top;
  width: 80px;
  height: 60px;
  margin: 2px;
  object-fit: cover;
  border: 2px solid #000;
  cursor: pointer;
  font-size: 40px;
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
}

.thumbnail:hover {
  opacity: 0.7;
}

.thumbnail.active {
  border: 2px solid #00f;
  opacity: 1;
}

.prev, .next, .openfullscreen {
  background: #C0C0C0;
  border: 2px solid;
  border-color: #FFFFFF #808080 #808080 #FFFFFF;
  font-family: monospace;
  font-size: 22px;
  color: black;
  padding: 1px 10px;
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
}

/* Effet bouton enfoncé */
.prev:active, .next:active, .openfullscreen:active {
  border-color: #808080 #FFFFFF #FFFFFF #808080;
  background: #B0B0B0;
}

.slide-counter {
  position: absolute;
  bottom: 0px;
  left: 180px;
  font-size: 25px;
}

/* --- MODE MOBILE --- */
@media screen and (max-device-width: 1280px) and (orientation: portrait) {
    html, body {
        min-width: 950px;
    }

    .navbar .tab button, .navbar .tab span {
        font-size: 20px;
        padding: 6px 12px;
        border-width: 3px;
        height: 60px;
        line-height: normal;
    }

    .win98-select {
        font-size: 20px;
        width: 60px;
        height: 60px;
        line-height: normal;
        border-width: 3px;
        padding: 0;
        box-sizing: border-box;
    }

    .tab:not(.navbar .tab) button, .tab:not(.navbar .tab) span {
        font-size: 22px;
        padding: 6px 12px;
        border-width: 3px;
        height: 60px;
        line-height: normal;
        box-sizing: border-box;
    }

    .mySlide {
        height: calc(75vh + 200px);
    }

    .prev,
    .next,
    .openfullscreen {
        font-size: 32px;
        padding: 10px 18px;
        border-width: 3px;
        min-width: 70px;
        min-height: 50px;
        line-height: 30px;
        box-sizing: border-box;
    }

    .slide-counter {
        font-size: 32px;
        bottom: 8px;
        left: 280px;
    }
}

@media screen and (max-device-width: 1280px) and (orientation: landscape) {
    html, body {
        min-width: 950px;
    }

    .prev,
    .next,
    .openfullscreen {
        font-size: 28px;
    }

    .mySlide {
        height: calc(50vh + 150px);
    }
}

/* --- Bouton de téléchargement --- */
.dl-btn {
    display: inline-block;

    margin: 5px 0;

.dl-btn:hover {

select {

}

<!-- Scripts -->
<script>
var lastScroll = 0;

window.addEventListener("scroll", function () {
    var navbar = document.querySelector(".navbar");
    var current = window.scrollY;

    if (current > lastScroll && current > 50) {
        navbar.classList.add("hide");
    } else {
        navbar.classList.remove("hide");
    }

    lastScroll = current;
});

var supportsTransform = 'transform' in document.body.style;

if (!supportsTransform) {
    document.documentElement.classList.add('no-transform');
}
</script>

<script>
function downloadFile(select) {
    const file = select.value;
    if (!file) return;

    // Teste si le navigateur supporte l'attribut download
    const a = document.createElement("a");
    const supportsDownload = "download" in a;

    if (supportsDownload) {
        // Mode normal : téléchargement
        a.href = file;
        a.download = "";
        document.body.appendChild(a);
        a.click();
        a.remove();
    } else {
        // Mode fallback (3DS, vieux navigateurs) : ouvrir dans un nouvel onglet
        window.open(file, "_blank");
    }

    // Réinitialise le menu
    select.value = "";
}
</script>

<script>
var slideIndex = {
  Accueil: 0
};

function plusSlides(n, group) {
  slideIndex[group] = slideIndex[group] + n;
  showSlides(slideIndex[group], group);
}

function currentSlide(n, group) {
  slideIndex[group] = n;
  showSlides(slideIndex[group], group);
}

function showSlides(n, group) {
  var allSlides = document.getElementsByClassName("mySlide");
  var slides = [];
  var i;

  // Filtrer par data-group
  for (i = 0; i < allSlides.length; i++) {
    if (allSlides[i].getAttribute("data-group") === group) {
      slides.push(allSlides[i]);
    }
  }

  var allThumbs = document.getElementsByClassName("thumbnail");
  var thumbs = [];

  for (i = 0; i < allThumbs.length; i++) {
    if (allThumbs[i].getAttribute("data-group") === group) {
      thumbs.push(allThumbs[i]);
    }
  }

  if (slides.length === 0) {
    return;
  }

  if (n > slides.length) {
    slideIndex[group] = 1;
  }
  if (n < 1) {
    slideIndex[group] = slides.length;
  }

  // Masquer tous les slides du groupe
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }

  // Désactiver toutes les miniatures du groupe
  for (i = 0; i < thumbs.length; i++) {
    thumbs[i].className = thumbs[i].className.replace(" active", "");
  }

  var current = slides[slideIndex[group] - 1];
  current.style.display = "block";

  // Lazy-load PDF
  var iframes = current.getElementsByTagName("iframe");
  if (iframes.length > 0) {
    var iframe = iframes[0];
    var dataSrc = iframe.getAttribute("data-src");
    if (iframe && !iframe.src && dataSrc) {
      iframe.src = dataSrc;
    }
  }

  if (thumbs.length > 0 && thumbs[slideIndex[group] - 1]) {
    thumbs[slideIndex[group] - 1].className += " active";
  }

  var counter = document.getElementById("counter-" + group);
  if (counter) {
    counter.textContent = slideIndex[group] + " / " + slides.length;
  }
}
</script>

<script>
function openFullscreen(group) {
    var index = slideIndex[group] || 1;
    var slides = document.querySelectorAll('.mySlide[data-group="' + group + '"]');
    if (slides.length === 0) return;

    var activeSlide = slides[index - 1];
    if (!activeSlide) return;

    // 1) iframe (HTML, TXT, PDF)
    var iframe = activeSlide.querySelector("iframe");
    if (iframe) {
        var url = iframe.src || iframe.getAttribute("data-src");
        if (url) {
            window.open(url, "_blank");
            return;
        }
    }

    // 2) image
    var img = activeSlide.querySelector("img");
    if (img && img.src) {
        window.open(img.src, "_blank");
        return;
    }

    // 3) vidéo
    var video = activeSlide.querySelector("video");
    if (video && video.src) {
        window.open(video.src, "_blank");
        return;
    }

    console.log("Aucun contenu ouvrable trouvé dans cette slide");
}
</script>

<script>

</script>

<script>
function openPopupSearch() {
  document.getElementById("popup-search").style.display = "block";
}

function closePopupSearch(e) {
  if (!e || e.target.id === "popup-search") {
    document.getElementById("popup-search").style.display = "none";
  }
}
