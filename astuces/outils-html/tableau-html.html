<script>
/* --- POLYFILLS --- */
// matches()
if (!Element.prototype.matches) {
  Element.prototype.matches =
    Element.prototype.msMatchesSelector ||
    Element.prototype.webkitMatchesSelector ||
    function(selector) {
      var nodes = (this.parentNode || document).querySelectorAll(selector);
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i] === this) return true;
      }
      return false;
    };
}

// closest()
function closest(el, selector) {
  while (el && el.nodeType === 1) {
    if (el.matches(selector)) return el;
    el = el.parentNode;
  }
  return null;
}

// addClass / removeClass
function addClass(el, cls) {
  if (el.className.indexOf(cls) === -1) {
    el.className += " " + cls;
  }
}

function removeClass(el, cls) {
  el.className = el.className.replace(cls, "").replace("  ", " ");
}

// NodeList loop helper
function forEachNode(list, fn) {
  for (var i = 0; i < list.length; i++) fn(list[i], i);
}

/* --- VARIABLES --- */
var table = document.getElementById('editorTable');
var selectedCells = [];
var colorMode = "text";
var globalBorderColor = "#808080";
var globalBorderWidth = "1px";
var globalStyles = {
  textColor: "",
  bgColor: "",
  textAlign: "",
  borderColor: globalBorderColor,
  borderWidth: globalBorderWidth
};

/* --- SÉLECTION MULTIPLE --- */
table.addEventListener('click', function(e) {
  var t = e.target;
  if (t && t.nodeName === 'TD') {

    var multi = document.getElementById('multiSelectMode').checked;

    if (multi) {
      toggleSelect(t);
    } else {
      clearSelection();
      selectCell(t);
    }
  }
});

document.addEventListener('click', function(e) {
  var t = e.target;
  var isCell = t && t.nodeName === 'TD';
  var isTable = closest(t, '#editorTable');
  var isTools = closest(t, '.toolbar');

  if (!isCell && !isTable && !isTools) {
    clearSelection();
  }
});

function selectCell(cell) {
  addClass(cell, "selected");
  selectedCells.push(cell);
}

function toggleSelect(cell) {
  if (cell.className.indexOf("selected") !== -1) {
    removeClass(cell, "selected");
    var idx = selectedCells.indexOf(cell);
    if (idx !== -1) selectedCells.splice(idx, 1);
  } else {
    selectCell(cell);
  }
}

function clearSelection() {
  for (var i = 0; i < selectedCells.length; i++) {
    removeClass(selectedCells[i], "selected");
  }
  selectedCells = [];
}

function getColumnCount() {
  if (!table.rows.length) return 0;
  return table.rows[0].cells.length;
}

function getCellPosition(cell) {
  return { rowIndex: cell.parentNode.rowIndex, cellIndex: cell.cellIndex };
}

function getSelectedCells() {
  return selectedCells;
}

function getRealCell(el) {
  while (el && el.nodeName !== 'TD' && el.nodeName !== 'TABLE') {
    el = el.parentNode;
  }
  return (el && el.nodeName === 'TD') ? el : null;
}

/* --- MOTEUR MATRICIEL ACTIF --- */
var MatrixEngine = (function () {

    function build(table) {
        var matrix = [];
        var maxCols = 0;

        for (var r = 0; r < table.rows.length; r++) {
            var row = table.rows[r];
            if (!matrix[r]) matrix[r] = [];

            var colIndex = 0;

            for (var c = 0; c < row.cells.length; c++) {
                var cell = row.cells[c];

                while (matrix[r][colIndex]) colIndex++;

                var rs = cell.rowSpan || 1;
                var cs = cell.colSpan || 1;

                for (var rr = 0; rr < rs; rr++) {
                    if (!matrix[r + rr]) matrix[r + rr] = [];
                    for (var cc = 0; cc < cs; cc++) {
                        matrix[r + rr][colIndex + cc] = {
                            master: cell,
                            isMaster: (rr === 0 && cc === 0)
                        };
                    }
                }

                colIndex += cs;
                if (colIndex > maxCols) maxCols = colIndex;
            }
        }

        return { matrix: matrix, rows: matrix.length, cols: maxCols };
    }

    function matrixToDOM(matrixObj) {
        var matrix = matrixObj.matrix;
        var rows = matrixObj.rows;
        var cols = matrixObj.cols;

        var newTable = document.createElement("table");
        newTable.style.borderCollapse = "collapse";
        newTable.id = "editorTable";

        for (var r = 0; r < rows; r++) {
            var tr = newTable.insertRow(-1);

            for (var c = 0; c < cols; c++) {
                var info = matrix[r][c];
                if (!info || !info.isMaster) continue;

                var td = info.master.cloneNode(true);
                td.removeAttribute("rowSpan");
                td.removeAttribute("colSpan");

                var rs = 1;
                while (r + rs < rows && matrix[r + rs][c] && matrix[r + rs][c].master === info.master) rs++;
                if (rs > 1) td.rowSpan = rs;

                var cs = 1;
                while (c + cs < cols && matrix[r][c + cs] && matrix[r][c + cs].master === info.master) cs++;
                if (cs > 1) td.colSpan = cs;

                td.contentEditable = "true";
                tr.appendChild(td);
            }
        }

        return newTable;
    }

    function insertRow(matrixObj, rowIndex) {
        var cols = matrixObj.cols;
        var matrix = matrixObj.matrix;
        var newRow = [];

        for (var c = 0; c < cols; c++) {
            var above = matrix[rowIndex - 1] ? matrix[rowIndex - 1][c] : null;
            var below = matrix[rowIndex] ? matrix[rowIndex][c] : null;

            if (above && below && above.master === below.master) {
                newRow[c] = { master: above.master, isMaster: false };
            } else {
                var td = document.createElement("td");
                td.contentEditable = "true";
                newRow[c] = { master: td, isMaster: true };
            }
        }

        matrix.splice(rowIndex, 0, newRow);
        matrixObj.rows++;
    }

    function insertCol(matrixObj, colIndex) {
        var rows = matrixObj.rows;
        var matrix = matrixObj.matrix;

        for (var r = 0; r < rows; r++) {
            var left = matrix[r][colIndex - 1];
            var right = matrix[r][colIndex];

            if (left && right && left.master === right.master) {
                matrix[r].splice(colIndex, 0, { master: left.master, isMaster: false });
            } else {
                var td = document.createElement("td");
                td.contentEditable = "true";
                matrix[r].splice(colIndex, 0, { master: td, isMaster: true });
            }
        }

        matrixObj.cols++;
    }

    function deleteRow(matrixObj, rowIndex) {
        matrixObj.matrix.splice(rowIndex, 1);
        matrixObj.rows--;
    }

    function deleteCol(matrixObj, colIndex) {
        for (var r = 0; r < matrixObj.rows; r++) {
            matrixObj.matrix[r].splice(colIndex, 1);
        }
        matrixObj.cols--;
    }

    return {
        build: build,
        toDOM: matrixToDOM,
        insertRow: insertRow,
        insertCol: insertCol,
        deleteRow: deleteRow,
        deleteCol: deleteCol
    };
})();

function getSelectionRectangle(table, selectedCells) {
    var m = MatrixEngine.build(table).matrix;
    var positions = [];

    for (var r = 0; r < m.length; r++) {
        for (var c = 0; c < m[r].length; c++) {
            if (selectedCells.indexOf(m[r][c].master) !== -1) {
                positions.push({ r: r, c: c });
            }
        }
    }

    if (!positions.length) return null;

    var minR = positions[0].r, maxR = positions[0].r;
    var minC = positions[0].c, maxC = positions[0].c;

    for (var i = 1; i < positions.length; i++) {
        var p = positions[i];
        if (p.r < minR) minR = p.r;
        if (p.r > maxR) maxR = p.r;
        if (p.c < minC) minC = p.c;
        if (p.c > maxC) maxC = p.c;
    }

    // vérifier que tout le rectangle est sélectionné
    for (var r = minR; r <= maxR; r++) {
        for (var c = minC; c <= maxC; c++) {
            if (selectedCells.indexOf(m[r][c].master) === -1) {
                return null;
            }
        }
    }

    return { minR: minR, maxR: maxR, minC: minC, maxC: maxC };
}

function mergeSelectedCells() {
    if (!selectedCells.length) return;

    var rect = getSelectionRectangle(table, selectedCells);
    if (!rect) return;

    var mObj = MatrixEngine.build(table);
    var m = mObj.matrix;

    var master = m[rect.minR][rect.minC].master;
    var masterHTML = master.innerHTML; // on garde son contenu

    // tous les slaves pointent vers le même master
    for (var r = rect.minR; r <= rect.maxR; r++) {
        for (var c = rect.minC; c <= rect.maxC; c++) {
            m[r][c] = {
                master: master,
                isMaster: (r === rect.minR && c === rect.minC)
            };
        }
    }

    // on ne garde le contenu que dans le maître
    master.innerHTML = masterHTML;

    var newTable = MatrixEngine.toDOM(mObj);
    table.parentNode.replaceChild(newTable, table);
    table = newTable;

    rebindTableEvents();
    clearAllSelectedClasses(table);

    var m2 = MatrixEngine.build(table).matrix;
    var newMaster = m2[rect.minR][rect.minC].master;
    newMaster.classList.add("selected");
    selectedCells = [newMaster];
}

function unmergeSelectedCells() {
    if (selectedCells.length !== 1) return;

    var mObj = MatrixEngine.build(table);
    var m = mObj.matrix;
    var rows = mObj.rows;
    var cols = mObj.cols;

    var cell = selectedCells[0];
    var pos = null;

    // retrouver sa position matricielle
    for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
            if (m[r][c].master === cell) {
                pos = { r: r, c: c };
                break;
            }
        }
        if (pos) break;
    }
    if (!pos) return;

    var master = m[pos.r][pos.c].master;
    var masterHTML = master.innerHTML;

    // trouver le rectangle de fusion
    var minR = pos.r, maxR = pos.r, minC = pos.c, maxC = pos.c;

    while (minR - 1 >= 0 && m[minR - 1][pos.c] && m[minR - 1][pos.c].master === master) minR--;
    while (maxR + 1 < rows && m[maxR + 1][pos.c] && m[maxR + 1][pos.c].master === master) maxR++;
    while (minC - 1 >= 0 && m[pos.r][minC - 1] && m[pos.r][minC - 1].master === master) minC--;
    while (maxC + 1 < cols && m[pos.r][maxC + 1] && m[pos.r][maxC + 1].master === master) maxC++;

    // recréer des cellules indépendantes
    for (var rr = minR; rr <= maxR; rr++) {
        for (var cc = minC; cc <= maxC; cc++) {
            var td = document.createElement("td");
            td.contentEditable = "true";
            td.innerHTML = (rr === pos.r && cc === pos.c) ? masterHTML : "";
            m[rr][cc] = { master: td, isMaster: true };
        }
    }

    var newTable = MatrixEngine.toDOM(mObj);
    table.parentNode.replaceChild(newTable, table);
    table = newTable;

    rebindTableEvents();
    clearAllSelectedClasses(table);

    var m2 = MatrixEngine.build(table).matrix;
    var newCell = m2[pos.r][pos.c].master;
    newCell.classList.add("selected");
    selectedCells = [newCell];
}

document.getElementById("mergeCellsBtn").onclick = mergeSelectedCells;
document.getElementById("unmergeCellsBtn").onclick = unmergeSelectedCells;

/* --- SÉLECTION : SAUVEGARDE / RESTAURATION / NETTOYAGE --- */
function getSelectedMatrixPositions(table, selectedCells) {
    var m = MatrixEngine.build(table).matrix;
    var positions = [];

    for (var r = 0; r < m.length; r++) {
        for (var c = 0; c < m[r].length; c++) {
            if (selectedCells.indexOf(m[r][c].master) !== -1) {
                positions.push({ r: r, c: c });
            }
        }
    }

    return positions;
}

function restoreSelectionFromMatrixPositions(table, positions) {
    var m = MatrixEngine.build(table).matrix;
    selectedCells = [];

    for (var i = 0; i < positions.length; i++) {
        var pos = positions[i];
        if (!m[pos.r] || !m[pos.r][pos.c]) continue;
        var cell = m[pos.r][pos.c].master;

        cell.classList.add("selected");
        selectedCells.push(cell);
    }
}

function clearAllSelectedClasses(table) {
    var tds = table.getElementsByTagName("td");
    for (var i = 0; i < tds.length; i++) {
        tds[i].classList.remove("selected");
    }
}

/* --- AJUSTEMENT DES COORDONNÉES APRÈS INSERT / DELETE --- */
function adjustPositionsForRowInsert(positions, rowIndex) {
    for (var i = 0; i < positions.length; i++) {
        if (positions[i].r >= rowIndex) {
            positions[i].r++;
        }
    }
}

function adjustPositionsForRowDelete(positions, rowIndex) {
    for (var i = 0; i < positions.length; i++) {
        if (positions[i].r > rowIndex) {
            positions[i].r--;
        }
    }
}

function adjustPositionsForColInsert(positions, colIndex) {
    for (var i = 0; i < positions.length; i++) {
        if (positions[i].c >= colIndex) {
            positions[i].c++;
        }
    }
}

function adjustPositionsForColDelete(positions, colIndex) {
    for (var i = 0; i < positions.length; i++) {
        if (positions[i].c > colIndex) {
            positions[i].c--;
        }
    }
}

/* --- LIGNES --- */
document.getElementById('addRowAbove').onclick = function () {
    if (!selectedCells.length) return;

    var pos = getCellPosition(selectedCells[0]);
    var saved = getSelectedMatrixPositions(table, selectedCells);
    adjustPositionsForRowInsert(saved, pos.rowIndex);

    var m = MatrixEngine.build(table);
    MatrixEngine.insertRow(m, pos.rowIndex);

    var newTable = MatrixEngine.toDOM(m);
    table.parentNode.replaceChild(newTable, table);
    table = newTable;

    rebindTableEvents();
    clearAllSelectedClasses(table);
    restoreSelectionFromMatrixPositions(table, saved);
};

document.getElementById('addRowBelow').onclick = function () {
    if (!selectedCells.length) return;

    var pos = getCellPosition(selectedCells[0]);
    var saved = getSelectedMatrixPositions(table, selectedCells);
    adjustPositionsForRowInsert(saved, pos.rowIndex + 1);

    var m = MatrixEngine.build(table);
    MatrixEngine.insertRow(m, pos.rowIndex + 1);

    var newTable = MatrixEngine.toDOM(m);
    table.parentNode.replaceChild(newTable, table);
    table = newTable;

    rebindTableEvents();
    clearAllSelectedClasses(table);
    restoreSelectionFromMatrixPositions(table, saved);
};

document.getElementById('delRow').onclick = function () {
    if (!selectedCells.length) return;

    var pos = getCellPosition(selectedCells[0]);
    var saved = getSelectedMatrixPositions(table, selectedCells);
    adjustPositionsForRowDelete(saved, pos.rowIndex);

    var m = MatrixEngine.build(table);
    MatrixEngine.deleteRow(m, pos.rowIndex);

    var newTable = MatrixEngine.toDOM(m);
    table.parentNode.replaceChild(newTable, table);
    table = newTable;

    rebindTableEvents();
    clearAllSelectedClasses(table);
    restoreSelectionFromMatrixPositions(table, saved);
};

/* --- ALIGNEMENT --- */
var alignButtons = document.querySelectorAll('button[data-align]');
forEachNode(alignButtons, function(btn) {
  btn.onclick = function() {
    var align = btn.getAttribute('data-align');
    if (selectedCells.length > 0) {
      for (var j = 0; j < selectedCells.length; j++) {
        selectedCells[j].style.textAlign = align;
      }
    } else {
      globalStyles.textAlign = align;
      document.documentElement.style.setProperty("--global-text-align", align);
    }
  };
});

/* --- PALETTE + MODES --- */

var modeButtons = document.querySelectorAll('#colorModes button');
forEachNode(modeButtons, function(btn) {
  btn.onclick = function() {
    colorMode = btn.getAttribute('data-mode');

    forEachNode(modeButtons, function(b) {
      removeClass(b, "active");
    });

    addClass(btn, "active");
  };
});

var paletteColors = document.querySelectorAll('#colorPalette .color');
forEachNode(paletteColors, function(el) {
  el.onclick = function() {
    var col = el.getAttribute('data-col');
    applyColor(col);
  };
});

function applyColor(col) {
  var r, c2;

if (colorMode === "text") {
  if (selectedCells.length > 0) {
    for (var i = 0; i < selectedCells.length; i++) {
      selectedCells[i].style.color = col;
      }
     } else {
        globalStyles.textColor = col;
        document.documentElement.style.setProperty("--global-text-color", col);
        }
}

else if (colorMode === "bg") {
  if (selectedCells.length > 0) {
    for (var i2 = 0; i2 < selectedCells.length; i2++) {
      selectedCells[i2].style.backgroundColor = col;
    }
  } else {
      globalStyles.bgColor = col;
      document.documentElement.style.setProperty("--global-bg-color", col);
    }
}

else if (colorMode === "border") {
  globalBorderColor = col;
  globalStyles.borderColor = col;

  document.documentElement.style.setProperty("--cell-border-color", globalBorderColor);
  document.documentElement.style.setProperty("--table-border-color", globalBorderColor);
}
}

document.getElementById('applyHexColor').onclick = function () {
  var col = document.getElementById('hexColorInput').value;

  // enlever espaces
  col = col.replace(/^\s+|\s+$/g, "");

  // si vide → on ignore
  if (!col) return;

  // appliquer selon mode
  applyColor(col);
};

/* --- EXPORT HTML --- */
function rgbToHex(rgb) {
  var m = rgb.match(/\d+/g);
  if (!m) return rgb;
  var r = parseInt(m[0], 10).toString(16);
  var g = parseInt(m[1], 10).toString(16);
  var b = parseInt(m[2], 10).toString(16);
  if (r.length < 2) r = "0" + r;
  if (g.length < 2) g = "0" + g;
  if (b.length < 2) b = "0" + b;
  return "#" + r + g + b;
}

function convertInlineRGBToHex(cell) {
    var style = cell.getAttribute("style");
    if (!style) return;

    // 1. Convertir rgb(...) → #hex
    var rgbs = style.match(/rgb\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*\)/g);
    if (rgbs) {
        for (var i = 0; i < rgbs.length; i++) {
            var hex = rgbToHex(rgbs[i]);
            style = style.replace(rgbs[i], hex);
        }
    }

    // 2. Parser toutes les propriétés
    var parts = style.split(";");
    var cleaned = [];

    for (var i = 0; i < parts.length; i++) {
        var p = parts[i].trim();
        if (!p) continue;

        var kv = p.split(":");
        if (kv.length !== 2) continue;

        var key = kv[0].trim();
        var val = kv[1].trim();

        // 3. Normaliser les noms de propriétés
        if (key.toLowerCase() === "background-color") key = "background";

        // 4. Reconstruire sans espace
        cleaned.push(key + ":" + val);
    }

    // 5. Réassembler proprement
    var finalStyle = cleaned.join(";") + ";";

    cell.setAttribute("style", finalStyle);
}

function updateCodeBox() {
  var clone = table.cloneNode(true);
  var newId = document.getElementById("importTableId").value || "tableau1";
  clone.id = newId;

  removeEmptyTextNodes(clone);

  // travailler directement sur le clone, sans toucher à table
  var cells = clone.getElementsByTagName("td");
  for (var i = 0; i < cells.length; i++) {
    var cell = cells[i];

    cell.removeAttribute("contenteditable");
    removeClass(cell, "selected");

    // convertir les rgb inline en hex
    convertInlineRGBToHex(cell);

    // nettoyer uniquement les bordures
    cell.style.border = "";
    cell.style.borderColor = "";
    cell.style.borderWidth = "";

    if (!cell.className.replace(" ", "")) cell.removeAttribute("class");
  }

  var styleBlock = "<style>\n";

  // Bordure : toujours générée, avec fallback si vide
  var bw = globalStyles.borderWidth || "1px";
  var bc = globalStyles.borderColor || "#808080";
  styleBlock += "#" + newId + " td{border:" + bw + " solid " + bc + ";}\n";

  if (globalStyles.textColor)
    styleBlock += "#" + newId + " td{color:" + globalStyles.textColor + ";}\n";

  if (globalStyles.bgColor)
    styleBlock += "#" + newId + " td{background:" + globalStyles.bgColor + ";}\n";

  if (globalStyles.textAlign)
    styleBlock += "#" + newId + " td{text-align:" + globalStyles.textAlign + ";}\n";

  styleBlock += "</style>\n";

  var html = styleBlock + clone.outerHTML;
  html = beautifyHTML(html);

  document.getElementById('codeBox').value = html;
}

function removeEmptyTextNodes(node) {
  var child = node.firstChild;
  while (child) {
    var next = child.nextSibling;

    // nœud texte contenant uniquement espaces / retours à la ligne
    if (child.nodeType === 3 && !child.nodeValue.replace(/\s+/g, "")) {
      node.removeChild(child);
    } else if (child.nodeType === 1) {
      removeEmptyTextNodes(child);
    }

    child = next;
  }
}

function beautifyHTML(html) {
  // Supprimer les retours internes avant </td>
  html = html.replace(/>\s+<\/td>/g, "></td>");

  var result = "";
  var indent = 0;
  var i = 0;

  while (i < html.length) {

    // Cas spécial : <td> ... </td> sur une seule ligne
    if (html.substr(i, 3).toLowerCase() === "<td") {

      // recopier <td ...>
      while (i < html.length && html[i] !== ">") {
        result += html[i++];
      }
      result += ">"; i++;

      // recopier contenu jusqu'à </td>
      while (i < html.length && html.substr(i, 5).toLowerCase() !== "</td>") {
        // ignorer les retours internes
        if (html[i] !== "\n" && html[i] !== "\r") {
          result += html[i];
        }
        i++;
      }

      // recopier </td>
      result += "</td>";
      i += 5;

      continue;
    }

    // Balise fermante
    if (html[i] === "<" && html[i+1] === "/") {
      indent--;
      result += "\n" + repeat("  ", indent);
    }

    // Balise ouvrante
    else if (html[i] === "<") {
      result += "\n" + repeat("  ", indent);
      indent++;
    }

    result += html[i++];
  }

  return result.replace(/^\n/, "");
}

function repeat(str, count) {
  var out = "";
  for (var i = 0; i < count; i++) out += str;
  return out;
}

function importTableFromHTML(code) {
  var container = document.createElement('div');
  container.innerHTML = code;

  var newTable = container.querySelector('table');
  var importedStyle = container.querySelector("style");

  // 1. Remplacer la table AVANT de mettre à jour les variables CSS
  if (newTable) {
    newTable.id = "editorTable";
    table.parentNode.replaceChild(newTable, table);
    table = newTable;
    clearSelection();
    selectedCells = [];
    // NORMALISATION MATRICIELLE
    var m = MatrixEngine.build(table);
    var normalized = MatrixEngine.toDOM(m);
    table.parentNode.replaceChild(normalized, table);
    table = normalized;
    selectedCells = [];
    rebindTableEvents();
  }

  // 2. Maintenant appliquer les styles globaux
  if (importedStyle) {
    var css = importedStyle.textContent;
    // RESET automatique si la propriété n'existe plus dans le <style>
    // Reset border width
    if (!css.includes("border:")) {
        document.documentElement.style.removeProperty("--cell-border-width");
        document.documentElement.style.removeProperty("--table-border-width");
        globalStyles.borderWidth = "";
    }

    // Reset border color
    if (!css.includes("solid")) {
        document.documentElement.style.removeProperty("--cell-border-color");
        document.documentElement.style.removeProperty("--table-border-color");
        globalStyles.borderColor = "";
    }

    // Reset text color
    if (!css.includes("color:")) {
        document.documentElement.style.removeProperty("--global-text-color");
        globalStyles.textColor = "";
    }

    // Reset background color
    if (!css.includes("background:")) {
        document.documentElement.style.removeProperty("--global-bg-color");
        globalStyles.bgColor = "";
    }

    // Reset alignement
    if (!css.includes("text-align:")) {
        document.documentElement.style.removeProperty("--global-text-align");
        globalStyles.textAlign = "";
    }

    // Extraire épaisseur
    var wMatch = css.match(/border:\s*([0-9]+px)/);
    if (wMatch) {
        globalBorderWidth = wMatch[1];
        globalStyles.borderWidth = globalBorderWidth;
        document.documentElement.style.setProperty("--cell-border-width", globalBorderWidth);
        document.documentElement.style.setProperty("--table-border-width", globalBorderWidth);
    }

    // Extraire couleur
    var cMatch = css.match(/solid\s*([^;]+)/i);
    if (cMatch) {
        globalBorderColor = cMatch[1].replace(/^\s+|\s+$/g, "");
        globalStyles.borderColor = globalBorderColor;
        document.documentElement.style.setProperty("--cell-border-color", globalBorderColor);
        document.documentElement.style.setProperty("--table-border-color", globalBorderColor);
    }

    // Couleur texte globale
    var tMatch = css.match(/(?:^|[;{])\s*color\s*:\s*([^;}\n]+)/i);
    if (tMatch) {
        globalStyles.textColor = tMatch[1].replace(/^\s+|\s+$/g, "");
        document.documentElement.style.setProperty("--global-text-color", globalStyles.textColor);
    }

    // Fond global
    var bgMatch = css.match(/background(?:-color)?:\s*([^;]+)/i);
    if (bgMatch) {
        globalStyles.bgColor = bgMatch[1].replace(/^\s+|\s+$/g, "");
        document.documentElement.style.setProperty("--global-bg-color", globalStyles.bgColor);
    }

    // Alignement global
    var aMatch = css.match(/text-align:\s*(left|center|right)/);
    if (aMatch) {
        globalStyles.textAlign = aMatch[1];
        document.documentElement.style.setProperty("--global-text-align", globalStyles.textAlign);
    }
  }
}

// Nettoyer LibreOffice
document.getElementById("cleanLibreOfficeBtn").onclick = function () {
    var code = document.getElementById("codeBox").value;
    if (!code) return;

    // Nettoyage LibreOffice
    var cleaned = cleanLibreOfficeHTML(code);

    // Remplacer le contenu du textarea

    // RESET COMPLET DES STYLES GLOBAUX

    document.documentElement.style.removeProperty("--table-border-width");
    document.documentElement.style.removeProperty("--cell-border-color");
    document.documentElement.style.removeProperty("--table-border-color");
    document.documentElement.style.removeProperty("--global-text-color");
    document.documentElement.style.removeProperty("--global-bg-color");
    document.documentElement.style.removeProperty("--global-text-align");

    // VALEURS PAR DÉFAUT APRÈS RESET
    globalStyles.borderWidth = "1px";
    globalStyles.borderColor = "#808080";

    document.documentElement.style.setProperty("--cell-border-width", "1px");
    document.documentElement.style.setProperty("--table-border-width", "1px");
    document.documentElement.style.setProperty("--cell-border-color", "#808080");
    document.documentElement.style.setProperty("--table-border-color", "#808080");

    // Importer le tableau nettoyé
    importTableFromHTML(cleaned);

    // Regénérer le code propre final
    updateCodeBox();
};

function cleanLibreOfficeHTML(html) {

  var container = document.createElement("div");
  container.innerHTML = html;

  var table = container.querySelector("table");
  if (!table) return html;

  var all = table.querySelectorAll("*");

  // 1. Supprimer classes LibreOffice
  forEachNode(all, function(el) {
      el.removeAttribute("class");
  });

  // 2. Supprimer balises parasites MAIS garder <br>, <b>, <i>, <u>, <strong>, <em>
  var garbageTags = ["span", "font", "p"]; 
  garbageTags.forEach(function(tag) {
      var nodes = table.querySelectorAll(tag);
      forEachNode(nodes, function(n) {
          while (n.firstChild) n.parentNode.insertBefore(n.firstChild, n);
          n.parentNode.removeChild(n);
      });
  });

  // 3. Convertir align="center" → style="text-align:center"
  forEachNode(all, function(el) {
      var a = el.getAttribute("align");
      if (a) {
          el.style.textAlign = a;
          el.removeAttribute("align");
      }
  });

  // 4. Supprimer attributs inutiles
  forEachNode(all, function(el) {
      el.removeAttribute("valign");
      el.removeAttribute("width");
      el.removeAttribute("height");
      el.removeAttribute("bgcolor");
      el.removeAttribute("border");
      el.removeAttribute("cellpadding");
      el.removeAttribute("cellspacing");
      el.removeAttribute("sdval");
      el.removeAttribute("sdnum");
  });

  // 5. Supprimer bordures inline
  forEachNode(all, function(el) {
      el.style.border = "";
      el.style.borderColor = "";
      el.style.borderWidth = "";
  });

  // 6. Supprimer styles vides
  forEachNode(all, function(el) {
      if (el.getAttribute("style") === "") {
          el.removeAttribute("style");
      }
  });

  return table.outerHTML;
}

function rebindTableEvents() {
  for (var r = 0; r < table.rows.length; r++) {
    for (var c = 0; c < table.rows[r].cells.length; c++) {
      table.rows[r].cells[c].contentEditable = "true";
    }
  }

  table.addEventListener('click', function(e) {
    var t = e.target;
    var cell = getRealCell(t);
    if (!cell) return;

    var multi = document.getElementById('multiSelectMode').checked;

    if (multi) {
      toggleSelect(cell);
    } else {
      clearSelection();
      selectCell(cell);
    }
  });
}

// Glisser-déposer
var codeBox = document.getElementById("codeBox");

codeBox.addEventListener("dragover", function(e) {

    // Si un fichier est glissé → empêcher le comportement natif
    if (e.dataTransfer.types &&
        (e.dataTransfer.types.indexOf("Files") !== -1 ||
         e.dataTransfer.types.indexOf("application/x-moz-file") !== -1)) {

        e.preventDefault(); // autorise le drop fichier
    }

    // Sinon → NE RIEN FAIRE
    // Le navigateur affiche le curseur d’insertion
});

codeBox.addEventListener("drop", function(e) {

    // Si fichier → on gère nous-même
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        e.preventDefault();

        var file = e.dataTransfer.files[0];
        var reader = new FileReader();

        reader.onload = function(ev) {
            // On met le fichier brut dans la zone
            codeBox.value = ev.target.result;
        };

        reader.readAsText(file);
        return;
    }

    // Sinon → laisser le navigateur coller le texte
});

// Bouton Importer fichier…
document.getElementById("importFileBtn").onclick = function () {
    document.getElementById("fileInput").click();
};

document.getElementById("fileInput").addEventListener("change", function () {
    var file = this.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (e) {
        document.getElementById("codeBox").value = e.target.result;
    };
    reader.readAsText(file);
});

document.getElementById('copyCode').onclick = function(e) {
  var btn = event.target;
  var code = document.getElementById('codeBox');

  var temp = document.createElement("textarea");
  temp.value = code.value;
  document.body.appendChild(temp);
  temp.select();

  try { document.execCommand("copy"); } catch (err) {}

  document.body.removeChild(temp);
  btn.focus();
};

toggleBtn.onmousedown = function(e) {

  e.cancelBubble = true;
  if (e.stopPropagation) e.stopPropagation();
};

toggleBtn.onclick = function(e) {
  e = e || window.event;
  e.cancelBubble = true;
  if (e.stopPropagation) e.stopPropagation();

  toolbarVisible = !toolbarVisible;

  if (toolbarVisible) {
    toolbar.className = 'toolbar';
  } else {
    toolbar.className = 'toolbar hidden';
  }
};
