<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Générateur & Lecteur de QR Code</title>

<style>
body {
  font-family: monospace;
  background: #C0C0C0;
  padding: 1rem;
  margin: 0;
  color: black;
}

.section {
  background: #C0C0C0;
  border: 2px solid #FFFFFF;
  border-right-color: #404040;
  border-bottom-color: #404040;
  padding: 10px;
  margin-bottom: 1rem;
}

h1, h2 {
  font-weight: bold;
  margin-top: 0;
}

label {
  font-weight: bold;
}

textarea, input {
  width: 100%;
  padding: 4px;
  margin: 4px 0;
  box-sizing: border-box;
  border: 2px solid #FFFFFF;
  border-right-color: #404040;
  border-bottom-color: #404040;
  background: #FFFFFF;
  font-family: monospace;
  font-size: 14px;
}

textarea {
  height: 150px;
}

.color-picker { margin-bottom: 10px; }

.color-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.color-preview {
  width: 24px;
  height: 24px;
  border: 2px inset #808080;
}

#qrPreview {
background-color:black;
}

#bgPreview {
background-color:white;
}

.hex-input {
  width: 90px;
  padding: 4px;
  font-family: monospace;
  border: 2px solid #FFFFFF;
  border-right-color: #404040;
  border-bottom-color: #404040;
  background: #FFFFFF;
}

.palette {
  margin-top: 6px;
}

.palette div {
  width: 20px;
  height: 20px;
  border: 2px outset #808080;
  cursor: pointer;
  display: inline-block;
  margin: 2x;
}

.win98-btn,
button,
a.btn,
input[type="file"] {
  display: inline-block;
  padding: 4px 10px;
  margin-top: 4px;
  cursor: pointer;
  background: #C0C0C0;
  border: 2px solid #FFFFFF;
  border-right-color: #404040;
  border-bottom-color: #404040;
  font-family: monospace;
  color: black;
  text-decoration: none;
}

.win98-btn:hover,
button:hover,
a.btn:hover,
input[type="file"]:hover {
  background: #E0E0E0;
}

.win98-btn:active,
button:active,
a.btn:active,
input[type="file"]:active {
  border: 2px solid #404040;
  border-right-color: #FFFFFF;
  border-bottom-color: #FFFFFF;
}

#qrcode {
  margin-top: 1rem;
  background: #FFFFFF;
  padding: 10px;
  border: 2px inset #808080;
}

#video {
  width: 100%;
  max-width: 320px;
  background: #000000;
  border: 2px inset #808080;
}


</style>
</head>
<body>

<h1>Générateur & Lecteur de QR Code</h1>

<div class="section">
  <h2>Générer un QR Code</h2>

  <label for="text">Texte / Numéro</label>
  <textarea id="text" wrap="off"></textarea>

  <!-- === COLOR PICKER QR === -->
  <div class="color-picker">
    <label>Couleur du QR :</label>
    <div class="color-row">
      <div id="qrPreview" class="color-preview"></div>
      <input id="qrHex" class="hex-input" value="#000000">
    </div>

    <div class="palette">
      <div data-col="#000000" style="background:#000"></div>
      <div data-col="#ffffff" style="background:#fff"></div>
      <div data-col="#ff0000" style="background:#f00"></div>
      <div data-col="#00ff00" style="background:#0f0"></div>
      <div data-col="#0000ff" style="background:#00f"></div>
      <div data-col="#ffff00" style="background:#ff0"></div>
      <div data-col="#ff00ff" style="background:#f0f"></div>
      <div data-col="#00ffff" style="background:#0ff"></div>
    </div>
  </div>

  <!-- === COLOR PICKER BACKGROUND === -->
  <div class="color-picker">
    <label>Couleur du fond :</label>
    <div class="color-row">
      <div id="bgPreview" class="color-preview"></div>
      <input id="bgHex" class="hex-input" value="#ffffff">
    </div>

    <div class="palette">
      <div data-col="#ffffff" style="background:#fff"></div>
      <div data-col="#000000" style="background:#000"></div>
      <div data-col="#cccccc" style="background:#ccc"></div>
      <div data-col="#808080" style="background:#808080"></div>
      <div data-col="#ffaaaa" style="background:#faa"></div>
      <div data-col="#aaffaa" style="background:#afa"></div>
      <div data-col="#aaaaff" style="background:#aaf"></div>
      <div data-col="#ffffaa" style="background:#ffa"></div>
    </div>

    <label>Opacité du fond :</label>
    <input type="range" id="bgOpacity" min="0" max="1" step="0.01" value="1">

    <input type="number" id="bgOpacityPercent" min="0" max="100" value="100" style="width:70px;">
    <span>%</span>
  </div>

  <!-- === HIDDEN INPUTS POUR LE JS EXISTANT === -->
  <input type="hidden" id="qrColor" value="#000000">
  <input type="hidden" id="bgColor" value="#ffffff">

  <button id="btn-generate">Générer</button>

  <div id="qrcode"></div>

  <button id="export-png">Exporter PNG</button>
  <button id="export-jpg">Exporter JPG</button>
  <button id="export-svg">Exporter SVG</button>
</div>

<div class="section">
  <h2>Décoder un QR Code</h2>

  <input type="file" id="file-input" accept="image/*">
  <canvas id="canvas-file" style="display:none;"></canvas>

  <pre id="decode-file" style="
    overflow-x:auto;
    background:#FFFFFF;
    padding:10px;
    border:2px inset #808080;
    margin-top:10px;
  "></pre>

  <button id="copy-btn" class="win98-btn">Copier</button>
  <a href="credits.txt" class="btn">À propos des libraries / Crédits</a>
</div>

<!-- Librairies nécessaires -->
<script src="zxing-es5.min.js"></script>
<script src="qrcode.js"></script>

<script>
var qr = null;

/* ============================
   UTF‑8 / Base64
============================ */
function decodeUTF8(str) {
  try {
    var bytes = new Uint8Array(str.split('').map(function(c){ return c.charCodeAt(0); }));
    return new TextDecoder("utf-8").decode(bytes);
  } catch(e) {
    return str;
  }
}

function encodeBase64(str) {
  try { return btoa(unescape(encodeURIComponent(str))); }
  catch(e) { return btoa(str); }
}

function decodeBase64(str) {
  try { return decodeURIComponent(escape(atob(str))); }
  catch(e) { return atob(str); }
}

/* ============================
   GÉNÉRATION QR
============================ */
var text = document.getElementById("text");
var btnGen = document.getElementById("btn-generate");
var qrDiv = document.getElementById("qrcode");

function drawQRImage(img) {

  /* === 1) Charger l'image originale du QR === */
  var canvas = document.createElement("canvas");
  canvas.width = img.width;
  canvas.height = img.height;

  var ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0);

  var original = ctx.getImageData(0, 0, canvas.width, canvas.height);
  var data = original.data;

  /* === 2) ROGNAGE basé uniquement sur le QR original (noir/blanc) === */
  var w = canvas.width;
  var h = canvas.height;

  var minX = w, minY = h, maxX = 0, maxY = 0;

  for (var y = 0; y < h; y++) {
    for (var x = 0; x < w; x++) {
      var i = (y * w + x) * 4;

      // Pixel noir = QR ; Pixel blanc = fond
      if (data[i] < 128) { // noir détecté
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }
  }

  var newW = maxX - minX + 1;
  var newH = maxY - minY + 1;

  var cropped = document.createElement("canvas");
  cropped.width = newW;
  cropped.height = newH;

  var cctx = cropped.getContext("2d");
  cctx.drawImage(canvas, minX, minY, newW, newH, 0, 0, newW, newH);

  /* === 3) Recoloration + opacité sur l'image déjà rognée === */
  var recolor = cctx.getImageData(0, 0, newW, newH);
  var d = recolor.data;

  var fg = document.getElementById("qrColor").value;
  var bg = document.getElementById("bgColor").value;
  var bgOpacity = parseFloat(document.getElementById("bgOpacity").value);

  var fgR = parseInt(fg.slice(1, 3), 16);
  var fgG = parseInt(fg.slice(3, 5), 16);
  var fgB = parseInt(fg.slice(5, 7), 16);

  var bgR = parseInt(bg.slice(1, 3), 16);
  var bgG = parseInt(bg.slice(3, 5), 16);
  var bgB = parseInt(bg.slice(5, 7), 16);

  for (var i = 0; i < d.length; i += 4) {
    if (d[i] < 128) {
      // Pixel QR
      d[i] = fgR;
      d[i+1] = fgG;
      d[i+2] = fgB;
      d[i+3] = 255;
    } else {
      // Pixel fond
      d[i] = bgR;
      d[i+1] = bgG;
      d[i+2] = bgB;
      d[i+3] = Math.round(bgOpacity * 255);
    }
  }

  cctx.putImageData(recolor, 0, 0);

  /* === 4) Affichage === */
  qrDiv.innerHTML = "";
  qrDiv.appendChild(cropped);
}

function generateQR() {
  var value = text.value.trim();
  qrDiv.innerHTML = "";

  qr = qrcode(0, 'H');
  qr.addData(value, 'Byte');
  qr.make();

  var imgTag = qr.createImgTag(4);
  var src = imgTag.match(/src="([^"]+)"/)[1];

  var img = new Image();
  var is3DS = navigator.userAgent.indexOf("Nintendo 3DS") !== -1;

  if (is3DS) {
    img.src = src;
    setTimeout(function(){ drawQRImage(img); }, 50);
  } else {
    img.onload = function(){ drawQRImage(img); };
    img.src = src;
  }
}

btnGen.onclick = generateQR;
initColorPicker("qrHex", "qrPreview", function(hex){
  document.getElementById("qrColor").value = hex;
  generateQR();
});

initColorPicker("bgHex", "bgPreview", function(hex){
  document.getElementById("bgColor").value = hex;
  generateQR();
});
document.getElementById("bgOpacity").onchange = generateQR;

/* ============================
   EXPORT PNG / JPG
============================ */
document.getElementById("export-png").onclick = function () {
  var qrCanvas = qrDiv.querySelector("canvas");
  if (!qrCanvas) return;
  download("code.png", qrCanvas.toDataURL("image/png"));
};

document.getElementById("export-jpg").onclick = function () {
  var qrCanvas = qrDiv.querySelector("canvas");
  if (!qrCanvas) return;
  download("code.jpg", qrCanvas.toDataURL("image/jpeg"));
};

function download(filename, dataUrl) {
  var a = document.createElement("a");
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

document.getElementById("export-svg").onclick = function () {
  if (!qr) return;

  var count = qr.getModuleCount();
  var cell = 10;
  var size = count * cell;

  var fg = document.getElementById("qrColor").value;
  var bg = document.getElementById("bgColor").value;
  var bgOpacity = parseFloat(document.getElementById("bgOpacity").value);

  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">';
  svg += '<rect width="100%" height="100%" fill="' + bg + '" fill-opacity="' + bgOpacity + '"/>';

  for (var y = 0; y < count; y++) {
    for (var x = 0; x < count; x++) {
      if (qr.isDark(y, x)) {
        svg += '<rect x="' + (x * cell) + '" y="' + (y * cell) + '" width="' + cell + '" height="' + cell + '" fill="' + fg + '"/>';
      }
    }
  }

  svg += '</svg>';

  var blob = new Blob([svg], { type: "image/svg+xml" });
  var url = URL.createObjectURL(blob);

  var a = document.createElement("a");
  a.href = url;
  a.download = "qr-code.svg";
  a.click();

  URL.revokeObjectURL(url);
};
/* ============================
   DÉCODAGE FICHIER
============================ */
var fileInput = document.getElementById("file-input");
var canvasFile = document.getElementById("canvas-file");
var ctxFile = canvasFile.getContext("2d");
var decodeFile = document.getElementById("decode-file");

if (typeof ZXing === "undefined" || !ZXing.BrowserQRCodeReader) {
  fileInput.disabled = true;
  decodeFile.innerText = "Lecture QR désactivée (ZXing non chargé).";
} else {

  var readerZX = new ZXing.BrowserQRCodeReader();

  fileInput.onchange = function (e) {
    var file = e.target.files[0];
    if (!file) return;

    var img = new Image();
    img.onload = function () {

      var maxSize = 1000;
      var scale = Math.min(maxSize / img.width, maxSize / img.height, 1);

      canvasFile.width = img.width * scale;
      canvasFile.height = img.height * scale;

      ctxFile.drawImage(
        img,
        0, 0, img.width, img.height,
        0, 0, canvasFile.width, canvasFile.height
      );

      var tempImg = new Image();
      tempImg.onload = function () {
        readerZX.decodeFromImageElement(tempImg)
          .then(function(result){ decodeFile.innerText = result.text; })
          .catch(function(){ decodeFile.innerText = "Aucun QR détecté."; });
      };

      tempImg.src = canvasFile.toDataURL("image/png");
    };

    img.src = URL.createObjectURL(file);
  };
}

/* ============================
   COPIER
============================ */
document.getElementById("copy-btn").onclick = function () {
  var text = document.getElementById("decode-file").innerText;

  var temp = document.createElement("textarea");
  temp.value = text;
  temp.style.position = "fixed";
  temp.style.opacity = "0";
  document.body.appendChild(temp);

  temp.select();
  document.execCommand("copy");
  document.body.removeChild(temp);
};

function cssNameToHex(name) {
  var ctx = document.createElement("canvas").getContext("2d");
  ctx.fillStyle = "#000"; // valeur par défaut
  ctx.fillStyle = name;   // si invalide, reste "#000"
  var computed = ctx.fillStyle;

  // Si le navigateur n'a pas reconnu le nom → retourne null
  if (computed === "#000000" && name.toLowerCase() !== "black") {
    return null;
  }

  return computed; // retourne "#rrggbb"
}

function initColorPicker(hexInputId, previewId, callback, skipInit) {
  var input = document.getElementById(hexInputId);
  var preview = document.getElementById(previewId);

  function applyColor(hex, trigger) {
    preview.style.background = hex;
    input.value = hex;
    if (trigger !== false) callback(hex);
  }

  input.onchange = function () {
	this.value = this.value.toLowerCase();
    var v = input.value.trim();

    // 0) Ajouter # si hex sans #
    if (/^[0-9A-Fa-f]{6}$/.test(v)) {
      v = "#" + v;
    }

    // 1) Si c'est un hex valide (#xxxxxx)
    if (/^#[0-9A-Fa-f]{6}$/.test(v)) {
      applyColor(v);
      return;
    }

    // 2) Sinon, essayer comme nom CSS
    var hex = cssNameToHex(v);
    if (hex) {
      applyColor(hex);
    }
  };

  var palette = input.parentNode.parentNode.querySelector(".palette");
  var items = palette.querySelectorAll("div");

  for (var i = 0; i < items.length; i++) {
    items[i].onclick = function () {
      applyColor(this.dataset.col);
    };
  }

  // Ne déclenche pas generateQR au chargement
  applyColor(input.value, false);
}

var bgSlider = document.getElementById("bgOpacity");
var bgPercent = document.getElementById("bgOpacityPercent");

/* Slider → Pourcentage */
bgSlider.onchange = function () {
  var v = parseFloat(bgSlider.value);
  bgPercent.value = Math.round(v * 100);
  generateQR();
};

/* Pourcentage → Slider */
bgPercent.onchange = function () {
  var p = parseInt(bgPercent.value, 10);

  if (isNaN(p)) p = 0;
  if (p < 0) p = 0;
  if (p > 100) p = 100;

  bgPercent.value = p;
  bgSlider.value = p / 100;

  generateQR();
};
</script>
</body>
</html>
