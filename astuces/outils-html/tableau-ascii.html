<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau ASCII</title>
<link rel="stylesheet" href="styles.css">
<style>
input{width:50px;}
</style>
</head>
<body>

<h2>Tableau ASCII</h2>

Séparateur : <input id="tableau_ascii_sep" value=";">
&nbsp;&nbsp;
Largeur max : <input type="number" id="tableau_ascii_maxwidth" value="120" min="5">
<button onclick="resetParams()" class="btn-color" style="background:#ff4444;">Valeurs par défaut</button>
<select id="ascii_model">
  <option value="classic">Classique</option>
  <option value="dotted">Pointillé (: .)</option>
  <option value="markdown">Markdown</option>
</select>
<input id="tableau_ascii_custom_char" value="" maxlength="1">
<p></p><textarea wrap="off" id="input"></textarea><p></p>
<button onclick="convertir()" class="btn-color" style="background:#ff8800;">Convertir</button>
<button onclick="copier()" class="btn-color" style="background:#4caf50;">Copier</button>
<button onclick="effacerTout()" class="btn-color" style="background:#ff4444;">Effacer tout</button>
<button id="importFileBtn">Importer fichier…</button>
<input type="file" id="fileInput" style="display:none;">

<p></p><h3>Résultat</h3>
<textarea wrap="off" id="output"></textarea>

<script>
/* --- Compatibilité maximale (ES3) --- */
function setText(el, txt) {
    if (el.value !== undefined) el.value = txt;
    else if (el.textContent !== undefined) el.textContent = txt;
    else el.innerText = txt;
}

function getText(el) {
    if (el.value !== undefined) return el.value;
    return (el.textContent !== undefined) ? el.textContent : el.innerText;
}

function repeat(str, n) {
  var out = "";
  for (var i = 0; i < n; i++) out += str;
  return out;
}

function padRight(str, len) {
  while (str.length < len) str += " ";
  return str;
}

function wrapText(str, max) {
  var words = str.split(" ");
  var lines = [];
  var current = "";

  for (var i = 0; i < words.length; i++) {
    var w = words[i];

    // --- Mot trop long ---
    if (w.length > max) {

      // Si la ligne actuelle contient quelque chose, on la pousse
      if (current.length > 0) {
        lines.push(current);
        current = "";
      }

      // Découpe du mot trop long
      var start = 0;
      while (start < w.length) {
        var chunk = w.substring(start, start + max);
        start += max;

        // La dernière tranche devient la ligne courante
        if (start >= w.length) {
          current = chunk; // ← clé de la correction
        } else {
          lines.push(chunk);
        }
      }

      continue;
    }

    // --- Mot normal ---
    if (current.length === 0) {
      current = w;
    } else if (current.length + 1 + w.length <= max) {
      current += " " + w;
    } else {
      lines.push(current);
      current = w;
    }
  }

  if (current.length > 0) lines.push(current);

  return lines;
}

function asciiTable_generic(rows, MAX_TABLE_WIDTH, style) {
  if (!rows || !rows.length) return "";

  // 1) Nombre de colonnes
  var colCount = 0;
  for (var i = 0; i < rows.length; i++)
    if (rows[i].length > colCount) colCount = rows[i].length;

  // 2) Largeurs naturelles
  var widths = [];
  for (var c = 0; c < colCount; c++) widths[c] = 0;

  for (var r = 0; r < rows.length; r++)
    for (var c = 0; c < colCount; c++) {
      var cell = rows[r][c] || "";
      if (cell.length > widths[c]) widths[c] = cell.length;
    }

  // 3) Largeur totale
  var totalWidth = 1;
  for (var c = 0; c < colCount; c++)
    totalWidth += widths[c] + style.hPadding;

  // 4) Réduction proportionnelle
  if (!style.noCorners && totalWidth > MAX_TABLE_WIDTH) {
    var espace = MAX_TABLE_WIDTH - (style.hPadding * colCount + 1);
    var sum = 0;
    for (var i = 0; i < widths.length; i++) sum += widths[i];
    for (var i = 0; i < widths.length; i++) {
      widths[i] = Math.floor(widths[i] * espace / sum);
      if (widths[i] < 1) widths[i] = 1;
    }
  }

  // 5) Lignes de séparation
  var sepMid;

  if (style.noCorners) {
    // MODE markdown
    sepMid = "";
    for (var c = 0; c < colCount; c++) {
      sepMid += repeat(style.hBorder, widths[c]);
      if (c < colCount - 1) sepMid += style.vBorder; // ← pas de | final
    }
  } else {
    // CLASSIQUE + DOTTED
    sepMid = style.corner;
    for (var c = 0; c < colCount; c++)
      sepMid += repeat(style.hBorder, widths[c] + style.hPadding) + style.corner;
  }

  // Première ligne spéciale pour le modèle pointillé
  var out = "";

  // En mode markdown → pas de ligne du haut
  if (!style.noCorners) {
    var sepTop;
    if (style.firstSep) {
      sepTop = repeat(".", sepMid.length);
    } else {
      sepTop = sepMid;
    }
    out = sepTop + "\n";
  }

  // 6) Lignes avec wrap
  for (var r = 0; r < rows.length; r++) {
    var wrappedCells = [];
    var maxHeight = 1;

    for (var c = 0; c < colCount; c++) {
      var cell = rows[r][c] || "";
      var wrapped = wrapText(cell, widths[c]);
      wrappedCells[c] = wrapped;
      if (wrapped.length > maxHeight) maxHeight = wrapped.length;
    }

  for (var h = 0; h < maxHeight; h++) {

    var line = "";

    if (style.noCorners) {
      // MODE markdown : texte|texte|texte (sans | final)
      for (var c = 0; c < colCount; c++) {
        var txt = wrappedCells[c][h] || "";
        line += padRight(txt, widths[c]);
        if (c < colCount - 1) line += style.vBorder;
      }
    } else {
      // CLASSIQUE + DOTTED
      line = style.vBorder + style.space;
      for (var c = 0; c < colCount; c++) {
        var txt = wrappedCells[c][h] || "";
        line += padRight(txt, widths[c]) + style.space + style.vBorder + style.space;
      }
      line = line.substring(0, line.length - 1);
    }

    out += line + "\n";
    // Ligne de séparation uniquement sous l'entête
    if (style.noCorners && r == 0) {
      out += sepMid + "\n";
    }
  }

    // En mode markdown → pas de ligne du bas
    if (!style.noCorners) {
      out += sepMid + "\n";
    }
  }

  return out;
}

var style_classic = {
  corner: "+",
  hBorder: "-",
  vBorder: "|",
  hPadding: 2,
  space: " "
};

var style_dotted = {
  corner: ":",
  hBorder: ".",
  vBorder: ":",
  hPadding: 2,
  space: " ",
  firstSep: true
};

var style_markdown = {
  corner: "",
  hBorder: "-",
  vBorder: "|",
  hPadding: 0,
  space: "",
  noCorners: true
};

var default_classic = JSON.parse(JSON.stringify(style_classic));
var default_dotted  = JSON.parse(JSON.stringify(style_dotted));
var default_markdown = JSON.parse(JSON.stringify(style_markdown));

document.getElementById("tableau_ascii_custom_char").oninput = function () {
  var c = this.value;

  // Sauvegarde
  localStorage.setItem("tableau_ascii_custom_char", c);

  if (!c || c.length === 0) {
    // Restaurer les styles d'origine
    style_classic = JSON.parse(JSON.stringify(default_classic));
    style_dotted  = JSON.parse(JSON.stringify(default_dotted));
    style_markdown = JSON.parse(JSON.stringify(default_markdown));
    return;
  }

  // Sinon → appliquer le caractère personnalisé
  style_classic.corner = c;
  style_classic.hBorder = c;
  style_classic.vBorder = c;

  style_dotted.corner = c;
  style_dotted.hBorder = c;
  style_dotted.vBorder = c;
  style_dotted.firstSep = false;

  style_markdown.hBorder = c;
  style_markdown.vBorder = c;
};

// Glisser-déposer
var input = document.getElementById("input");

input.addEventListener("dragover", function(e) {

    // Si un fichier est glissé → empêcher le comportement natif
    if (e.dataTransfer.types &&
        (e.dataTransfer.types.indexOf("Files") !== -1 ||
         e.dataTransfer.types.indexOf("application/x-moz-file") !== -1)) {

        e.preventDefault(); // autorise le drop fichier
    }

    // Sinon → NE RIEN FAIRE
    // Le navigateur affiche le curseur d’insertion
});

input.addEventListener("drop", function(e) {

    // Si fichier → on gère nous-même
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        e.preventDefault();

        var file = e.dataTransfer.files[0];
        var reader = new FileReader();

        reader.onload = function(ev) {
            // On met le fichier brut dans la zone
            input.value = ev.target.result;
        };

        reader.readAsText(file);
        return;
    }

    // Sinon → laisser le navigateur coller le texte
});

// Bouton Importer fichier…
document.getElementById("importFileBtn").onclick = function () {
    document.getElementById("fileInput").click();
};

document.getElementById("fileInput").addEventListener("change", function () {
    var file = this.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (e) {
        document.getElementById("input").value = e.target.result;
    };
    reader.readAsText(file);
});

/* --- Conversion CSV → ASCII --- */
function convertir() {
  var texte = document.getElementById("input").value;
  var sep = document.getElementById("tableau_ascii_sep").value || ";";
  var maxwidth = parseInt(document.getElementById("tableau_ascii_maxwidth").value, 10);
  var model = document.getElementById("ascii_model").value;

  if (!texte) return;

  var lignes = texte.split("\n");
  var rows = [];
  for (var i = 0; i < lignes.length; i++)
    rows.push(lignes[i].split(sep));

  var table = "";

  if (model === "classic")
    table = asciiTable_generic(rows, maxwidth, style_classic);
  else if (model === "dotted")
    table = asciiTable_generic(rows, maxwidth, style_dotted);
  else if (model === "markdown")
    table = asciiTable_generic(rows, maxwidth, style_markdown);

  setText(document.getElementById("output"), table);
}

// Bouton copier
function copier() {
  var btn = event.target;
  var texte = getText(document.getElementById("output"));

  var temp = document.createElement("textarea");
  temp.value = texte;
  document.body.appendChild(temp);
  temp.select();

  try { document.execCommand("copy"); } catch (e) {}

  document.body.removeChild(temp);
  btn.focus();
}

// Bouton Effacer tout
function effacerTout() {
  document.getElementById("input").value = "";
  setText(document.getElementById("output"), "");
}

function resetParams() {
  document.getElementById("tableau_ascii_sep").value = ";";
  document.getElementById("tableau_ascii_maxwidth").value = "120";

  var custom = document.getElementById("tableau_ascii_custom_char");
  custom.value = "";
  custom.oninput();

  // Met à jour la sauvegarde
  localStorage.setItem("tableau_ascii_sep", ";");
  localStorage.setItem("tableau_ascii_maxwidth", "120");
  localStorage.removeItem("tableau_ascii_custom_char");
}

/* --- Sauvegarde/Restauration --- */
function saveState() {
  localStorage.setItem("tableau_ascii_sep", document.getElementById("tableau_ascii_sep").value);
  localStorage.setItem("tableau_ascii_maxwidth", document.getElementById("tableau_ascii_maxwidth").value);
}

document.getElementById("tableau_ascii_sep").oninput = saveState;
document.getElementById("tableau_ascii_maxwidth").oninput = saveState;

window.onload = function() {
  var savedtableau_ascii_sep = localStorage.getItem("tableau_ascii_sep");
  var savedMax = localStorage.getItem("tableau_ascii_maxwidth");
  var savedChar = localStorage.getItem("tableau_ascii_custom_char");

  if (savedtableau_ascii_sep !== null) document.getElementById("tableau_ascii_sep").value = savedtableau_ascii_sep;
  if (savedMax !== null) document.getElementById("tableau_ascii_maxwidth").value = savedMax;
  if (savedChar !== null) {
    var custom = document.getElementById("tableau_ascii_custom_char");
    custom.value = savedChar;
    custom.oninput();
  }
};
</script>
</body>
</html>
