<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau ASCII</title>
<style>
body { background-color:#c0c0c0; }
textarea { width:100%; height:200px; box-sizing:border-box; font-family:monospace; }
button {
  color:black;
  border:2px solid;
  border-color:#fff #404040 #404040 #fff;
  padding:4px 8px;
  margin-top:10px;
  font-size:12px;
  cursor:pointer;
}
button:active {
  border-color:#404040 #fff #fff #404040;
}
button:hover { filter: brightness(1.2) }
input, textarea {
  border:2px solid;
  border-color:#808080 #ffffff #ffffff #808080;
}
</style>
</head>
<body>			

<h2>Tableau ASCII</h2>

Séparateur : <input id="sep" value=";" size="1">
&nbsp;&nbsp;
Largeur max : <input id="maxwidth" value="120" size="4">
<button onclick="resetParams()" style="background-color:#ff4444;">Valeurs par défaut</button>

<br><br>
<textarea id="input" wrap="off"></textarea>

<br>
<button onclick="convertir()" style="background-color:#ff8800;">Convertir</button>
<button onclick="copier()" style="background-color:#4caf50;">Copier</button>
<button onclick="effacerTout()" style="background-color:#ff4444;">Effacer tout</button>

<h3>Résultat</h3>
<textarea id="output" wrap="off" readonly></textarea>

<script>
// ------------------------------
// Compatibilité maximale (ES3)
// ------------------------------

function setText(el, txt) {
    if (el.textContent !== undefined) el.textContent = txt;
    else el.innerText = txt; // IE6/IE7
}

function getText(el) {
    return (el.textContent !== undefined) ? el.textContent : el.innerText;
}

function repeat(str, n) {
  var out = "";
  for (var i = 0; i < n; i++) out += str;
  return out;
}

function padRight(str, len) {
  while (str.length < len) str += " ";
  return str;
}

function wrapText(str, max) {
  var words = str.split(" ");
  var lines = [];
  var current = "";

  for (var i = 0; i < words.length; i++) {
    var w = words[i];

    // --- Mot trop long ---
    if (w.length > max) {

      // Si la ligne actuelle contient quelque chose, on la pousse
      if (current.length > 0) {
        lines.push(current);
        current = "";
      }

      // Découpe du mot trop long
      var start = 0;
      while (start < w.length) {
        var chunk = w.substring(start, start + max);
        start += max;

        // La dernière tranche devient la ligne courante
        if (start >= w.length) {
          current = chunk; // ← clé de la correction
        } else {
          lines.push(chunk);
        }
      }

      continue;
    }

    // --- Mot normal ---
    if (current.length === 0) {
      current = w;
    } else if (current.length + 1 + w.length <= max) {
      current += " " + w;
    } else {
      lines.push(current);
      current = w;
    }
  }

  if (current.length > 0) lines.push(current);

  return lines;
}

function asciiTable(rows, MAX_TABLE_WIDTH) {
  if (!rows || !rows.length) return "";

  // 1) Nombre de colonnes
  var colCount = 0;
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].length > colCount) colCount = rows[i].length;
  }

  // 2) Largeurs naturelles
  var widths = [];
  for (var c = 0; c < colCount; c++) widths[c] = 0;

  for (var r = 0; r < rows.length; r++) {
    for (var c = 0; c < colCount; c++) {
      var cell = rows[r][c] || "";
      if (cell.length > widths[c]) widths[c] = cell.length;
    }
  }

  // 3) Largeur totale
  var totalWidth = 1;
  for (var c = 0; c < colCount; c++) {
    totalWidth += widths[c] + 3;
  }

  // 4) Réduction proportionnelle si trop large
  if (totalWidth > MAX_TABLE_WIDTH) {
    var espace = MAX_TABLE_WIDTH - (3 * colCount + 1);
    var sum = 0;
    for (var i = 0; i < widths.length; i++) sum += widths[i];

    for (var i = 0; i < widths.length; i++) {
      widths[i] = Math.floor(widths[i] * espace / sum);
      if (widths[i] < 1) widths[i] = 1;
    }
  }

  // 5) Ligne de séparation
  var sepLine = "+";
  for (var c = 0; c < colCount; c++) {
    sepLine += repeat("-", widths[c] + 2) + "+";
  }

  var out = sepLine + "\n";

  // 6) Génération des lignes avec wrap
  for (var r = 0; r < rows.length; r++) {
    var wrappedCells = [];
    var maxHeight = 1;

    for (var c = 0; c < colCount; c++) {
      var cell = rows[r][c] || "";
      var wrapped = wrapText(cell, widths[c]);
      wrappedCells[c] = wrapped;
      if (wrapped.length > maxHeight) maxHeight = wrapped.length;
    }

    for (var h = 0; h < maxHeight; h++) {
      var line = "| ";
      for (var c = 0; c < colCount; c++) {
        var txt = wrappedCells[c][h] || "";
        line += padRight(txt, widths[c]) + " | ";
      }

      // Ici : on enlève UNIQUEMENT le dernier espace
      line = line.substring(0, line.length - 1);

      out += line + "\n";
    }

    out += sepLine + "\n";
  }

  return out;
}

// Glisser-déposer
var input = document.getElementById("input");

input.addEventListener("dragover", function(e) {

    // Si un fichier est glissé → empêcher le comportement natif
    if (e.dataTransfer.types &&
        (e.dataTransfer.types.indexOf("Files") !== -1 ||
         e.dataTransfer.types.indexOf("application/x-moz-file") !== -1)) {

        e.preventDefault(); // autorise le drop fichier
    }

    // Sinon → NE RIEN FAIRE
    // Le navigateur affiche le curseur d’insertion
});

input.addEventListener("drop", function(e) {

    // Si fichier → on gère nous-même
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        e.preventDefault();

        var file = e.dataTransfer.files[0];
        var reader = new FileReader();

        reader.onload = function(ev) {
            // On met le fichier brut dans la zone
            input.value = ev.target.result;
        };

        reader.readAsText(file);
        return;
    }

    // Sinon → laisser le navigateur coller le texte
});

// ------------------------------
// Conversion CSV → ASCII
// ------------------------------
function convertir() {
  var texte = document.getElementById("input").value;
  var sep = document.getElementById("sep").value || ";";
  var maxWidth = parseInt(document.getElementById("maxwidth").value, 10);

  if (!texte) {
    document.getElementById("output").textContent = "Aucune donnée.";
    return;
  }

  var lignes = texte.split("\n");
  var rows = [];
  for (var i = 0; i < lignes.length; i++) {
    rows.push(lignes[i].split(sep));
  }

  var table = asciiTable(rows, maxWidth);
  setText(document.getElementById("output"), table);
}

// Bouton copier
function copier() {
  var texte = getText(document.getElementById("output"));

  var temp = document.createElement("textarea");
  temp.value = texte;
  document.body.appendChild(temp);
  temp.select();

  try { document.execCommand("copy"); } catch (e) {}

  document.body.removeChild(temp);
}

// Bouton Effacer tout
function effacerTout() {
  document.getElementById("input").value = "";
  setText(document.getElementById("output"), "");
}

function resetParams() {
  document.getElementById("sep").value = ";";
  document.getElementById("maxwidth").value = "120";

  // Met à jour la sauvegarde
  localStorage.setItem("sep", ";");
  localStorage.setItem("maxwidth", "120");
}

// ------------------------------
// Sauvegarde/Restauration
// ------------------------------

function saveState() {
  localStorage.setItem("sep", document.getElementById("sep").value);
  localStorage.setItem("maxwidth", document.getElementById("maxwidth").value);
}

document.getElementById("sep").oninput = saveState;
document.getElementById("maxwidth").oninput = saveState;

window.onload = function() {
  var savedSep = localStorage.getItem("sep");
  var savedMax = localStorage.getItem("maxwidth");

  if (savedSep !== null) document.getElementById("sep").value = savedSep;
  if (savedMax !== null) document.getElementById("maxwidth").value = savedMax;
};
</script>

</body>
</html>
