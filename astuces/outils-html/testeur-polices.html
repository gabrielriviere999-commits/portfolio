<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Testeur de polices</title>
<style>
body {
  font-family: sans-serif;
  background: #c0c0c0;
}
h3 { margin-bottom: 0; }
p { margin-bottom:10px; line-height:0; }
#inputZone {
  width: 100%;
  height: 200px;
  border: 2px solid;
  border-color: #808080 #ffffff #ffffff #808080;
  box-sizing: border-box;
  white-space: pre;
  overflow: auto;
}

.preview {
  background: white;
  border:2px solid;
  border-color: #808080 #ffffff #ffffff #808080;
  padding: 2px;
  margin-top: 10px;
  min-height: 40px;
  max-height: 200px;
  white-space: pre;
  overflow: auto;
}

/* Chaque bloc a sa propre police */
#preview1 { font-family: Courier New; }
#preview2 { font-family: Lucida Console; }
#preview3 { font-family: Consolas; }
#preview4 { font-family: monospace; }
#preview5 { font-family: Arial; }
#preview6 { font-family: Verdana; }
#preview7 { font-family: Times New Roman; }
#preview8 { font-family: Georgia; }
#preview9 { font-family: sans-serif; }
#preview10 { font-family: Comic Sans MS; }
#preview11 { font-family: Impact; }
#preview12 { font-family: Trebuchet MS; }
</style>
</head>
<body>

<h2>Testeur de polices</h2>

<h3>Texte</h3>

<textarea id="inputZone" onkeyup="updateText();"></textarea>

<h3>Affichage des polices</h3>

<p>Courier New</p>
<div id="preview1" class="preview"></div>
<p>Lucida Console</p>
<div id="preview2" class="preview"></div>
<p>Consolas</p>
<div id="preview3" class="preview"></div>
<p>monospace</p>
<div id="preview4" class="preview"></div>
<p>Arial</p>
<div id="preview5" class="preview"></div>
<p>Verdana</p>
<div id="preview6" class="preview"></div>
<p>Times New Roman</p>
<div id="preview7" class="preview"></div>
<p>Georgia</p>
<div id="preview8" class="preview"></div>
<p>sans-serif</p>
<div id="preview9" class="preview"></div>
<p>Comic Sans MS</p>
<div id="preview10" class="preview"></div>
<p>Impact</p>
<div id="preview11" class="preview"></div>
<p>Trebuchet MS</p>
<div id="preview12" class="preview"></div>

<script>
function updateText() {
    var txt = document.getElementById("inputZone").value;

    document.getElementById("preview1").innerHTML = txt;
    document.getElementById("preview2").innerHTML = txt;
    document.getElementById("preview3").innerHTML = txt;
    document.getElementById("preview4").innerHTML = txt;
    document.getElementById("preview5").innerHTML = txt;
    document.getElementById("preview6").innerHTML = txt;
    document.getElementById("preview7").innerHTML = txt;
    document.getElementById("preview8").innerHTML = txt;
    document.getElementById("preview9").innerHTML = txt;
    document.getElementById("preview10").innerHTML = txt;
    document.getElementById("preview11").innerHTML = txt;
    document.getElementById("preview12").innerHTML = txt;
}
</script>

</body>
</html>
