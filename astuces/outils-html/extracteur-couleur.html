<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extracteur couleur</title>
<style>
/* --- Win98 global look --- */
body {
  font-family: sans-serif;
  font-size: 20px;
  background: #c0c0c0;
  width:1230px;
  padding-top: 20px;
}

/* --- Win98 controls --- */
.win98-box {
  background:#c0c0c0;
  border:2px solid;
  border-color:#ffffff #808080 #808080 #ffffff;
  padding:10px;
}

button {
  font-family: inherit;
  color: black;
  font-size: 20px;
  padding: 2px 8px;
  border: 2px solid #ffffff;
  border-right-color: #404040;
  border-bottom-color: #404040;
  background: #c0c0c0;
  cursor: pointer;
}
button:active {
  border: 2px solid #404040;
  border-right-color: #ffffff;
  border-bottom-color: #ffffff;
}
button:hover { background:#e0e0e0; }

/* --- Layout --- */
#dropzone {
  border: 2px dashed #808080;
  background: #e0e0e0;
  padding: 10px;
  text-align: center;
  margin-bottom: 8px;
  font-size: 20px;
}
#dropzone.hover {
  border-color: #000080;
  background: #d0e4ff;
}

#canvasWrapper {
  border: 2px inset #ffffff;
  background: #000000;
  padding: 2px;
}

/* canvas full width */
#canvas {
  height: auto;
  display: block;
  background: #000000;
}

/* Loupe */
#loupe {
  position: absolute;
  width: 80px;
  height: 80px;
  border: 2px solid #000000;
  background: #c0c0c0;
  display: none;
  pointer-events: none;
  image-rendering: pixelated;
  box-shadow: 2px 2px 0 #000000;
}
#loupeCanvas {
  width: 100%;
  height: 100%;
}

/* Croix au centre */
#loupe:after {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: red;
}
#loupe:before {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 1px;
  background: red;
}

/* Croix sur l'image */
.cross {
  position:absolute;
  width:36px;
  height:36px;
  pointer-events:none;
}
.cross:before, .cross:after {
  content:"";
  position:absolute;
  background:#c0c0c0;
}
.cross:before {
  left:50%; top:0; bottom:0;
  width:1px;
  margin-left:-1px;
}
.cross:after {
  top:50%; left:0; right:0;
  height:1px;
  margin-top:-1px;
}

/* Info zone */
#info {
  margin-top: 8px;
  font-size: 20px;
}
#preview {
  width: 32px;
  height: 32px;
  border: 2px inset #ffffff;
  display: inline-block;
  margin-right: 6px;
}
.line {
  margin: 3px 0;
}
.value {
  display: inline-block;
  min-width: 140px;
}

.toolbar {
  display: block;
  background: #c0c0c0;
  border: 2px solid;
  border-color: #fff #404040 #404040 #fff;
  margin-bottom: 10px;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  overflow-y: auto;
  max-height: 225px;
  padding: 4px;
  z-index: 9999
}

/* --- Mode mobile --- */
@media screen and (max-width: 720px) {
  body, button, #dropzone, #info, input { font-size: 50px; }
  #loupe { width: 240px; height: 240px; }
  #preview { width: 96px; height: 96px; }
}
</style>
</head>
<body>
        <h2>Extracteur couleur</h2>
<div class="toolbar" style="opacity: 0.8;">
<button onclick="scrollUp()">↑</button>
<button onclick="scrollDown()">↓</button>
<button onclick="copyText('hexValue', this)">HEX</button>
<button onclick="copyText('rgbValue', this)">RGB</button>
<button onclick="copyText('hslValue', this)">HSL</button>
<button onclick="copyText('hsvValue', this)">HSV</button>
</div>

        <div class="win98-box">
            <div id="dropzone">Glissez-déposez une image ici ou cliquez
                <input type="file" id="fileInput" accept="image/*" style="display:none">
            </div>
            <div id="canvasWrapper">
                <canvas id="canvas" width="1200" height="900"></canvas>
            </div>
        </div>

        <div id="loupe">
            <canvas id="loupeCanvas" width="20" height="20"></canvas>
        </div>
        
        <div id="cross" class="cross" style="display:none;"></div>

        <div class="win98-box">
            <div id="info">
                <div class="line">
                    <div id="preview"></div>
                    <span id="label">Cliquez ou touchez l'image.</span>
                </div>

                <div class="line">
                    HEX :
                    <span id="hexValue" class="value">-</span>
                    <button onclick="copyText('hexValue', this)">Copier</button>
                </div>

                <div class="line">
                    RGB :
                    <span id="rgbValue" class="value">-</span>
                    <button onclick="copyText('rgbValue', this)">Copier</button>
                </div>

                <div class="line">
                    HSL :
                    <span id="hslValue" class="value">-</span>
                    <button onclick="copyText('hslValue', this)">Copier</button>
                </div>

                <div class="line">
                    HSV :
                    <span id="hsvValue" class="value">-</span>
                    <button onclick="copyText('hsvValue', this)">Copier</button>
                </div>
            </div>
        </div>

<script>
/* --- Variables --- */
var dropzone = document.getElementById("dropzone");
var fileInput = document.getElementById("fileInput");
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");

var loupe = document.getElementById("loupe");
var loupeCanvas = document.getElementById("loupeCanvas");
var cross = document.getElementById("cross");
var lctx = loupeCanvas.getContext("2d");

var preview = document.getElementById("preview");
var hexSpan = document.getElementById("hexValue");
var rgbSpan = document.getElementById("rgbValue");
var hslSpan = document.getElementById("hslValue");
var hsvSpan = document.getElementById("hsvValue");
var label = document.getElementById("label");

var currentImage = null;

/* --- Utils --- */
function prevent(e) {
    if (e.preventDefault) e.preventDefault();
    e.returnValue = false;
    return false;
}

/* --- Drag & Drop --- */
dropzone.onclick = function(){ fileInput.click(); };
dropzone.ondragover = function(e){ prevent(e); dropzone.className = "hover"; };
dropzone.ondragenter = function(e){ prevent(e); dropzone.className = "hover"; };
dropzone.ondragleave = function(e){ prevent(e); dropzone.className = ""; };
dropzone.ondrop = function(e){
    prevent(e);
    dropzone.className = "";
    var f = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null;
    if (f) loadFile(f);
};

fileInput.onchange = function(){
    if (fileInput.files && fileInput.files.length > 0) {
        loadFile(fileInput.files[0]);
    }
};

/* --- Chargement image --- */
function loadFile(file){
    if (!/image\//.test(file.type)) {
        alert("Veuillez sélectionner un fichier image.");
        return;
    }
    var reader = new FileReader();
    reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
            currentImage = img;
            drawImageToCanvas(img);
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
}

function drawImageToCanvas(img){
    // largeur affichée réelle du canvas (CSS)
    var displayWidth = canvas.clientWidth;
    if (!displayWidth || displayWidth === 0) {
        // fallback : utiliser largeur fenêtre
        displayWidth = document.documentElement.clientWidth || 400;
    }
    var ratio = img.height / img.width;
    var displayHeight = Math.round(displayWidth * ratio);

    // taille interne du canvas = taille affichée
    canvas.width = displayWidth;
    canvas.height = displayHeight;

    ctx.drawImage(img, 0, 0, displayWidth, displayHeight);
    label.innerHTML = "Cliquez ou touchez l'image pour lire une couleur.";
}

/* --- Copier --- */
function copyText(id, btn){
    var text = document.getElementById(id).innerHTML;
    var t = document.createElement("textarea");
    t.value = text;
    document.body.appendChild(t);
    t.select();
    document.execCommand("copy");
    document.body.removeChild(t);
}

/* --- Conversions couleurs --- */
function toHex(c){ var h = c.toString(16); return h.length == 1 ? "0" + h : h; }
function rgbToHex(r,g,b){ return "#" + toHex(r) + toHex(g) + toHex(b); }

function rgbToHsl(r,g,b){
    var rf = r/255, gf = g/255, bf = b/255;
    var max = Math.max(rf,gf,bf), min = Math.min(rf,gf,bf);
    var h, s, l = (max + min) / 2;
    var d = max - min;

    if (d == 0) {
        h = 0; s = 0;
    } else {
        s = l < 0.5 ? d / (max + min) : d / (2 - max - min);
        if (max == rf) {
            h = (gf - bf) / d + (gf < bf ? 6 : 0);
        } else if (max == gf) {
            h = (bf - rf) / d + 2;
        } else {
            h = (rf - gf) / d + 4;
        }
        h *= 60;
    }
    return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
}

function rgbToHsv(r,g,b){
    var rf = r/255, gf = g/255, bf = b/255;
    var max = Math.max(rf,gf,bf), min = Math.min(rf,gf,bf);
    var d = max - min, h, s, v = max;

    if (max == 0) {
        s = 0; h = 0;
    } else {
        s = d / max;
        if (d == 0) {
            h = 0;
        } else {
            if (max == rf) {
                h = (gf - bf) / d + (gf < bf ? 6 : 0);
            } else if (max == gf) {
                h = (bf - rf) / d + 2;
            } else {
                h = (rf - gf) / d + 4;
            }
            h *= 60;
        }
    }
    return { h: Math.round(h), s: Math.round(s * 100), v: Math.round(v * 100) };
}

/* --- Lecture pixel + loupe --- */
function readPixel(x,y){
    if (!ctx) return;
    if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;

    var d = ctx.getImageData(x,y,1,1).data;
    var r = d[0], g = d[1], b = d[2];

    preview.style.backgroundColor = "rgb(" + r + "," + g + "," + b + ")";

    var hex = rgbToHex(r,g,b);
    var hsl = rgbToHsl(r,g,b);
    var hsv = rgbToHsv(r,g,b);

    hexSpan.innerHTML = hex;
    rgbSpan.innerHTML = "rgb(" + r + "," + g + "," + b + ")";
    hslSpan.innerHTML = "hsl(" + hsl.h + "," + hsl.s + "%," + hsl.l + "%)";
    hsvSpan.innerHTML = "hsv(" + hsv.h + "," + hsv.s + "%," + hsv.v + "%)";
}

function showLoupe(x, y){
    var rect = canvas.getBoundingClientRect();

    var scrollY = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    var scrollX = window.pageXOffset || document.documentElement.scrollLeft || document.body.scrollLeft || 0;

    // Dessin loupe
    lctx.clearRect(0,0,20,20);
    lctx.drawImage(canvas, x-10, y-10, 20, 20, 0, 0, 20, 20);

    var lw = 200;
    var lh = 200;

    // Position horizontale basée sur la position interne
    var lx;
    if (x > canvas.width * 0.75) {
        lx = rect.left + scrollX + x - lw - 40;
    } else {
        lx = rect.left + scrollX + x + 40;
    }

    // Position verticale basée sur la position interne
    var ly;
    if (y > canvas.height * 0.75) {
        ly = rect.top + scrollY + y - lh - 40;
    } else {
        ly = rect.top + scrollY + y + 40;
    }

    loupe.style.left = lx + "px";
    loupe.style.top  = ly + "px";
    loupe.style.display = "block";
}

function hideLoupe(){
    loupe.style.display = "none";
}

function showCross(x, y){
    var rect = canvas.getBoundingClientRect();

    var scrollY = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    var scrollX = window.pageXOffset || document.documentElement.scrollLeft || document.body.scrollLeft || 0;

    cross.style.left = (rect.left + scrollX + x - 18) + "px";
    cross.style.top  = (rect.top  + scrollY + y - 18) + "px";
    cross.style.display = "block";
}

function hideCross(){
    cross.style.display = "none";
}

/* --- Coordonnées souris / touch --- */
function getPos(e){
    var rect = canvas.getBoundingClientRect();
    var x, y;
    if (e.touches && e.touches.length > 0) {
        x = e.touches[0].clientX - rect.left;
        y = e.touches[0].clientY - rect.top;
    } else {
        x = e.clientX - rect.left;
        y = e.clientY - rect.top;
    }
    return { x: Math.floor(x), y: Math.floor(y) };
}

/* --- Events --- */
canvas.onmousemove = function(e){
    var p = getPos(e);
    showLoupe(p.x, p.y);
};

canvas.onmouseleave = function(){
    hideLoupe();
};

canvas.onclick = function(e){
    var p = getPos(e);
    readPixel(p.x, p.y);
    showCross(p.x,p.y);
};

canvas.ontouchstart = function(e){
    var p = getPos(e);
    showLoupe(p.x, p.y);
    readPixel(p.x, p.y);
    showCross(p.x,p.y);
    e.preventDefault();
};

canvas.ontouchmove = function(e){
    var p = getPos(e);
    showLoupe(p.x, p.y);
    readPixel(p.x, p.y);
    showCross(p.x,p.y);
    e.preventDefault();
};

canvas.ontouchend = function(e){
    hideLoupe();
    e.preventDefault();
};

function scrollUp(){
    window.scrollBy(0, -100);
}

function scrollDown(){
    window.scrollBy(0, 100);
}
</script>

</body>
</html>
