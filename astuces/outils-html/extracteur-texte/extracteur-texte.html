<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extracteur texte (OCR)</title>
<style>
/* --- Win98 global look --- */
body {
    font-family: sans-serif;
    font-size: 20px;
    background: #C0C0C0;
    width:1230px;
    padding-top: 20px;
}

/* --- Win98 controls --- */
.win98-box {
    background:#C0C0C0;
    border:2px solid;
    border-color:#FFFFFF #808080 #808080 #FFFFFF;
    padding:10px;
}

button {
    font-family: inherit;
    color: black;
    font-size: 20px;
    padding: 2px 8px;
    border: 2px solid #ffffff;
    border-right-color: #404040;
    border-bottom-color: #404040;
    background: #c0c0c0;
    cursor: pointer;
}
button:active {
    border: 2px solid #404040;
    border-right-color: #ffffff;
    border-bottom-color: #ffffff;
}
button:hover { background:#E0E0E0; }

/* --- Layout --- */
#dropzone {
    border: 2px dashed #808080;
    background: #e0e0e0;
    padding: 10px;
    text-align: center;
    margin-bottom: 8px;
    font-size: 20px;
}
#dropzone.hover {
    border-color: #000080;
    background: #d0e4ff;
}

#canvasWrapper {
    border: 2px inset #ffffff;
    background: #000000;
    padding: 2px;
}

/* canvas full width */
#canvas {
    height: auto;
    display: block;
    background: #000000;
    touch-action: none;
}

#ocrOutput {
    background: #FFF;
    padding: 10px;
    border: 2px solid #888;
    overflow-x: auto;
}

#selectionRect {
    position: absolute;
    border: 2px dashed red;
    pointer-events: none;
    display: none;
}

.toolbar {
  display: block;
  background: #c0c0c0;
  border: 2px solid;
  border-color: #fff #404040 #404040 #fff;
  margin-bottom: 10px;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  overflow-y: auto;
  max-height: 225px;
  padding: 4px;
  z-index: 9999
}

/* --- Mode mobile --- */
@media screen and (max-width: 720px) {
    body, button, #dropzone, #info, input { font-size: 50px; }
    #loupe { width: 240px; height: 240px; }
    #preview { width: 96px; height: 96px; }
}
</style>
</head>
<body>
        <h2>Extracteur texte (OCR)</h2>
<div class="toolbar" style="opacity: 0.8;">
<button onclick="scrollUp()">↑</button>
<button onclick="scrollDown()">↓</button>
<button onclick="runOCR()">Extraire le texte</button>
<button onclick="copyText('ocrOutput', this)">Copier le texte</button>
</div>

        <div class="win98-box">
            <div id="dropzone">Glissez-déposez une image ici ou
                <input type="file" id="fileInput" accept="image/*">
            </div>
            <div id="canvasWrapper">
                <canvas id="canvas" width="1200" height="900"></canvas>
                <div id="selectionRect"></div>
            </div>
        </div>
        
        <div class="win98-box">
            <button onclick="runOCR()">Extraire le texte</button>
            <button onclick="copyText('ocrOutput', this)">Copier le texte</button>
            <pre id="ocrOutput"></pre>
        </div>
<a href="credits.txt" class="btn">À propos de la library / Crédits</a>
<script src="tesseract.min.js"></script>
<script>
/* --- Variables --- */
var dropzone = document.getElementById("dropzone");
var fileInput = document.getElementById("fileInput");
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");
var currentImage = null;
var selecting = false;
var startX = 0, startY = 0;
var currentX = 0, currentY = 0;
var selectionRect = document.getElementById("selectionRect");
var selX = 0, selY = 0, selW = 0, selH = 0;

/* --- Utils --- */
function prevent(e) {
    if (e.preventDefault) e.preventDefault();
    e.returnValue = false;
    return false;
}

/* --- Drag & Drop --- */
dropzone.onclick = function(){ fileInput.click(); };
dropzone.ondragover = function(e){ prevent(e); dropzone.className = "hover"; };
dropzone.ondragenter = function(e){ prevent(e); dropzone.className = "hover"; };
dropzone.ondragleave = function(e){ prevent(e); dropzone.className = ""; };
dropzone.ondrop = function(e){
    prevent(e);
    dropzone.className = "";
    var f = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null;
    if (f) loadFile(f);
};

fileInput.onchange = function(){
    if (fileInput.files && fileInput.files.length > 0) {
        loadFile(fileInput.files[0]);
    }
};

/* --- Chargement image --- */
function loadFile(file){
    if (!/image\//.test(file.type)) {
        alert("Veuillez sélectionner un fichier image.");
        return;
    }
    var reader = new FileReader();
    reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
            currentImage = img;
            drawImageToCanvas(img);
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
}

function drawImageToCanvas(img){
    // largeur affichée réelle du canvas (CSS)
    var displayWidth = canvas.clientWidth;
    if (!displayWidth || displayWidth === 0) {
        // fallback : utiliser largeur fenêtre
        displayWidth = document.documentElement.clientWidth || 400;
    }
    var ratio = img.height / img.width;
    var displayHeight = Math.round(displayWidth * ratio);

    // taille interne du canvas = taille affichée
    canvas.width = displayWidth;
    canvas.height = displayHeight;

    ctx.drawImage(img, 0, 0, displayWidth, displayHeight);
}

/* --- OCR --- */
function runOCR(){
    if (!currentImage) {
        alert("Chargez une image d'abord.");
        return;
    }

    if (selW < 5 || selH < 5) {
        alert("Sélection trop petite.");
        return;
    }

    // Taille max pour accélérer l'OCR
    var maxSize = 1600;
    var scale = Math.min(maxSize / selW, maxSize / selH, 1);

    var newW = Math.floor(selW * scale);
    var newH = Math.floor(selH * scale);

    var temp = document.createElement("canvas");
    temp.width = newW;
    temp.height = newH;
    var tctx = temp.getContext("2d");

    // Redimensionnement
    tctx.drawImage(canvas, selX, selY, selW, selH, 0, 0, newW, newH);

    // Noir & blanc (accélère beaucoup)
    var imgData = tctx.getImageData(0, 0, newW, newH);
    var d = imgData.data;
    for (var i = 0; i < d.length; i += 4) {
        var v = (d[i] + d[i+1] + d[i+2]) / 3;
        var bw = v < 180 ? 0 : 255;
        d[i] = d[i+1] = d[i+2] = bw;
    }
    tctx.putImageData(imgData, 0, 0);

    document.getElementById("ocrOutput").textContent = "Analyse en cours...";

    // Lancer l'OCR dans un timeout pour libérer l'UI
    setTimeout(function(){
        Tesseract.recognize(temp, 'eng')
        .then(function(result){
            document.getElementById("ocrOutput").textContent = result.data.text;
        })
        .catch(function(err){
            document.getElementById("ocrOutput").textContent = "Erreur OCR : " + err;
        });
    }, 50);
}

/* --- Évènements souris --- */
canvas.onmousedown = function(e){
    var rect = canvas.getBoundingClientRect();
    startX = e.pageX - rect.left - window.scrollX;
    startY = e.pageY - rect.top  - window.scrollY;
    selecting = true;

    selX = startX;
    selY = startY;
    selW = 0;
    selH = 0;

    selectionRect.style.left = e.pageX + "px";
    selectionRect.style.top  = e.pageY + "px";
    selectionRect.style.width = "0px";
    selectionRect.style.height = "0px";
    selectionRect.style.display = "block";
};

canvas.onmousemove = function(e){
    if (!selecting) return;

    var rect = canvas.getBoundingClientRect();
    currentX = e.pageX - rect.left - window.scrollX;
    currentY = e.pageY - rect.top  - window.scrollY;

    var x = Math.min(startX, currentX);
    var y = Math.min(startY, currentY);
    var w = Math.abs(startX - currentX);
    var h = Math.abs(startY - currentY);

    selX = x;
    selY = y;
    selW = w;
    selH = h;

    selectionRect.style.left = (rect.left + window.scrollX + x) + "px";
    selectionRect.style.top  = (rect.top  + window.scrollY + y) + "px";
    selectionRect.style.width  = w + "px";
    selectionRect.style.height = h + "px";
};

canvas.onmouseup = function(){
    selecting = false;
};

/* --- Sélection tactile --- */
canvas.ontouchstart = function(e){
    var rect = canvas.getBoundingClientRect();
    var t = e.touches[0];

    startX = t.pageX - rect.left - window.scrollX;
    startY = t.pageY - rect.top  - window.scrollY;
    selecting = true;

    selX = startX;
    selY = startY;
    selW = 0;
    selH = 0;

    selectionRect.style.left = t.pageX + "px";
    selectionRect.style.top  = t.pageY + "px";
    selectionRect.style.width = "0px";
    selectionRect.style.height = "0px";
    selectionRect.style.display = "block";
};

canvas.ontouchmove = function(e){
    if (!selecting) return;

    var rect = canvas.getBoundingClientRect();
    var t = e.touches[0];

    currentX = t.pageX - rect.left - window.scrollX;
    currentY = t.pageY - rect.top  - window.scrollY;

    var x = Math.min(startX, currentX);
    var y = Math.min(startY, currentY);
    var w = Math.abs(startX - currentX);
    var h = Math.abs(startY - currentY);

    selX = x;
    selY = y;
    selW = w;
    selH = h;

    selectionRect.style.left = (rect.left + window.scrollX + x) + "px";
    selectionRect.style.top  = (rect.top  + window.scrollY + y) + "px";
    selectionRect.style.width  = w + "px";
    selectionRect.style.height = h + "px";
};

canvas.ontouchend = function(){
    selecting = false;
};

/* --- Copie avec feedback --- */
function copyText(id, btn){
    var text = document.getElementById(id).textContent;

    var t = document.createElement("textarea");
    t.value = text;
    document.body.appendChild(t);
    t.select();
    document.execCommand("copy");
    document.body.removeChild(t);

    var old = btn.innerHTML;
    btn.innerHTML = "Copié !";
    setTimeout(function(){ btn.innerHTML = old; }, 700);
}

function scrollUp(){
    window.scrollBy(0, -100);
}

function scrollDown(){
    window.scrollBy(0, 100);
}
</script>

</body>
</html>
