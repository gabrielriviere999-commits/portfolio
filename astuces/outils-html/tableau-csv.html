<!DOCTYPE html>
<html lang="fr">

<meta charset="utf-8">

</select>
<input id="tableau_ascii_custom_char" style="display:none;" maxlength="1">
Séparateur : <input id="tableau_ascii_sep" value=";">

<button onclick="resetParams()" class="btn-color" style="background:#ff4444;">Valeurs par défaut</button>
<button onclick="alert('• Séparateur : sépare les données du tableau en entrée.\n• Largeur max : les mots passent à la ligne dans la cellule, laisser vide pour supprimer la limite de largeur.\nNote : Les textes coupés sur plusieurs lignes sont fusionnés avec des espaces alors la conversion n‘est pas totalement réversible.\n\n⚠ Ne pas utiliser le même caractère ni | pour données et bordure verticale lors du passage tableau à CSV.\nUnicode et Box : risque de décalage élevé notamment sur Android.\n\n• Pour un gros fichier, utiliser le bouton d‘importation plutôt que les champs de texte, si le téléchargement auto ne se fait pas, cliquer sur télécharger table.')">?</button>
</div>

<p></p><h3>Tableau</h3>
<textarea wrap="off" id="output"></textarea><br>
<button type="button" onclick="importFromOutput()" class="btn-color" style="background:#ff8800;">Convertir en CSV</button>
<button id="copyoutput" class="btn-color" style="background:#4caf50;">Copier</button>
<input type="file" id="tableFileInput" class="file-input">

<script>
/* --- Compatibilité maximale (ES3) --- */
function setText(el, txt) {
    if (el.value !== undefined) el.value = txt;
    else if (el.textContent !== undefined) el.textContent = txt;
    else el.innerText = txt;
}

function getText(el) {
    if (el.value !== undefined) return el.value;
    return (el.textContent !== undefined) ? el.textContent : el.innerText;
}

function repeat(str, n) {
  var out = "";
  for (var i = 0; i < n; i++) out += str;
  return out;
}

function padRight(str, len) {
  while (str.length < len) str += " ";
  return str;
}

function wrapText(str, max) {
  var words = str.split(" ");
  var lines = [];
  var current = "";

  for (var i = 0; i < words.length; i++) {
    var w = words[i];

    // --- Mot trop long ---
    if (w.length > max) {

      // Si la ligne actuelle contient quelque chose, on la pousse
      if (current.length > 0) {
        lines.push(current);
        current = "";
      }

      // Découpe du mot trop long
      var start = 0;
      while (start < w.length) {
        var chunk = w.substring(start, start + max);
        start += max;

        // La dernière tranche devient la ligne courante
        if (start >= w.length) {
          current = chunk; // ← clé de la correction
        } else {
          lines.push(chunk);
        }
      }

      continue;
    }

    // --- Mot normal ---
    if (current.length === 0) {
      current = w;
    } else if (current.length + 1 + w.length <= max) {
      current += " " + w;
    } else {
      lines.push(current);
      current = w;
    }
  }

  if (current.length > 0) lines.push(current);

  return lines;
}

function asciiTable_generic(rows, MAX_TABLE_WIDTH, style) {
  if (!rows || !rows.length) return "";

  // 1) Nombre de colonnes
  var colCount = 0;
  for (var i = 0; i < rows.length; i++)
    if (rows[i].length > colCount) colCount = rows[i].length;

  // 2) Largeurs naturelles
  var widths = [];
  for (var c = 0; c < colCount; c++) widths[c] = 0;

  for (var r = 0; r < rows.length; r++)
    for (var c = 0; c < colCount; c++) {
      var cell = rows[r][c] || "";
      if (cell.length > widths[c]) widths[c] = cell.length;
    }

  // 3) Largeur totale
  var totalWidth = 1;
  for (var c = 0; c < colCount; c++)
    totalWidth += widths[c] + style.hPadding;

  // 4) Réduction proportionnelle (toujours active)
  if (totalWidth > MAX_TABLE_WIDTH) {
    var espace = MAX_TABLE_WIDTH - (style.hPadding * colCount + 1);
    var sum = 0;
    for (var i = 0; i < widths.length; i++) sum += widths[i];
    for (var i = 0; i < widths.length; i++) {
      widths[i] = Math.floor(widths[i] * espace / sum);
      if (widths[i] < 1) widths[i] = 1;
    }
  }

  var out = "";
  var sepMid = "";

  // 5) Ligne de séparation (haut et milieu)
  sepMid = style.corner;
  for (var c = 0; c < colCount; c++)
    sepMid += repeat(style.hBorder, widths[c] + style.hPadding) + style.corner;

  // Ligne du haut
  var sepTop;
  if (style.firstSep) {
    // Style pointillé : première ligne en "."
    sepTop = repeat(".", sepMid.length);
  } else if (style.hBorderHeader) {
    // Style header : ligne spéciale
    sepTop = style.corner;
    for (var c = 0; c < colCount; c++)
      sepTop += repeat(style.hBorderHeader, widths[c] + style.hPadding) + style.corner;
  } else {
    sepTop = sepMid;
  }

  out += sepTop + "\n";

  // 6) Lignes avec wrap
  for (var r = 0; r < rows.length; r++) {
    var wrappedCells = [];
    var maxHeight = 1;

    for (var c = 0; c < colCount; c++) {
      var cell = rows[r][c] || "";
      var wrapped = wrapText(cell, widths[c]);
      wrappedCells[c] = wrapped;
      if (wrapped.length > maxHeight) maxHeight = wrapped.length;
    }

    for (var h = 0; h < maxHeight; h++) {
      var line = style.vBorder + style.space;

      for (var c = 0; c < colCount; c++) {
        var txt = wrappedCells[c][h] || "";
        line += padRight(txt, widths[c]) + style.space + style.vBorder + style.space;
      }

      line = line.substring(0, line.length - 1);
      out += line + "\n";
    }

    // Ligne de séparation après chaque ligne
    var border = (r === 0 && style.hBorderHeader)
                 ? style.hBorderHeader
                 : style.hBorder;

    var sep = style.corner;
    for (var c = 0; c < colCount; c++)
      sep += repeat(border, widths[c] + style.hPadding) + style.corner;

    out += sep + "\n";
  }

  return out;
}

var style_classic = {
  corner: "+",
  hBorder: "-",
  vBorder: "|",
  hPadding: 2,
  space: " "
};

var style_header = {
  corner: "+",
  hBorder: "-",
  hBorderHeader: "=",
  vBorder: "|",
  hPadding: 2,
  space: " "
};

var style_dotted = {
  corner: ":",
  hBorder: ".",
  vBorder: ":",
  hPadding: 2,
  space: " ",
  firstSep: true
};

var style_custom = {
  corner: "#",
  hBorder: "#",
  vBorder: "#",
  hPadding: 2,
  space: " "
};

var default_custom  = JSON.parse(JSON.stringify(style_custom));

document.getElementById("tableau_ascii_custom_char").oninput = function () {
  var c = this.value;

  // Sauvegarde
  localStorage.setItem("tableau_ascii_custom_char", c);

  if (!c || c.length === 0) {
    // Restaurer les styles d'origine
    style_custom  = JSON.parse(JSON.stringify(default_custom));
    return;
  }

  // Sinon → appliquer le caractère personnalisé
  style_custom.corner = c;
  style_custom.hBorder = c;
  style_custom.vBorder = c;
};

function asciiTable_multi(rows, MAX_TABLE_WIDTH, C) {
  if (!rows || !rows.length) return "";

  var TL=C.TL, TM=C.TM, TR=C.TR;
  var ML=C.ML, MM=C.MM, MR=C.MR;
  var BL=C.BL, BM=C.BM, BR=C.BR;
  var V =C.V;
  var H =C.H;

  // 1) Nombre de colonnes
  var colCount = 0;
  for (var i = 0; i < rows.length; i++)
    if (rows[i].length > colCount) colCount = rows[i].length;

  // 2) Largeurs naturelles
  var widths = [];
  for (var c = 0; c < colCount; c++) widths[c] = 0;

  for (var r = 0; r < rows.length; r++)
    for (var c = 0; c < colCount; c++) {
      var cell = rows[r][c] || "";
      if (cell.length > widths[c]) widths[c] = cell.length;
    }

  // 3) Largeur totale
  var totalWidth = 1;
  for (var c = 0; c < colCount; c++)
    totalWidth += widths[c] + 2;

  // 4) Réduction proportionnelle
  if (totalWidth > MAX_TABLE_WIDTH) {
    var espace = MAX_TABLE_WIDTH - (2 * colCount + 1);
    var sum = 0;
    for (var i = 0; i < widths.length; i++) sum += widths[i];
    for (var i = 0; i < widths.length; i++) {
      widths[i] = Math.floor(widths[i] * espace / sum);
      if (widths[i] < 1) widths[i] = 1;
    }
  }

  function repeat(ch, n) {
    var s = "";
    while (n-- > 0) s += ch;
    return s;
  }

  // 5) Bordure du haut
  var out = TL;
  for (var c = 0; c < colCount; c++) {
    out += repeat(H, widths[c] + 2);
    out += (c < colCount - 1 ? TM : TR);
  }
  out += "\n";

  // 6) Lignes de données + séparateurs intermédiaires
  for (var r = 0; r < rows.length; r++) {

    var wrappedCells = [];
    var maxHeight = 1;

    for (var c = 0; c < colCount; c++) {
      var cell = rows[r][c] || "";
      var wrapped = wrapText(cell, widths[c]);
      wrappedCells[c] = wrapped;
      if (wrapped.length > maxHeight) maxHeight = wrapped.length;
    }

    for (var h = 0; h < maxHeight; h++) {
      var line = V;
      for (var c = 0; c < colCount; c++) {
        var txt = wrappedCells[c][h] || "";
        line += " " + padRight(txt, widths[c]) + " " + V;
      }
      out += line + "\n";
    }

    if (r < rows.length - 1) {
      var mid = ML;
      for (var c = 0; c < colCount; c++) {
        mid += repeat(H, widths[c] + 2);
        mid += (c < colCount - 1 ? MM : MR);
      }
      out += mid + "\n";
    }
  }

  // 7) Bordure du bas
  var bot = BL;
  for (var c = 0; c < colCount; c++) {
    bot += repeat(H, widths[c] + 2);
    bot += (c < colCount - 1 ? BM : BR);
  }
  out += bot + "\n";

  return out;
}

var chars_unicode = {
  TL:"╔", TM:"╦", TR:"╗",
  ML:"╠", MM:"╬", MR:"╣",
  BL:"╚", BM:"╩", BR:"╝",
  V:"║", H:"═"
};
var chars_box = {
  TL:"┌", TM:"┬", TR:"┐",
  ML:"├", MM:"┼", MR:"┤",
  BL:"└", BM:"┴", BR:"┘",
  V:"│", H:"─"
};

/* --- Conversion CSV → ASCII --- */
function convertCore(rows) {
    var sep = document.getElementById("tableau_ascii_sep").value || ";";
    var maxwidth = parseInt(document.getElementById("tableau_ascii_maxwidth").value, 10);
    if (isNaN(maxwidth)) maxwidth = Infinity;

    var model = document.getElementById("ascii_model").value;

    if (model === "classic") return asciiTable_generic(rows, maxwidth, style_classic);
    if (model === "header") return asciiTable_generic(rows, maxwidth, style_header);
    if (model === "dotted") return asciiTable_generic(rows, maxwidth, style_dotted);
    if (model === "custom") return asciiTable_generic(rows, maxwidth, style_custom);
    if (model === "unicode") return asciiTable_multi(rows, maxwidth, chars_unicode);
    if (model === "box") return asciiTable_multi(rows, maxwidth, chars_box);
    if (model === "markdown") return generateMarkdownTable(rows);
    if (model === "html") return tableToHTML(rows);
    if (model === "bbcode") return generateBBCodeTable(rows);
    if (model === "wikitable") return generateWikiTable(rows);
    if (model === "asciidoc") return generateAsciiDoc(rows);
    if (model === "orgmode") return generateOrgMode(rows);
    if (model === "latex") return generateLatexTabular(rows);
    if (model === "json") return generateJSONTable(rows);
    if (model === "yaml") return generateYAMLTable(rows);

    return "";
}

function csvToRows(lignes, sep) {

    // supprimer TOUTES les lignes vides
    lignes = lignes.filter(function (x) { return x.trim() !== ""; });

    var rows = [];

    for (var i = 0; i < lignes.length; i++) {
        var cells = lignes[i].split(sep);

        // nettoyer les espaces autour des cellules
        for (var c = 0; c < cells.length; c++)
            cells[c] = trim(cells[c]);

        // supprimer les colonnes vides à droite
        while (cells.length > 0 && cells[cells.length - 1].trim() === "")
            cells.pop();

        rows.push(cells);
    }

    return rows;
}

function convertir() {
    var texte = document.getElementById("input").value;
    if (!texte) return;

    var sep = document.getElementById("tableau_ascii_sep").value || ";";
    var rows = csvToRows(texte.split("\n"), sep);

    var table = convertCore(rows);
    setText(document.getElementById("output"), table);
}

function convertirSansTextarea(rows) {
    return convertCore(rows);
}

// Importer CSV et téléchargement automatique (sans textarea)
var lastGeneratedTable = "";
document.getElementById("csvFileInput").onchange = function () {
    var file = this.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (e) {
        var texte = e.target.result;

        var sep = document.getElementById("tableau_ascii_sep").value || ";";
        var rows = csvToRows(texte.split("\n"), sep);

        lastGeneratedTable = convertirSansTextarea(rows);
        downloadText(lastGeneratedTable, "table.txt");
    };

    reader.readAsText(file);
};

function downloadText(text, filename) {
    var blob = new Blob([text], { type: "text/plain" });
    var url = URL.createObjectURL(blob);

    // Créer un lien visible
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.textContent = "Télécharger " + filename;

    // Nettoyer le conteneur avant d'ajouter le lien
    var container = document.getElementById("downloadLinkContainer");
    container.innerHTML = "";
    container.appendChild(a);
    a.click(); // télécchargement automatique
}

/* --- Conversion CSV → Markdown --- */
function generateMarkdownTable(rows) {
  var out = "";

  // Header
  out += "|" + rows[0].join("|") + "|\n";

  // Separator
  var sep = [];
  for (var i = 0; i < rows[0].length; i++)
    sep.push("----");
  out += "|" + sep.join("|") + "|\n";

  // Body
  for (var r = 1; r < rows.length; r++)
    out += "|" + rows[r].join("|") + "|\n";

  return out;
}

/* --- Conversion CSV → HTML --- */
function tableToHTML(rows) {
  var out = "<table>\n";

  for (var r = 0; r < rows.length; r++) {
    out += "  <tr>";
    for (var c = 0; c < rows[r].length; c++) {
      out += "<td>" + escapeHTML(rows[r][c]) + "</td>";
    }
    out += "</tr>\n";
  }

  out += "</table>";
  return out;
}

function escapeHTML(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/* --- Conversion CSV → BBCode --- */
function generateBBCodeTable(rows) {
  var out = "[table]\n";
  for (var r = 0; r < rows.length; r++) {
    out += "[tr]";
    for (var c = 0; c < rows[r].length; c++) {
      var tag = (r === 0 ? "th" : "td");
      out += "[" + tag + "]" + rows[r][c] + "[/" + tag + "]";
    }
    out += "[/tr]\n";
  }
  out += "[/table]";
  return out;
}

/* --- Conversion CSV → WikiTable --- */
function generateWikiTable(rows) {
  var out = "{| class=\"wikitable\"\n";

  // Caption optionnelle
  // out += "|+ Generated table\n";

  for (var r = 0; r < rows.length; r++) {
    out += "|-\n";

    var row = rows[r];

    // Header row si première ligne
    if (r === 0) {
      out += "!" + row.join("!!") + "\n";
    } else {
      out += "|" + row.join("||") + "\n";
    }
  }

  out += "|}";
  return out;
}

/* --- Conversion CSV → AsciiDoc --- */
function generateAsciiDoc(rows) {
  var out = "|===\n";

  for (var r = 0; r < rows.length; r++) {
    out += "|" + rows[r].join("|") + "\n";
  }

  out += "|===";
  return out;
}

/* --- Conversion CSV → Org‑mode --- */
function generateOrgMode(rows) {
  var out = "";

  // ligne de header
  out += "|" + rows[0].join("|") + "|\n";

  // ligne de séparation
  out += "|" + rows[0].map(function () { return "---"; }).join("+") + "|\n";

  // lignes de données
  for (var r = 1; r < rows.length; r++) {
    out += "|" + rows[r].join("|") + "|\n";
  }

  return out;
}

/* --- Conversion CSV → LaTeX tabular --- */
function generateLatexTabular(rows) {
  var cols = rows[0].length;
  var spec = new Array(cols + 1).join("c"); // "ccc" etc.

  var out = "\\begin{tabular}{" + spec + "}\n";

  for (var r = 0; r < rows.length; r++) {
    out += rows[r].join(" & ") + " \\\\\n";
  }

  out += "\\end{tabular}";
  return out;
}

/* --- Conversion CSV → JSON et YAML --- */
function generateJSONTable(rows) {
  var out = "[\n";
  for (var r = 0; r < rows.length; r++) {
    out += "  [" + rows[r].map(x => JSON.stringify(x)).join(", ") + "]";
    if (r < rows.length - 1) out += ",";
    out += "\n";
  }
  out += "]";
  return out;
}
function generateYAMLTable(rows) {
  var out = "";
  for (var r = 0; r < rows.length; r++) {
    out += "- [" + rows[r].join(", ") + "]\n";
  }
  return out.trim();
}

/* --- Output → input --- */
function trimRightEmptyCells(rows) {
  for (var r = 0; r < rows.length; r++) {
    while (rows[r].length > 0 && rows[r][rows[r].length - 1] === "") {
      rows[r].pop();
    }
  }
}

function removeEmptyRows(rows) {
    var out = [];

    for (var r = 0; r < rows.length; r++) {
        var row = rows[r];
        var keep = false;

        for (var c = 0; c < row.length; c++) {
            if (trim(row[c]) !== "") {
                keep = true;
                break;
            }
        }

        if (keep) out.push(row);
    }

    return out;
}

function tableToCSV(rows) {
    trimRightEmptyCells(rows);
    rows = removeEmptyRows(rows);

    var sep = document.getElementById("tableau_ascii_sep").value || ";";
    var csv = "";

    for (var r = 0; r < rows.length; r++) {
        if (r > 0) csv += "\n";
        csv += rows[r].join(sep);
    }

    return csv;
}

function importFromOutput() {
    var out = document.getElementById("output").value;
    var rows;

    if (out.indexOf("{|") !== -1 && out.indexOf("|}") !== -1) {
        rows = parseWikiTable(out);
    } else {
        rows = parseAnyTable(out);
    }

    var csv = tableToCSV(rows);
    document.getElementById("input").value = csv;
}

var lastGeneratedCSV = "";
document.getElementById("tableFileInput").onchange = function () {
    var file = this.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (e) {
        var texte = e.target.result;

        var rows;

        if (texte.indexOf("{|") !== -1 && texte.indexOf("|}") !== -1) {
            rows = parseWikiTable(texte);
        } else {
            rows = parseAnyTable(texte);
        }

        lastGeneratedCSV = tableToCSV(rows);

        // Téléchargement automatique (bloqué sur Samsung Internet)
        downloadText(lastGeneratedCSV, "table.csv");
    };

    reader.readAsText(file);
};

function parseAnyTable(text) {
  text = String(text);

  // HTML
  if (text.indexOf("<table") !== -1)
    return parseHTMLTable(text);

  // BBCode
  if (text.indexOf("[table]") !== -1)
    return parseBBCodeTable(text);

  // AsciiDoc
  if (text.indexOf("|===") !== -1)
    return parseAsciiDoc(text);

  // Org-mode
  if (text.trim().startsWith("|") && text.indexOf("|---") !== -1)
    return parseOrgMode(text);

  // LaTeX tabular
  if (text.indexOf("\\begin{tabular}") !== -1)
    return parseLatexTabular(text);

  // JSON array
  if (text.trim().startsWith("[") && text.trim().endsWith("]"))
    return parseJSONTable(text);

  // YAML list
  if (text.trim().startsWith("- "))
    return parseYAMLTable(text);

  // Markdown
  if (text.indexOf("|") !== -1 && text.indexOf("+") === -1)
    return parsePipeTable(text);

  // ASCII
  return parseAsciiTable(text);
}

function parseAsciiTable(text) {
  var lines = text.split(/\r?\n/);
  var rows = [];
  var currentRow = null;

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];

    if (!line || line.length === 0) continue;

    var first = line.charAt(0);

    // On ne traite que les lignes qui commencent par un symbole non alphanumérique
    if (/^[^A-Za-z0-9]/.test(first)) {

      // LIGNE DE BORDURE : aucun caractère alphanumérique dans la ligne
      if (!/[A-Za-z0-9]/.test(line)) {
        if (currentRow) {
          rows.push(currentRow);
          currentRow = null;
        }
        continue;
      }

      // LIGNE DE DONNÉES : même symbole utilisé comme séparateur
      var parts = line.split(first);
      var cells = [];

      // on ignore le premier et le dernier (vides)
      for (var p = 1; p < parts.length - 1; p++) {
        cells.push(trim(parts[p]));
      }

      if (!currentRow) {
        currentRow = cells;
      } else {
        // concat multi-lignes
        for (var c = 0; c < cells.length; c++) {
          if (cells[c].length > 0) {
            currentRow[c] += " " + cells[c];
          }
        }
      }
    }
  }

  // Dernière ligne si pas suivie de bordure
  if (currentRow) rows.push(currentRow);

  return rows;
}

function trim(str) {
  return String(str).replace(/^\s+/, "").replace(/\s+$/, "");
}

function parsePipeTable(text) {
  var lines = text.split(/\r?\n/);
  var rows = [];

  for (var i = 0; i < lines.length; i++) {
    var line = trim(lines[i]);

    // ignorer les lignes de séparation markdown
    if (/^[:\-|\s]+$/.test(line)) continue;

    if (line.indexOf("|") !== -1) {
      var parts = line.split("|");

      // enlever les bordures Markdown vides
      if (parts.length && trim(parts[0]) === "")
        parts.shift();
      if (parts.length && trim(parts[parts.length - 1]) === "")
        parts.pop();

      var cells = [];
      for (var p = 0; p < parts.length; p++) {
        var t = trim(parts[p]);
        cells.push(t);
      }

      rows.push(cells);
    }
  }

  return rows;
}

function parseHTMLTable(text) {
  var rows = [];
  var lines = text.split(/\r?\n/);

  for (var i = 0; i < lines.length; i++) {
    var line = trim(lines[i]);

    // détecter une ligne <tr>
    if (line.indexOf("<tr") !== -1) {
      var cells = [];
      var pos = 0;

      while (true) {
        // trouver <td
        var tdStart = line.indexOf("<td", pos);
        if (tdStart === -1) break;

        // trouver >
        var contentStart = line.indexOf(">", tdStart);
        if (contentStart === -1) break;

        // trouver </td>
        var tdEnd = line.indexOf("</td>", contentStart);
        if (tdEnd === -1) break;

        // extraire contenu
        var cell = line.substring(contentStart + 1, tdEnd);
        cells.push(cell);

        pos = tdEnd + 5; // avancer après </td>
      }

      if (cells.length > 0) rows.push(cells);
    }
  }

  return rows;
}

function parseBBCodeTable(text) {
  var rows = [];
  var inside = false;
  var current = null;
  var lines = text.split(/\r?\n/);

  for (var i = 0; i < lines.length; i++) {
    var line = trim(lines[i]);

    if (line === "[table]") {
      inside = true;
      continue;
    }
    if (line === "[/table]") {
      inside = false;
      continue;
    }
    if (!inside) continue;

    // Cas 1 : [tr] seul sur la ligne
    if (line === "[tr]") {
      current = [];
      continue;
    }

    // Cas 2 : ligne compacte [tr]...[/tr]
    if (line.indexOf("[tr]") !== -1 && line.indexOf("[/tr]") !== -1) {
      current = [];
      var content = line.replace("[tr]", "").replace("[/tr]", "");
      var parts = content.split(/\[td\]|\[th\]/);
      for (var p = 1; p < parts.length; p++) {
        var cell = parts[p].replace(/\[\/td\]|\[\/th\]/, "");
        current.push(trim(cell));
      }
      rows.push(current);
      current = null;
      continue;
    }

    if (line === "[/tr]") {
      if (current) rows.push(current);
      current = null;
      continue;
    }

    if (line.startsWith("[td]") || line.startsWith("[th]")) {
      var cell = line.replace(/\[td\]|\[th\]/, "")
                     .replace(/\[\/td\]|\[\/th\]/, "");
      current.push(trim(cell));
    }
  }

  return rows;
}

function parseWikiTable(text) {
  var lines = text.split(/\r?\n/);
  var rows = [];
  var current = [];

  for (var i = 0; i < lines.length; i++) {
    var line = trim(lines[i]);

    if (line.startsWith("{|")) continue;
    if (line.startsWith("|}")) continue;
    if (line.startsWith("|+")) continue; // caption ignorée

    if (line === "|-") {
      if (current.length > 0) {
        rows.push(current);
        current = [];
      }
      continue;
    }

    // Header cells
    if (line.startsWith("!")) {
      var parts = line.substring(1).split("!!");
      for (var p = 0; p < parts.length; p++)
        current.push(trim(parts[p]));
      continue;
    }

    // Normal cells
    if (line.startsWith("|")) {
      var parts = line.substring(1).split("||");
      for (var p = 0; p < parts.length; p++)
        current.push(trim(parts[p]));
      continue;
    }
  }

  if (current.length > 0) rows.push(current);

  return rows;
}

function parseAsciiDoc(text) {
  var lines = text.split(/\r?\n/);
  var rows = [];
  var inside = false;

  for (var i = 0; i < lines.length; i++) {
    var line = trim(lines[i]);

    if (/^\|=+$/.test(line)) {
      inside = !inside;
      continue;
    }

    if (!inside) continue;
    if (!line.startsWith("|")) continue;

    var parts = line.substring(1).split("|");
    var cells = [];

    for (var p = 0; p < parts.length; p++)
      cells.push(trim(parts[p]));

    rows.push(cells);
  }

  return rows;
}

function parseOrgMode(text) {
  var lines = text.split(/\r?\n/);
  var rows = [];

  for (var i = 0; i < lines.length; i++) {
    var line = trim(lines[i]);

    if (!line.startsWith("|")) continue;
    if (line.indexOf("---") !== -1) continue; // ligne de séparation

    var parts = line.split("|");
    var cells = [];

    for (var p = 1; p < parts.length - 1; p++)
      cells.push(trim(parts[p]));

    rows.push(cells);
  }

  return rows;
}

function parseLatexTabular(text) {
  var lines = text.split(/\r?\n/);
  var rows = [];
  var inside = false;

  for (var i = 0; i < lines.length; i++) {
    var line = trim(lines[i]);

    if (line.startsWith("\\begin{tabular")) {
      inside = true;
      continue;
    }
    if (line.startsWith("\\end{tabular")) {
      inside = false;
      continue;
    }
    if (!inside) continue;

    if (line.indexOf("&") !== -1) {
      var parts = line.split("&");
      var cells = [];

      for (var p = 0; p < parts.length; p++)
        cells.push(trim(parts[p].replace(/\\\\$/, "")));

      rows.push(cells);
    }
  }

  return rows;
}

function parseJSONTable(text) {
  try {
    var arr = JSON.parse(text);
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return [];
  }
}
function parseYAMLTable(text) {
  var lines = text.split(/\r?\n/);
  var rows = [];

  for (var line of lines) {
    line = line.trim();
    if (!line.startsWith("-")) continue;

    var inside = line.replace(/^- */, "").trim();
    inside = inside.replace(/^\[/, "").replace(/\]$/, "");

    var parts = inside.split(",");
    var cells = parts.map(x => x.trim());
    rows.push(cells);
  }

  return rows;
}

/* --- Bouton copier --- */
function copyFrom(id, btn) {
    var code = document.getElementById(id);

    var temp = document.createElement("textarea");
    temp.value = code.value;
    document.body.appendChild(temp);
    temp.select();

    try { document.execCommand("copy"); } catch (err) {}

    document.body.removeChild(temp);
    btn.focus();
}
document.getElementById('copyinput').onclick = function(e) {
    copyFrom('input', e.target);
};
document.getElementById('copyoutput').onclick = function(e) {
    copyFrom('output', e.target);
};

/* --- Glisser-déposer ---*/
function setupDragDrop(textareaId) {

    var area = document.getElementById(textareaId);

    // --- Drag & Drop ---
    area.addEventListener("dragover", function(e) {
        if (e.dataTransfer.types &&
            (e.dataTransfer.types.indexOf("Files") !== -1 ||
             e.dataTransfer.types.indexOf("application/x-moz-file") !== -1)) {

            e.preventDefault(); // autorise le drop fichier
        }
    });

    area.addEventListener("drop", function(e) {
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            e.preventDefault();

            var f = e.dataTransfer.files[0];
            var reader = new FileReader();

            reader.onload = function(ev) {
                area.value = ev.target.result;
            };

            reader.readAsText(f);
            return;
        }
        // Sinon → laisser le navigateur coller du texte
    });
}
setupDragDrop("input");
setupDragDrop("output");

// Bouton Effacer tout
function effacerTout() {
  document.getElementById("input").value = "";
  setText(document.getElementById("output"), "");
}

function resetParams() {
  document.getElementById("tableau_ascii_sep").value = ";";
  document.getElementById("tableau_ascii_maxwidth").value = "120";
  document.getElementById("ascii_model").value = "classic";

  var custom = document.getElementById("tableau_ascii_custom_char");
  custom.value = "";
  custom.oninput();

  // Met à jour la sauvegarde
  localStorage.setItem("tableau_ascii_sep", ";");
  localStorage.setItem("tableau_ascii_maxwidth", "120");
  localStorage.setItem("tableau_ascii_model", "classic");
  localStorage.removeItem("tableau_ascii_custom_char");

  updateOptionsVisibility();
}

function updateOptionsVisibility() {
  var model = document.getElementById("ascii_model").value;

  // Caractère personnalisé
  document.getElementById("tableau_ascii_custom_char").style.display =
    (model === "custom") ? "" : "none";

  // Largeur max
  var noWidth = ["markdown", "html", "bbcode", "wikitable", "asciidoc", "orgmode", "latex", "json", "yaml"];
  document.getElementById("maxWidthContainer").style.display = (noWidth.indexOf(model) !== -1) ? "none" : "";
}
/* --- Sauvegarde/Restauration --- */
function saveState() {
  localStorage.setItem("tableau_ascii_sep", document.getElementById("tableau_ascii_sep").value);
  localStorage.setItem("tableau_ascii_maxwidth", document.getElementById("tableau_ascii_maxwidth").value);
}

document.getElementById("tableau_ascii_sep").oninput = saveState;
document.getElementById("tableau_ascii_maxwidth").oninput = saveState;
document.getElementById("ascii_model").onchange = function () {
  localStorage.setItem("tableau_ascii_model", this.value);
  updateOptionsVisibility();
};

window.onload = function() {
  var savedtableau_ascii_sep = localStorage.getItem("tableau_ascii_sep");
  var savedMax = localStorage.getItem("tableau_ascii_maxwidth");
  var savedModel = localStorage.getItem("tableau_ascii_model");
  var savedChar = localStorage.getItem("tableau_ascii_custom_char");

  if (savedtableau_ascii_sep !== null) document.getElementById("tableau_ascii_sep").value = savedtableau_ascii_sep;
  if (savedMax !== null) document.getElementById("tableau_ascii_maxwidth").value = savedMax;
  if (savedModel !== null) {
    document.getElementById("ascii_model").value = savedModel;
  }
  updateOptionsVisibility();
  if (savedChar !== null) {
    var custom = document.getElementById("tableau_ascii_custom_char");
    custom.value = savedChar;
    custom.oninput();
  }
};
</script>
