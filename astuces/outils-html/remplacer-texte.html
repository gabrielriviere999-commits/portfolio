<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remplacer texte</title>
<style>
body { background-color:#c0c0c0; }
h2, h3 { margin-top: 0; }
.card {
  background: #c0c0c0;
  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;
  padding: 10px;
}
textarea { width:100%; height:200px; box-sizing:border-box; font-family:monospace; }
button {
  color:black;
  border:2px solid;
  border-color:#fff #404040 #404040 #fff;
  padding:4px 8px;
  margin-top:10px;
  font-size:12px;
  cursor:pointer;
}
button:active {
  border-color:#404040 #fff #fff #404040;
}
button:hover { filter: brightness(1.2) }
input, textarea {
  border:2px solid;
  border-color:#808080 #ffffff #ffffff #808080;
}
fieldset { border: 2px groove #fff; }
hr {
  border: 0;
  border-top: 1px solid #808080;
  border-bottom: 1px solid #fff;
  margin: 8px 0;
}
label { display:inline-block; white-space:nowrap; margin-right:10px; vertical-align:middle; }
</style>
</head>
<body>

<h2>Remplacer texte</h2>

<div class="card">
<fieldset>
<legend>Options</legend>
<label><input type="checkbox" id="chk_min">minuscule</label>
<label><input type="checkbox" id="chk_maj">MAJUSCULE</label>
<label><input type="checkbox" id="chk_inv">iNVERSER CASSE</label>
<br>
<label><input type="checkbox" id="chk_acc">Sans accents</label>
<label><input type="checkbox" id="chk_spc">Nettoyer espaces</label>
<label><input type="checkbox" id="chk_quo">Guillemets → "</label>
<label><input type="checkbox" id="chk_squo">Demi-guillemets → '</label>
<br>
<button onclick="toutDecocher()" style="background-color:#ff4444;">Tout décocher</button>
<br>
<hr>
<label>Ajouter en début de ligne :</label>
<input id="addPrefix" type="text" placeholder="ex:    ou >> ou - ">
<br>
<label>Ajouter en fin de ligne :</label>
<input id="addSuffix" type="text" placeholder="ex: ; ou , ou // fin">
<br>
<label>Supprimer en début de ligne :</label>
<input id="removePrefix" type="text" placeholder="ex:    ou >> ou - ">
<br>
<label>Supprimer en fin de ligne :</label>
<input id="removeSuffix" type="text" placeholder="ex: ; ou , ou // fin">
<hr>
<div id="repl_container"></div>
<button onclick="ajouterRemplacement()" style="background-color:#dddddd;">Ajouter un remplacement</button>
<label><input type="checkbox" id="repl_ignore_case">Ignorer casse</label>
<hr>
<button onclick="appliquerTransformations()" style="background-color:#ff8800;">Appliquer</button>
<button onclick="copier()" style="background-color:#4caf50;">Copier</button>
<button onclick="effacerTout()" style="background-color:#ff4444;">Effacer tout</button>
<button id="importFileBtn" style="background-color:#d4d0c8;">Importer fichier…</button>
</fieldset>
</div>

<div class="card">
<h3>Source</h3>
<textarea id="input" wrap="off"></textarea>
</div>

<div class="card">
<h3>Résultat</h3>
<input type="file" id="fileInput" style="display:none;">
<textarea id="output" wrap="off" readonly></textarea>
<div id="stats" style="font-family:monospace;">Caractères : 0, Mots : 0, Lignes : 0</div>
</div>

<script>
// ------------------------------
// Compatibilité maximale (ES3)
// ------------------------------

function setText(el, txt) {
    if (el.textContent !== undefined) el.textContent = txt;
    else el.innerText = txt; // IE6/IE7
}

function getText(el) {
    return (el.textContent !== undefined) ? el.textContent : el.innerText;
}

function applyPrefix(text, prefix) {
    if (!prefix) return text;

    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
        if (lines[i].trim() !== "") {
            lines[i] = prefix + lines[i];
        }
    }
    return lines.join("\n");
}

function applySuffix(text, suffix) {
    if (!suffix) return text;

    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
        if (lines[i].trim() !== "") {
            lines[i] = lines[i] + suffix;
        }
    }
    return lines.join("\n");
}

function removePrefix(text, prefix) {
    if (!prefix) return text;

    var lines = text.split(/\r?\n/);
    var L = prefix.length;

    for (var i = 0; i < lines.length; i++) {
        if (lines[i].indexOf(prefix) === 0) {
            lines[i] = lines[i].substring(L);
        }
    }
    return lines.join("\n");
}

function removeSuffix(text, suffix) {
    if (!suffix) return text;

    var lines = text.split(/\r?\n/);
    var L = suffix.length;

    for (var i = 0; i < lines.length; i++) {
        if (lines[i].length >= L &&
            lines[i].substring(lines[i].length - L) === suffix) {
            lines[i] = lines[i].substring(0, lines[i].length - L);
        }
    }
    return lines.join("\n");
}

function updateStats(text) {
    var chars = text.length;

    // Compter les mots (séparés par espaces, tab, retours ligne)
    var trimmed = text.replace(/\s+/g, " ").trim();
    var words = trimmed === "" ? 0 : trimmed.split(" ").length;

    // Compter les lignes
    var lines = text === "" ? 0 : text.split(/\r?\n/).length;

    document.getElementById("stats").innerHTML =
        "Caractères : " + chars +
        ", Mots : " + words +
        ", Lignes : " + lines;
}

function appliquerTransformations() {
  var txt = document.getElementById("input").value;

  // 1) minuscule
  if (document.getElementById("chk_min").checked) {
    txt = txt.toLowerCase();
  }

  // 2) majuscule
  if (document.getElementById("chk_maj").checked) {
    txt = txt.toUpperCase();
  }

  // 3) inverser casse
  if (document.getElementById("chk_inv").checked) {
    var out = "";
    for (var i = 0; i < txt.length; i++) {
      var c = txt.charAt(i);
      var lower = c.toLowerCase();
      var upper = c.toUpperCase();
      out += (c === lower) ? upper : lower;
    }
    txt = out;
  }

  // 4) sans accents
  if (document.getElementById("chk_acc").checked) {
    txt = sansAccents(txt);
  }

  // 5) nettoyer espaces
  if (document.getElementById("chk_spc").checked) {
    // tabulations → _
    txt = txt.replace(/\t/g, "_");
    // espaces multiples → un seul espace
    txt = txt.replace(/ +/g, " ");
    // espace simple → _
    txt = txt.replace(/ /g, "_");
  }

  // 6) convertir guillemets typographiques → "
  if (document.getElementById("chk_quo").checked) {
    txt = txt.replace(/[«»“”„‟❝❞⹂〝〞〟＂『』「」]/g, '"');
  }

  // 7) convertir demi-guillemets typographiques → '
  if (document.getElementById("chk_squo").checked) {
    txt = txt.replace(/[‘’‚‛`]/g, "'");
  }

  // 8) remplacements personnalksés
  txt = appliquerRemplacementsPersonnalises(txt);

  // 9) Préfixe
  var prefix = document.getElementById("addPrefix").value;
  txt = applyPrefix(txt, prefix);
  var prefix = document.getElementById("removePrefix").value;
  txt = removePrefix(txt, prefix);

  // 10) Suffixe
  var suffix = document.getElementById("addSuffix").value;
  txt = applySuffix(txt, suffix);
  var suffix = document.getElementById("removeSuffix").value;
  txt = removeSuffix(txt, suffix);

  // 11) mettre a jour les stats
  updateStats(txt);

  // 12) afficher résultat
  setText(document.getElementById("output"), txt);
}

function exclusiviteCasse(chk) {
  if (chk === "min") {
    document.getElementById("chk_maj").checked = false;
    document.getElementById("chk_inv").checked = false;
  }
  if (chk === "maj") {
    document.getElementById("chk_min").checked = false;
    document.getElementById("chk_inv").checked = false;
  }
  if (chk === "inv") {
    document.getElementById("chk_min").checked = false;
    document.getElementById("chk_maj").checked = false;
  }
  saveChecks();
}

function toutDecocher() {
  document.getElementById("chk_min").checked = false;
  document.getElementById("chk_maj").checked = false;
  document.getElementById("chk_inv").checked = false;
  document.getElementById("chk_acc").checked = false;
  document.getElementById("chk_spc").checked = false;
  document.getElementById("chk_quo").checked = false;
  document.getElementById("chk_squo").checked = false;
  saveChecks();
}

function sansAccents(str) {
  // Table complète pan‑européenne
  var map = {
    // Français
    'à':'a','á':'a','â':'a','ã':'a','ä':'a','å':'a',
    'ç':'c',
    'è':'e','é':'e','ê':'e','ë':'e',
    'ì':'i','í':'i','î':'i','ï':'i',
    'ò':'o','ó':'o','ô':'o','õ':'o','ö':'o',
    'ù':'u','ú':'u','û':'u','ü':'u',
    'ÿ':'y','ý':'y',
    'À':'A','Á':'A','Â':'A','Ã':'A','Ä':'A','Å':'A',
    'Ç':'C',
    'È':'E','É':'E','Ê':'E','Ë':'E',
    'Ì':'I','Í':'I','Î':'I','Ï':'I',
    'Ò':'O','Ó':'O','Ô':'O','Õ':'O','Ö':'O',
    'Ù':'U','Ú':'U','Û':'U','Ü':'U',
    'Ý':'Y',
    'œ':'oe','Œ':'OE',

    // Scandinave
    'ø':'o','Ø':'O',
    'æ':'ae','Æ':'AE',

    // Allemand
    'ß':'ss',

    // Turc
    'ğ':'g','Ğ':'G',
    'ş':'s','Ş':'S',
    'ı':'i','İ':'I',

    // Roumain
    'ă':'a','Ă':'A',
    'ș':'s','Ș':'S',
    'ț':'t','Ț':'T',

    // Polonais
    'ą':'a','Ą':'A',
    'ć':'c','Ć':'C',
    'ę':'e','Ę':'E',
    'ł':'l','Ł':'L',
    'ń':'n','Ń':'N',
    'ś':'s','Ś':'S',
    'ź':'z','Ź':'Z',
    'ż':'z','Ż':'Z',

    // Tchèque / Slovaque
    'č':'c','Č':'C',
    'ď':'d','Ď':'D',
    'ě':'e','Ě':'E',
    'ň':'n','Ň':'N',
    'ř':'r','Ř':'R',
    'š':'s','Š':'S',
    'ť':'t','Ť':'T',
    'ž':'z','Ž':'Z',

    // Croate / Slovène / Serbe latin
    'đ':'d','Đ':'D',

    // Hongrois
    'ő':'o','Ő':'O',
    'ű':'u','Ű':'U',

    // Baltes
    'ū':'u','Ū':'U',
    'ī':'i','Ī':'I',
    'ļ':'l','Ļ':'L',
    'ķ':'k','Ķ':'K',
    'ģ':'g','Ģ':'G'
  };

  // 1) Remplacer les lettres précomposées
  var out = "";
  for (var i = 0; i < str.length; i++) {
    var ch = str.charAt(i);
    out += map[ch] || ch;
  }

  // 2) Supprimer les accents combinés (compatibilité totale)
  // couvre : Ő, Š, Ž, Ț, Ğ, etc. même en version combinée
  out = out.replace(/[\u0300-\u036f]/g, "");

  return out;
}

// Bouton copier
function copier() {
  var btn = event.target;
  var texte = document.getElementById("output").textContent;

  var temp = document.createElement("textarea");
  temp.value = texte;
  document.body.appendChild(temp);
  temp.select();

  try { document.execCommand("copy"); } catch (e) {}

  document.body.removeChild(temp);
  btn.focus();
}

// Bouton Effacer tout
function effacerTout() {
  document.getElementById("input").value = "";
  setText(document.getElementById("output"), "");
  updateStats("");
  
  document.getElementById("repl_container").innerHTML = "";
  localStorage.removeItem("repl_list");

  document.getElementById("repl_ignore_case").checked = false;
  localStorage.removeItem("repl_ignore_case");

  document.getElementById("addPrefix").value = "";
  localStorage.removeItem("add_prefix_value");

  document.getElementById("addSuffix").value = "";
  localStorage.removeItem("add_suffix_value");

  document.getElementById("removePrefix").value = "";
  localStorage.removeItem("remove_prefix_value");

  document.getElementById("removeSuffix").value = "";
  localStorage.removeItem("remove_suffix_value");
}

// Glisser-déposer
var input = document.getElementById("input");

input.addEventListener("dragover", function(e) {

    // Si un fichier est glissé → empêcher le comportement natif
    if (e.dataTransfer.types &&
        (e.dataTransfer.types.indexOf("Files") !== -1 ||
         e.dataTransfer.types.indexOf("application/x-moz-file") !== -1)) {

        e.preventDefault(); // autorise le drop fichier
    }

    // Sinon → NE RIEN FAIRE
    // Le navigateur affiche le curseur d’insertion
});

input.addEventListener("drop", function(e) {

    // Si fichier → on gère nous-même
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        e.preventDefault();

        var file = e.dataTransfer.files[0];
        var reader = new FileReader();

        reader.onload = function(ev) {
            // On met le fichier brut dans la zone
            input.value = ev.target.result;
        };

        reader.readAsText(file);
        return;
    }

    // Sinon → laisser le navigateur coller le texte
});

// Bouton Importer fichier…
document.getElementById("importFileBtn").onclick = function () {
    document.getElementById("fileInput").click();
};

document.getElementById("fileInput").addEventListener("change", function () {
    var file = this.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (e) {
        document.getElementById("input").value = e.target.result;
    };
    reader.readAsText(file);
});

// ------------------------------
// Sauvegarde / Restauration
// ------------------------------

function saveChecks() {
  localStorage.setItem("chk_min", document.getElementById("chk_min").checked ? "1" : "0");
  localStorage.setItem("chk_maj", document.getElementById("chk_maj").checked ? "1" : "0");
  localStorage.setItem("chk_inv", document.getElementById("chk_inv").checked ? "1" : "0");
  localStorage.setItem("chk_acc", document.getElementById("chk_acc").checked ? "1" : "0");
  localStorage.setItem("chk_spc", document.getElementById("chk_spc").checked ? "1" : "0");
  localStorage.setItem("chk_quo", document.getElementById("chk_quo").checked ? "1" : "0");
  localStorage.setItem("chk_squo", document.getElementById("chk_squo").checked ? "1" : "0");
}

document.getElementById("chk_min").onchange = function() {
  exclusiviteCasse("min");
  saveChecks();
};

document.getElementById("chk_maj").onchange = function() {
  exclusiviteCasse("maj");
  saveChecks();
};

document.getElementById("chk_inv").onchange = function() {
  exclusiviteCasse("inv");
  saveChecks();
};

document.getElementById("addPrefix").oninput = function () {
  localStorage.setItem("add_prefix_value", document.getElementById("addPrefix").value);
};

document.getElementById("addSuffix").oninput = function () {
  localStorage.setItem("add_suffix_value", document.getElementById("addSuffix").value);
};

document.getElementById("removePrefix").oninput = function () {
  localStorage.setItem("remove_prefix_value", document.getElementById("removePrefix").value);
};

document.getElementById("removeSuffix").oninput = function () {
  localStorage.setItem("remove_suffix_value", document.getElementById("removeSuffix").value);
};

document.getElementById("chk_acc").onchange = saveChecks;
document.getElementById("chk_spc").onchange = saveChecks;
document.getElementById("chk_quo").onchange = saveChecks;
document.getElementById("chk_squo").onchange = saveChecks;

window.onload = function() {
  var cmin = localStorage.getItem("chk_min");
  var cmaj = localStorage.getItem("chk_maj");
  var cinv = localStorage.getItem("chk_inv");
  var cacc = localStorage.getItem("chk_acc");
  var cspc = localStorage.getItem("chk_spc");
  var cquo = localStorage.getItem("chk_quo");
  var csquo = localStorage.getItem("chk_squo");

  if (cmin !== null) document.getElementById("chk_min").checked = (cmin === "1");
  if (cmaj !== null) document.getElementById("chk_maj").checked = (cmaj === "1");
  if (cinv !== null) document.getElementById("chk_inv").checked = (cinv === "1");
  if (cacc !== null) document.getElementById("chk_acc").checked = (cacc === "1");
  if (cspc !== null) document.getElementById("chk_spc").checked = (cspc === "1");
  if (cquo !== null) document.getElementById("chk_quo").checked = (cquo === "1");
  if (csquo !== null) document.getElementById("chk_squo").checked = (csquo === "1");

  var savedPrefix = localStorage.getItem("add_prefix_value");
  if (savedPrefix !== null) {
    document.getElementById("addPrefix").value = savedPrefix;
  }

  var savedSuffix = localStorage.getItem("add_suffix_value");
  if (savedSuffix !== null) {
    document.getElementById("addSuffix").value = savedSuffix;
  }

  var savedPrefix = localStorage.getItem("remove_prefix_value");
  if (savedPrefix !== null) {
    document.getElementById("removePrefix").value = savedPrefix;
  }

  var savedSuffix = localStorage.getItem("remove_suffix_value");
  if (savedSuffix !== null) {
    document.getElementById("removeSuffix").value = savedSuffix;
  }

  chargerReplacements();
  document.getElementById("repl_ignore_case").onchange = saveReplacements;
};

/* ============================================================
   Remplacements personnalisés avec déplacement ↑ ↓
   ============================================================ */

function ajouterRemplacement(from, to) {
  var cont = document.getElementById("repl_container");

  var div = document.createElement("div");
  div.style.marginBottom = "4px";

  // Bouton monter
  var up = document.createElement("button");
  up.textContent = "↑";
  up.onclick = function () {
    var prev = div.previousSibling;
    if (prev) {
      cont.insertBefore(div, prev);
      saveReplacements();
    }
  };

  // Bouton descendre
  var down = document.createElement("button");
  down.textContent = "↓";
  down.onclick = function () {
    var next = div.nextSibling;
    if (next) {
      cont.insertBefore(next, div);
      saveReplacements();
    }
  };

  // Bouton supprimer
  var del = document.createElement("button");
  del.textContent = "X";
  del.onclick = function () {
    cont.removeChild(div);
    saveReplacements();
  };

  // Champ "chercher"
  var inp1 = document.createElement("input");
  inp1.type = "text";
  inp1.setAttribute("data-type", "from");
  inp1.value = from || "";
  inp1.placeholder = "chercher";
  inp1.oninput = saveReplacements;

  // Champ "remplacer"
  var inp2 = document.createElement("input");
  inp2.type = "text";
  inp2.setAttribute("data-type", "to");
  inp2.value = to || "";
  inp2.placeholder = "remplacer";
  inp2.oninput = saveReplacements;

  // Construction de la ligne
  div.appendChild(up);
  div.appendChild(down);
  div.appendChild(del);
  div.appendChild(document.createTextNode(" "));
  div.appendChild(inp1);
  div.appendChild(document.createTextNode(" → "));
  div.appendChild(inp2);

  cont.appendChild(div);

  saveReplacements();
}

function saveReplacements() {
  var cont = document.getElementById("repl_container");
  var list = [];

  for (var i = 0; i < cont.children.length; i++) {
    var div = cont.children[i];
    var inputs = div.getElementsByTagName("input");

    var from = "";
    var to = "";

    for (var j = 0; j < inputs.length; j++) {
      var t = inputs[j].getAttribute("data-type");
      if (t === "from") from = inputs[j].value;
      if (t === "to")   to   = inputs[j].value;
    }

    list.push({from: from, to: to});
  }

  // Sauvegarde des règles
  localStorage.setItem("repl_list", JSON.stringify(list));

  // Sauvegarde de la case "ignorer la casse"
  var ignore = document.getElementById("repl_ignore_case").checked;
  localStorage.setItem("repl_ignore_case", ignore ? "1" : "0");
}

function chargerReplacements() {

  // 1) Restaurer la case AVANT tout
  var ic = localStorage.getItem("repl_ignore_case");
  if (ic === "1") document.getElementById("repl_ignore_case").checked = true;

  // 2) Charger les règles APRÈS
  var saved = localStorage.getItem("repl_list");
  if (saved) {
    var arr = JSON.parse(saved);
    for (var i = 0; i < arr.length; i++) {
      ajouterRemplacement(arr[i].from, arr[i].to);
    }
  }
}

function appliquerRemplacementsPersonnalises(txt) {
  var cont = document.getElementById("repl_container");
  var ignore = document.getElementById("repl_ignore_case").checked;

  for (var i = 0; i < cont.children.length; i++) {
    var div = cont.children[i];
    var inputs = div.getElementsByTagName("input");

    var from = "";
    var to = "";

    for (var j = 0; j < inputs.length; j++) {
      var t = inputs[j].getAttribute("data-type");
      if (t === "from") from = inputs[j].value;
      if (t === "to")   to   = inputs[j].value;
    }

    if (from === "") continue;

    if (!ignore) {
      // Mode normal
      txt = txt.split(from).join(to);
    } else {
      // Mode insensible à la casse (ES3 compatible)
      var lowerTxt = txt.toLowerCase();
      var lowerFrom = from.toLowerCase();
      var pos = 0;
      var out = "";

      while (true) {
        var idx = lowerTxt.indexOf(lowerFrom, pos);
        if (idx === -1) {
          out += txt.substring(pos);
          break;
        }
        out += txt.substring(pos, idx) + to;
        pos = idx + from.length;
      }

      txt = out;
    }
  }

  return txt;
}
</script>

</body>
</html>
