<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dessin ASCII</title>
<link rel="stylesheet" href="outils.css">
<style>
::-moz-selection{background:#404040;color:#ccc;}

select{width:55px;}

  height:500px;

<body>

<textarea wrap="off" id="view"></textarea><br>
<button id="copyDraw" class="btn-color" style="background:#4caf50;">Copier</button>
<button id="importFileBtn">Importer fichier…</button><div id="shapeInfo" style="display:inline-block;margin-left:10px;"></div>
<input type="file" id="fileInput" style="display:none;">

<div class="toolbar-nfix">
  <input id="zoomRange" class="zoomRange" type="range" min="6" max="40" value="12" oninput="applyZoomRange()">
  <button onclick="resetZoom()">12px</button>
  |
  <button id="btnFree" onclick="setTool('free')">Tracé libre</button>
  <input type="text" id="freeChar" value="#" maxlength="1">
  |
  <button id="btnLine" onclick="setTool('line')">Ligne</button>
  <input type="text" id="lineChar" value="*" maxlength="1">
  |
  <button id="btnArrow" onclick="setTool('arrow')">Flèche</button>
  |
  <button id="btnRect" onclick="setTool('rect')">Rectangle</button>
  <select id="rectMode">
    <option value="classic">+-| Classique</option>
    <option value="dotted">.: Pointillé</option>
    <option value="rounded">.-|:+ Arrondi</option>
    <option value="wavy">¤~¦ Ondulé</option>
    <option value="fancy">/=\| Fancy</option>
  </select>
  <input type="text" id="rectChar" maxlength="1">
  |
  <button id="btnEllipse" onclick="setTool('ellipse')">Ellipse</button>
  <input type="text" id="ellipseChar" value="o" maxlength="1">
  |
  <button id="btnMove" onclick="setTool('move')">Déplacer</button>
  <button id="btnCopy" onclick="setTool('copy')">Copier</button>
  <button id="btnClipboard" onclick="setTool('clipboard')">Copier presse-papiers</button>
  |
  <button id="btnText" onclick="setTool('text')">Texte libre</button>
  <button id="btnEdit" onclick="setTool('edit')">Édition texte</button>
  |
  <button id="btnFill" onclick="setTool('fill')">Remplir</button>
  <input type="text" id="fillChar" value="#" maxlength="1">
  |
  <button id="btnErase" onclick="setTool('erase')">Gomme</button>
  <button onclick="undo()">Annuler</button>
  <button onclick="redo()">Rétablir</button>
  |
  <button onclick="(function(){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:9999;';var close=function(){if(d&&d.parentNode)d.parentNode.removeChild(d);};d.onclick=function(e){if(e.target===d)close();};var p=document.createElement('div');p.style.cssText='position:absolute;top:4%;left:4%;right:4%;bottom:4%;background:rgba(0,0,0,0.6);color:#ccc;padding:10px;border:1px solid #808080;box-sizing:border-box;';var t=document.createElement('div');t.style.cssText='position:absolute;top:10px;left:10px;right:10px;bottom:50px;overflow:auto;';t.innerHTML='• Caractère personnalisé pour tracé libre, ligne, rectangle, ellipse, remplir : champ vide = caractère par défaut, espace = gomme.<br>• Rectangle : modèles au choix.<br>• Déplacer/Copier : changer de place un rectangle d‘éléments en sélectionnant puis en glissant.<br>• Copier presse-papiers : sélectionner un rectangle d‘éléments le copie.<br>• Texte libre : ajouter du texte n‘importe où sur la zone de dessin sans décaler les autres éléments.<br>• Édition texte : mode édition normale.<br>• Remplir : remplir d‘un caractère l‘intérieur d‘une forme ou caractères identiques.<br>• Gomme : comme tracé libre avec espace.<br>• Annuler/Rétablir : n‘importe quelle opération, cliquer 1 fois sur annuler après avoir annulé texte libre, et 2 fois après avoir OK texte libre pour l‘annuler.';var b=document.createElement('button');b.appendChild(document.createTextNode('Fermer'));b.style.cssText='position:absolute;left:10px;right:10px;bottom:10px;width:calc(100% - 20px);';b.onclick=close;p.appendChild(t);p.appendChild(b);d.appendChild(p);document.body.appendChild(d);p.setAttribute('tabindex','0');p.focus();}())">?</button>
</div>

<div id="textBox" style="display:none;position:fixed;top:20%;left:50%;transform:translateX(-50%);background:#202020;border:1px solid #000;padding:10px;z-index:9999;opacity:0.8;">
  <textarea wrap="off" id="textInput" style="width:300px;height:120px;resize:both;"></textarea><br>
  <button onclick="confirmText()">OK</button>
  <button onclick="cancelText()">Annuler</button>
</div>

<script>
/* --- CONFIG --- */
var grid = [];
var tool = "edit";
var isDown = false;
var startX = 0;
var startY = 0;
var undoStack = [];
var redoStack = [];
var charW = 8;
var charH = 16;
var textStartX = 0;
var textStartY = 0;
var textMarkerActive = false;
var textMarkerX = 0;
var textMarkerY = 0;
var tempGrid = null;
var textEditTimer = null;
var moveSelection = null;
var moveMode = 0; // 0=sélection, 1=attente destination
var copyMode = 0;
var lastMoveX = 0;
var lastMoveY = 0;

/* --- MESURE CARACTÈRE --- */
function autoWidth() {
    var probe = document.createElement("span");
    probe.style.visibility = "hidden";
    probe.style.position = "absolute";
    probe.style.whiteSpace = "pre";

    var style = view.currentStyle || window.getComputedStyle(view);
    probe.style.fontFamily = style.fontFamily;
    probe.style.fontSize   = style.fontSize;

    var s = "";
    for (var i = 0; i < 100; i++) s += "M";
    probe.innerText = s;

    document.body.appendChild(probe);
    var rect = probe.getBoundingClientRect();
    charW = rect.width / 100;
    charH = rect.height;
    document.body.removeChild(probe);
}

/* --- GRID DYNAMIQUE --- */
function ensureCell(x, y) {
    while (grid.length <= y) grid.push([]);
    while (grid[y].length <= x) grid[y].push(" ");
}

/* --- RENDER --- */
function render() {
    var out = "";
    var y, x;

    for (y = 0; y < grid.length; y++) {
        for (x = 0; x < grid[y].length; x++) out += grid[y][x];
        if (y < grid.length - 1) out += "\n";
    }

    view.value = out;
}

/* --- SETTOOL --- */
function setTool(t) {
    tool = t;

    document.getElementById("btnFree").className = "";
    document.getElementById("btnLine").className = "";
    document.getElementById("btnArrow").className = "";
    document.getElementById("btnRect").className = "";
    document.getElementById("btnEllipse").className = "";
    document.getElementById("btnMove").className = "";
    document.getElementById("btnCopy").className = "";
    document.getElementById("btnClipboard").className = "";
    document.getElementById("btnText").className = "";
    document.getElementById("btnEdit").className = "";
    document.getElementById("btnFill").className = "";
    document.getElementById("btnErase").className = "";

    if (t === "free") btnFree.className = "active";
    if (t === "line") btnLine.className = "active";
    if (t === "arrow") btnArrow.className = "active";
    if (t === "rect") btnRect.className = "active";
    if (t === "ellipse") btnEllipse.className = "active";
    if (t === "move") btnMove.className = "active";
    if (t === "copy") btnCopy.className = "active";
    if (t === "move") {
        moveSelection = null;
        moveMode = 0;
    }
    if (t === "copy") {
        moveSelection = null;
        copyMode = 0;
    }
    if (t === "clipboard") btnClipboard.className = "active";
    if (t === "fill") btnFill.className = "active";
    if (t === "erase") btnErase.className = "active";
    if (t === "text") btnText.className = "active";
    if (t === "edit") btnEdit.className = "active";
    
    if (t === "edit") {
        enableTouchDrawing(false); // Android peut éditer normalement
    } else {
        enableTouchDrawing(true);  // Android dessine normalement
    }
}

/* --- EXPORT / IMPORT --- */
function exportTextReturn() {
    return view.value;
}

function importAscii(txt) {
    var lines = txt.split("\n");
    grid = [];

    var i, j;
    for (i = 0; i < lines.length; i++) {
        grid[i] = [];
        for (j = 0; j < lines[i].length; j++) {
            grid[i][j] = lines[i].charAt(j);
        }
    }
    render();
}

function syncFromTextarea() {
    importAscii(view.value);
}

/* --- UNDO / REDO --- */
function copyGrid(src) {
    var out = [];
    var y, x;

    for (y = 0; y < src.length; y++) {
        out[y] = [];
        for (x = 0; x < src[y].length; x++) out[y][x] = src[y][x];
    }
    return out;
}

function saveState() {
    undoStack.push(copyGrid(grid));
    redoStack = [];
}

function undo() {
    if (undoStack.length === 0) return;
    redoStack.push(copyGrid(grid));
    grid = undoStack.pop();
    render();
}

function redo() {
    if (redoStack.length === 0) return;
    undoStack.push(copyGrid(grid));
    grid = redoStack.pop();
    render();
}

/* --- POSITION --- */
function getPos(e) {
    var rect = view.getBoundingClientRect();

    var scrollX = view.scrollLeft;
    var scrollY = view.scrollTop;

    var x = Math.floor((e.clientX - rect.left + scrollX) / charW);
    var y = Math.floor((e.clientY - rect.top  + scrollY) / charH);

    return { x:x, y:y };
}

/* --- DRAW FREE --- */
function drawFree(x, y) {
    ensureCell(x, y);

    var c = document.getElementById("freeChar").value;
    // if (c === " ") c = "#";
    if (!c || c.length === 0) c = "#"; // caractère par défaut
    grid[y][x] = c;

    render();
}

/* --- LINE --- */
function drawLine(x1, y1, x2, y2) {
    var dx = Math.abs(x2 - x1);
    var dy = Math.abs(y2 - y1);
    var sx = (x1 < x2) ? 1 : -1;
    var sy = (y1 < y2) ? 1 : -1;
    var err = dx - dy;

    while (true) {
        ensureCell(x1, y1);

        var c = document.getElementById("lineChar").value;
        // if (c === " ") c = "*";
        if (!c || c.length === 0) c = "*";
        grid[y1][x1] = c;

        if (x1 === x2 && y1 === y2) break;

        var e2 = 2 * err;
        if (e2 > -dy) { err -= dy; x1 += sx; }
        if (e2 < dx) { err += dx; y1 += sy; }
    }
    render();
}

/* --- ARROW --- */
function drawArrow(x1, y1, x2, y2) {
    // 1) Segment horizontal
    var midX = x2;
    var midY = y1;

    var x;
    if (x1 <= midX) {
        for (x = x1; x <= midX; x++) {
            ensureCell(x, midY);
            grid[midY][x] = "-";
        }
    } else {
        for (x = x1; x >= midX; x--) {
            ensureCell(x, midY);
            grid[midY][x] = "-";
        }
    }

    // 2) Segment vertical
    var y;
    if (y1 <= y2) {
        for (y = y1; y <= y2; y++) {
            ensureCell(midX, y);
            grid[y][midX] = "|";
        }
    } else {
        for (y = y1; y >= y2; y--) {
            ensureCell(midX, y);
            grid[y][midX] = "|";
        }
    }

    // 3) Pointe
    ensureCell(x2, y2);

    if (Math.abs(x2 - x1) >= Math.abs(y2 - y1)) {
        // direction horizontale dominante
        if (x2 > x1) grid[y2][x2] = ">";
        else         grid[y2][x2] = "<";
    } else {
        // direction verticale dominante
        if (y2 > y1) grid[y2][x2] = "v";
        else         grid[y2][x2] = "^";
    }

    render();
}

/* --- RECTANGLE --- */
var RECT_STYLES = {
  classic: {
    tl: "+",
    tr: "+",
    bl: "+",
    br: "+",
    top: "-",
    bottom: "-",
    left: "|",
    right: "|"
  },
  dotted: {
    tl: ".", 
    tr: ".", 
    bl: ":", 
    br: ":", 
    top: ".", 
    bottom: ".", 
    left: ":", 
    right: ":",
    dotted: true
  },
  rounded: {
    tl: ".",
    tr: ".",
    bl: "'",
    br: "'",
    top: "-",
    bottom: "-",
    left: "|",
    right: "|"
  },
  wavy: {
    tl: "¤",
    tr: "¤",
    bl: "¤",
    br: "¤",
    top: "~",
    bottom: "~",
    left: "¦",
    right: "¦"
  },
  fancy: {
    tl: "/",
    tr: "\\",
    bl: "\\",
    br: "/",
    top: "=",
    bottom: "=",
    left: "|",
    right: "|"
  }
};

function drawRectangle(x1, y1, x2, y2) {
    var xMin = Math.min(x1, x2);
    var xMax = Math.max(x1, x2);
    var yMin = Math.min(y1, y2);
    var yMax = Math.max(y1, y2);

    ensureCell(xMin, yMin);
    ensureCell(xMax, yMax);

    // lire le mode
    var mode = document.getElementById("rectMode").value;
    var style = RECT_STYLES[mode];

    // lire le caractère personnalisé
    var c = document.getElementById("rectChar").value;
    var useCustom = (c && c.length > 0);

    // si caractère custom → override tout
    var tl = useCustom ? c : style.tl;
    var tr = useCustom ? c : style.tr;
    var bl = useCustom ? c : style.bl;
    var br = useCustom ? c : style.br;

    var top    = useCustom ? c : style.top;
    var bottom = useCustom ? c : style.bottom;
    var left   = useCustom ? c : style.left;
    var right  = useCustom ? c : style.right;

    var x, y;

    // MODE POINTILLÉ SPÉCIAL
    if (style.dotted && !useCustom) {

        grid[yMin][xMin] = tl;
        grid[yMin][xMax] = tr;
        grid[yMax][xMin] = bl;
        grid[yMax][xMax] = br;

        for (x = xMin + 1; x < xMax; x++) {
            ensureCell(x, yMin);
            ensureCell(x, yMax);
            grid[yMin][x] = top;
            grid[yMax][x] = bottom;
        }

        for (y = yMin + 1; y < yMax; y++) {
            ensureCell(xMin, y);
            ensureCell(xMax, y);
            grid[y][xMin] = left;
            grid[y][xMax] = right;
        }

        render();
        return;
    }

    // MODE NORMAL

    grid[yMin][xMin] = tl;
    grid[yMin][xMax] = tr;
    grid[yMax][xMin] = bl;
    grid[yMax][xMax] = br;

    for (x = xMin + 1; x < xMax; x++) {
        ensureCell(x, yMin);
        ensureCell(x, yMax);
        grid[yMin][x] = top;
        grid[yMax][x] = bottom;
    }

    for (y = yMin + 1; y < yMax; y++) {
        ensureCell(xMin, y);
        ensureCell(xMax, y);
        grid[y][xMin] = left;
        grid[y][xMax] = right;
    }

    render();
}

/* --- ELLIPSE --- */
function drawEllipse(x1, y1, x2, y2) {
    var cx = Math.floor((x1 + x2) / 2);
    var cy = Math.floor((y1 + y2) / 2);
    var rx = Math.abs(x2 - x1) / 2;
    var ry = Math.abs(y2 - y1) / 2;

    var x, y;
    for (y = -Math.ceil(ry); y <= Math.ceil(ry); y++) {
        for (x = -Math.ceil(rx); x <= Math.ceil(rx); x++) {
            var d = (x*x)/(rx*rx) + (y*y)/(ry*ry);
            if (Math.abs(d - 1) < 0.15) {
                var px = cx + x;
                var py = cy + y;
                ensureCell(px, py);

                var c = document.getElementById("ellipseChar").value;
                // if (c === " ") c = "o";
                if (!c || c.length === 0) c = "o";
                grid[py][px] = c;
            }
        }
    }
    render();
}

/* --- DEPLACEMENT --- */
function safeGet(x, y) {
    if (!grid[y]) return " ";
    if (grid[y][x] == null) return " ";
    return grid[y][x];
}

function safeSet(x, y, c) {
    ensureCell(x, y);
    grid[y][x] = c;
}

function captureSelection(x1,y1,x2,y2) {

    var xMin = Math.min(x1,x2);
    var xMax = Math.max(x1,x2);
    var yMin = Math.min(y1,y2);
    var yMax = Math.max(y1,y2);

    moveSelection = {
        x:xMin,
        y:yMin,
        w:xMax-xMin+1,
        h:yMax-yMin+1,
        data:[]
    };

    var x,y;

    for(y=yMin;y<=yMax;y++) {

        moveSelection.data.push([]);

        for(x=xMin;x<=xMax;x++) {

            ensureCell(x,y);

            moveSelection.data[y-yMin].push(safeGet(x, y));

            // efface l'original
            grid[y][x] = " ";
        }
    }

    render();
    tempGrid = copyGrid(grid);
}

function captureSelectionCopy(x1, y1, x2, y2) {

    var xMin = Math.min(x1, x2);
    var xMax = Math.max(x1, x2);
    var yMin = Math.min(y1, y2);
    var yMax = Math.max(y1, y2);

    moveSelection = {
        x:xMin,
        y:yMin,
        w:xMax-xMin+1,
        h:yMax-yMin+1,
        data:[]
    };

    var x,y;

    for(y=yMin;y<=yMax;y++) {

        moveSelection.data.push([]);

        for(x=xMin;x<=xMax;x++){

            ensureCell(x,y);

            // on copie mais on n'efface pas
            moveSelection.data[y-yMin].push(safeGet(x, y));
        }
    }

    render();
    tempGrid = copyGrid(grid);
}

function trimGrid() {

    var y, x;

    // supprimer espaces de fin de ligne
    for (y = 0; y < grid.length; y++) {

        if (!grid[y]) continue;

        while (
            grid[y].length > 0 &&
            grid[y][grid[y].length - 1] === " "
        ) {
            grid[y].pop();
        }
    }

    // supprimer lignes vides finales
    while (grid.length > 0) {

        var empty = true;

        for (x = 0; x < grid[grid.length - 1].length; x++) {
            if (grid[grid.length - 1][x] !== " ") {
                empty = false;
                break;
            }
        }

        if (!empty) break;

        grid.pop();
    }
}

function pasteSelection(destX,destY) {

    grid = copyGrid(tempGrid);

    var x,y;

    for(y=0;y<moveSelection.h;y++) {
        for(x=0;x<moveSelection.w;x++) {

            var c = moveSelection.data[y][x];
            if (c !== " ") safeSet(destX + x, destY + y, c);

            if(c === " ") continue;

            ensureCell(destX+x,destY+y);

            grid[destY+y][destX+x] = c;
        }
    }

    moveSelection = null;
    moveMode = 0;
    copyMode = 0;
    tempGrid = null;

    trimGrid();
    render();
}

function previewMove(destX, destY) {

    if (!moveSelection) return;

    var realGrid = grid;

    var previewGrid = copyGrid(grid);
    grid = previewGrid;

    var x, y;

    for (y = 0; y < moveSelection.h; y++) {
        for (x = 0; x < moveSelection.w; x++) {

            var c = moveSelection.data[y][x];
            if (c === " ") continue;

            ensureCell(destX + x, destY + y);
            grid[destY + y][destX + x] = c;
        }
    }

    render();
    grid = realGrid;
}

function copySelectionToClipboard(x1, y1, x2, y2) {

    var xMin = Math.min(x1, x2);
    var xMax = Math.max(x1, x2);
    var yMin = Math.min(y1, y2);
    var yMax = Math.max(y1, y2);

    var txt = "";
    var x, y;

    for (y = yMin; y <= yMax; y++) {

        var line = "";

        for (x = xMin; x <= xMax; x++) {
            line += safeGet(x, y);
        }

        // retire les espaces de fin
        line = line.replace(/\s+$/, "");

        txt += line;

        if (y < yMax)
            txt += "\n";
    }

    var temp = document.createElement("textarea");
    temp.value = txt;
    document.body.appendChild(temp);
    temp.select();

    try {
        document.execCommand("copy");
    } catch(e) {}

    document.body.removeChild(temp);
}

/* --- TEXTE --- */
function placeTextMarker(x, y) {
    textMarkerX = x;
    textMarkerY = y;
    textMarkerActive = true;

    ensureCell(x, y);
    grid[y][x] = "█"; // marqueur visuel
    render();
}

function removeTextMarker() {
    if (!textMarkerActive) return;
    ensureCell(textMarkerX, textMarkerY);
    grid[textMarkerY][textMarkerX] = " "; // ou laisser tel quel si tu préfères
    textMarkerActive = false;
    render();
}

function placeText(x, y) {
    textStartX = x;
    textStartY = y;

    removeTextMarker();      // au cas où
    placeTextMarker(x, y);   // on voit où le texte va commencer

    textInput.value = "";
    textBox.style.display = "block";

    // focus automatique
    setTimeout(function() {
        textInput.focus();
        textInput.select();
    }, 0);
}

function confirmText() {
    saveState();

    removeTextMarker(); // on nettoie le curseur

    var lines = textInput.value.split("\n");
    var i, j;

    for (i = 0; i < lines.length; i++) {
        for (j = 0; j < lines[i].length; j++) {
            ensureCell(textStartX + j, textStartY + i);
            grid[textStartY + i][textStartX + j] = lines[i].charAt(j);
        }
    }

    textBox.style.display = "none";
    render();
}

function cancelText() {
    removeTextMarker();
    textBox.style.display = "none";
}

view.addEventListener("input", function() {
    if (textEditTimer) clearTimeout(textEditTimer);

    textEditTimer = setTimeout(function() {
        saveState();          // undo/redo pour texte normal
        syncFromTextarea();   // grid = textarea
    }, 300); // 300 ms après la dernière frappe
});

/* --- REMPLISSAGE --- */
function floodFill(x, y) {
    ensureCell(x, y);

    var target = grid[y][x];
    var fillChar = document.getElementById("fillChar").value;

    if (!fillChar || fillChar.length === 0) fillChar = "#";
    if (fillChar === target) return;

    var stack = [];
    stack.push({x:x, y:y});

    while (stack.length > 0) {
        var p = stack.pop();
        var px = p.x;
        var py = p.y;

        if (py < 0 || px < 0) continue;
        if (!grid[py] || grid[py][px] == null) continue;

        if (grid[py][px] !== target) continue;

        grid[py][px] = fillChar;

        stack.push({x:px+1, y:py});
        stack.push({x:px-1, y:py});
        stack.push({x:px,   y:py+1});
        stack.push({x:px,   y:py-1});
    }
}

/* --- GOMME --- */
function eraseAt(x, y) {
    ensureCell(x, y);
    grid[y][x] = " ";
    render();
}

/* --- MOUSE HANDLING --- */
view.onmousedown = function(e) {
    if (tool === "edit") {
        // mode texte normal : on laisse le textarea gérer le curseur
        return;
    }
    syncFromTextarea();

    var pos = getPos(e);
    if(tool === "move" && moveMode === 1) {

        isDown = true;

        lastMoveX = pos.x;
        lastMoveY = pos.y;

        previewMove(pos.x, pos.y);

        return;
    }
    if(tool === "copy" && copyMode === 1) {

        isDown = true;

        lastMoveX = pos.x;
        lastMoveY = pos.y;

        previewMove(pos.x, pos.y);

        return;
    }
    isDown = true;
    startX = pos.x;
    startY = pos.y;

    saveState();

    // copie de la grille pour affichage temporaire
    tempGrid = copyGrid(grid);

    if (tool === "text") {
        placeText(pos.x, pos.y);
        isDown = false;
        return;
    }
    if (tool === "fill") {
        floodFill(pos.x, pos.y);
        render();
        isDown = false;
        return;
    }
    if (tool === "free")  drawFree(pos.x, pos.y);
    if (tool === "erase") eraseAt(pos.x, pos.y);
};

function autoWidthDynamic() {
    autoWidth(); // recalcul charW et charH
}

view.onmousemove = function(e) {
    if (!isDown) return; // ne scroller que si on dessine

    var rect = view.getBoundingClientRect();
    var margin = 50;

    if (e.clientY > rect.bottom - margin) {
        view.scrollTop += charH * 2;
    }
    else if (e.clientY < rect.top + margin) {
        view.scrollTop -= charH * 2;
        if (view.scrollTop < 0) view.scrollTop = 0;
    }

    if (e.clientX > rect.right - margin) {
        view.scrollLeft += charW * 2;
    }
    else if (e.clientX < rect.left + margin) {
        view.scrollLeft -= charW * 2;
        if (view.scrollLeft < 0) view.scrollLeft = 0;
    }

    if(tool === "move" && moveMode === 1 && isDown) {

        var pos = getPos(e);

        lastMoveX = pos.x;
        lastMoveY = pos.y;

        previewMove(pos.x, pos.y);

        return;
    }
    if(tool === "copy" && copyMode === 1 && isDown) {

        var pos = getPos(e);

        lastMoveX = pos.x;
        lastMoveY = pos.y;

        previewMove(pos.x, pos.y);

        return;
    }

	if (tool === "edit") return; // pas de dessin
	autoWidthDynamic();
    if (!isDown) return;

    var pos = getPos(e);

    if (isDown && (tool === "line" || tool === "arrow" || tool === "rect" || tool === "ellipse")) {

        var w = Math.abs(pos.x - startX) + 1;
        var h = Math.abs(pos.y - startY) + 1;

        updateShapeInfo(w, h);
    }

    if (tool === "free") {
        drawFree(pos.x, pos.y);
        return;
    }

    if (tool === "erase") {
        eraseAt(pos.x, pos.y);
        return;
    }

    // formes géométriques : affichage temporaire
    grid = copyGrid(tempGrid);

    if (tool === "line") drawLine(startX, startY, pos.x, pos.y);
    if (tool === "arrow") drawArrow(startX, startY, pos.x, pos.y);
    if (tool === "rect") drawRectangle(startX, startY, pos.x, pos.y);
    if (tool === "ellipse") drawEllipse(startX, startY, pos.x, pos.y);

    // affichage temporaire dans le textarea
    render();
};

// Correction Chromium Linux
document.addEventListener("mousemove", function(e) {
    if (!isDown) return;
    // si la souris est déjà sur le textarea, inutile de doubler le traitement
    if (e.target === view) return;
    view.onmousemove(e);
});
document.addEventListener("mouseup", function(e) {
    if (isDown) {
        view.onmouseup(e);
    }
});

view.onmouseup = function(e) {
    if (tool === "edit") return;

    var pos = getPos(e);

    if (tool === "move" && moveMode === 1) {
        pasteSelection(lastMoveX, lastMoveY);
        isDown = false;
        return;
    }

    if (tool === "copy" && copyMode === 1) {
        pasteSelection(lastMoveX, lastMoveY);
        isDown = false;
        return;
    }

    if (!isDown) return;
    isDown = false;

    syncFromTextarea();

    if (tool === "move") {
        if (moveMode === 0) {
            captureSelection(startX, startY, pos.x, pos.y);
            moveMode = 1;
        }
        return;
    }
    if (tool === "copy") {
        if (copyMode === 0) {
            captureSelectionCopy(startX, startY, pos.x, pos.y);
            copyMode = 1;
        }
        return;
    }
    if (tool === "clipboard") {
        copySelectionToClipboard(startX, startY, pos.x, pos.y);
        return;
    }
    // formes finales
    if (tool === "line")    drawLine(startX, startY, pos.x, pos.y);
    if (tool === "arrow")   drawArrow(startX, startY, pos.x, pos.y);
    if (tool === "rect")    drawRectangle(startX, startY, pos.x, pos.y);
    if (tool === "ellipse") drawEllipse(startX, startY, pos.x, pos.y);

    clearShapeInfo();
    tempGrid = null;
};

var touchEnabled = true;

function enableTouchDrawing(enable) {
    touchEnabled = enable;
}

view.addEventListener("touchstart", function(e) {
    if (!touchEnabled) return; // mode édition → laisser Android gérer
    e.preventDefault();
    var t = e.touches[0];
    view.onmousedown({ clientX:t.clientX, clientY:t.clientY });
}, { passive:false });

view.addEventListener("touchmove", function(e) {
    if (!touchEnabled) return;
    e.preventDefault();
    var t = e.touches[0];
    view.onmousemove({ clientX:t.clientX, clientY:t.clientY });
}, { passive:false });

view.addEventListener("touchend", function(e) {
    if (!touchEnabled) return;
    e.preventDefault();
    var t = e.changedTouches[0];
    view.onmouseup({ clientX:t.clientX, clientY:t.clientY });
}, { passive:false });

/* --- AFFICHAGE DIMENSIONS --- */
function updateShapeInfo(w, h) {
    var box = document.getElementById("shapeInfo");
    box.textContent = "Largeur : " + w + ", Hauteur : " + h;
}

function clearShapeInfo() {
    document.getElementById("shapeInfo").textContent = "";
}

/* --- CHANGER TAILLE DU TEXTE ZONE DE DESSIN --- */
function applyZoomRange() {
    var size = document.getElementById("zoomRange").value;
    var t = document.getElementById("view");
    t.style.fontSize = size + "px";
    autoWidth();
    view.getBoundingClientRect();
}
function resetZoom() {
    var slider = document.getElementById("zoomRange");
    slider.value = 12;
    applyZoomRange();
}

/* --- STARTUP --- */
window.onload = function() {
    setTool("edit");
    autoWidth();
    grid = [[]];
    render();
};

/* --- COPIER --- */
document.getElementById('copyDraw').onclick = function(e) {
	var btn = e.target;
    var txt = view.value;

    var temp = document.createElement("textarea");
    temp.value = txt;
    document.body.appendChild(temp);
    temp.select();

    try {
        document.execCommand("copy");
    } catch (err) {}

    document.body.removeChild(temp);
    btn.focus();
};

// Glisser-déposer
function enableDragDrop(targetTextarea) {
    targetTextarea.addEventListener("dragover", function(e) {
        if (e.dataTransfer.types &&
            (e.dataTransfer.types.indexOf("Files") !== -1 ||
             e.dataTransfer.types.indexOf("application/x-moz-file") !== -1)) {

            e.preventDefault();
        }
    });

    targetTextarea.addEventListener("drop", function(e) {
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            e.preventDefault();

            var file = e.dataTransfer.files[0];
            var reader = new FileReader();

            reader.onload = function(ev) {
                targetTextarea.value = ev.target.result;
            };

            reader.readAsText(file);
        }
    });
}
var dragdroptextareaview = document.getElementById("view");
var dragdroptextareatextInput = document.getElementById("textInput");

enableDragDrop(dragdroptextareaview);
enableDragDrop(dragdroptextareatextInput);

// Bouton Importer fichier…
document.getElementById("importFileBtn").onclick = function () {
    document.getElementById("fileInput").click();
};

document.getElementById("fileInput").addEventListener("change", function () {
    var file = this.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (e) {
        document.getElementById("view").value = e.target.result;
    };
    reader.readAsText(file);
});
</script>
