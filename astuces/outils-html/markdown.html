<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown</title>
<style>
body {
  background:#c0c0c0;
  font-family:sans-serif;
}

.toolbar {
  background: #c0c0c0;
  border: 2px solid;
  border-color: #fff #404040 #404040 #fff;
  padding: 4px;
}

button {
  background: #c0c0c0;
  color: black;
  border: 2px solid;
  border-color: #fff #404040 #404040 #fff;
  padding: 4px 8px;
  font-size: 12px;
  cursor: pointer;
}
button:active {
  border-color: #404040 #fff #fff #404040;
  background: #c0c0c0;
}
button:hover { background:#e0e0e0; }
.btn-color:hover { filter: brightness(1.2) }

textarea {
  width: 100%;
  height: 70vh;
  font-family: monospace;
  border: 2px solid;
  border-color: #808080 #ffffff #ffffff #808080;
  box-sizing: border-box;
  resize: vertical;
}

/* scrollbar */
@media (hover: none) and (pointer: coarse) {
::-webkit-scrollbar {
  width: 24px;
  height: 24px;
  background: #c0c0c0;
}
::-webkit-scrollbar-track {
  background: #d9d9d9;
  border-top: 2px solid #ffffff;
  border-left: 2px solid #ffffff;
  border-bottom: 2px solid #000000;
  border-right: 2px solid #000000;
}
::-webkit-scrollbar-thumb {
  background: #aaaaaa;
  border-top: 2px solid #ffffff;
  border-left: 2px solid #ffffff;
  border-bottom: 2px solid #000000;
  border-right: 2px solid #000000;
}
}
</style>
</head>

<body>

<h2>Markdown</h2>

<div class="toolbar">

  <!-- Titres -->
  <button data-md="# ">h1</button>
  <button data-md="## ">h2</button>
  <button data-md="### ">h3</button>
  <button data-md="#### ">h4</button>
  <button data-md="##### ">h5</button>
  <button data-md="###### ">h6</button>
|
  <!-- Texte -->
  <button data-md="**texte**">Gras</button>
  <button data-md="*texte*">Italique</button>
  <button data-md="~~texte~~">Barré</button>
|
  <!-- Code -->
  <button data-md="`code`">Code</button>
  <button data-md="CODEBLOCK">Bloc</button>
|
  <!-- Structure -->
  <button data-md="- ">Liste</button>
  <button data-md="1. ">Liste num</button>
  <button data-md="> ">Citation</button>
  <button data-md="---">hr</button>
|
  <!-- Liens -->
  <button data-md="[texte](url)">Lien</button>
  <button data-md="![texte](url)">Image</button>
</div>

<button onclick="copyMd(event)" class="btn-color" style="background-color:#4caf50;">Copier</button>
<br><textarea id="input" wrap="off"></textarea><br>
<button id="importFileBtn">Importer fichier…</button>
<input type="file" id="fileInput" style="display:none;">

<script>
// Glisser-déposer
var input = document.getElementById("input");

input.addEventListener("dragover", function(e) {

    // Si un fichier est glissé → empêcher le comportement natif
    if (e.dataTransfer.types &&
        (e.dataTransfer.types.indexOf("Files") !== -1 ||
         e.dataTransfer.types.indexOf("application/x-moz-file") !== -1)) {

        e.preventDefault(); // autorise le drop fichier
    }

    // Sinon → NE RIEN FAIRE
    // Le navigateur affiche le curseur d’insertion
});

input.addEventListener("drop", function(e) {

    // Si fichier → on gère nous-même
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        e.preventDefault();

        var file = e.dataTransfer.files[0];
        var reader = new FileReader();

        reader.onload = function(ev) {
            // On met le fichier brut dans la zone
            input.value = ev.target.result;
        };

        reader.readAsText(file);
        return;
    }

    // Sinon → laisser le navigateur coller le texte
});

// Bouton Importer fichier…
document.getElementById("importFileBtn").onclick = function () {
    document.getElementById("fileInput").click();
};

document.getElementById("fileInput").addEventListener("change", function () {
    var file = this.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (e) {
        document.getElementById("input").value = e.target.result;
    };
    reader.readAsText(file);
});

/* --- Insertion --- */
function insertAtCursor(textarea, text) {
  try {
    var start = textarea.selectionStart;
    var end   = textarea.selectionEnd;

    if (start === undefined || end === undefined) throw "no-selection";

    var value = textarea.value;
    textarea.value =
      value.substring(0, start) + text + value.substring(end);

    textarea.selectionStart = textarea.selectionEnd = start + text.length;
  } catch(e) {
    textarea.value += text;
  }
}

/* --- Toolbar --- */
function wrapSelection(textarea, before, after) {
  try {
    var start = textarea.selectionStart;
    var end   = textarea.selectionEnd;

    if (start === undefined || end === undefined) throw "no-selection";

    var value = textarea.value;
    var selected = value.substring(start, end);

    if (start === end) {
      textarea.value =
        value.substring(0, start) + before + after + value.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + before.length;
      return;
    }

    textarea.value =
      value.substring(0, start) +
      before + selected + after +
      value.substring(end);

    textarea.selectionStart = start + before.length;
    textarea.selectionEnd   = start + before.length + selected.length;

  } catch(e) {
    textarea.value += before + after;
  }
}

function initToolbar() {
  var toolbar = document.getElementsByClassName("toolbar")[0];
  var buttons = toolbar.getElementsByTagName("button");
  var textarea = document.getElementById("input");

  for (var i = 0; i < buttons.length; i++) {
    (function(btn) {
      var mdText = btn.getAttribute("data-md");
      if (!mdText) return;

      btn.onclick = function() {
        if (mdText === "CODEBLOCK") {
          mdText = "```\ncode\n```\n";
        }
        if (mdText === "**texte**") {
          wrapSelection(textarea, "**", "**");
        }
        else if (mdText === "*texte*") {
          wrapSelection(textarea, "*", "*");
        }
        else if (mdText === "~~texte~~") {
          wrapSelection(textarea, "~~", "~~");
        }
        else {
          insertAtCursor(textarea, mdText);
        }
        textarea.focus();
      };
    })(buttons[i]);
  }
}

/* --- Init --- */
window.onload = function() {
  initToolbar();
};

/* --- Copier --- */
function copyMd(e) {
  var btn = event.target;
  var code = document.getElementById('input');

  var temp = document.createElement("textarea");
  temp.value = code.value;
  document.body.appendChild(temp);
  temp.select();

  try { document.execCommand("copy"); } catch (err) {}

  document.body.removeChild(temp);
  btn.focus();
}
</script>

</body>
</html>
