<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tester polices</title>
<style>
body {
  font-family: sans-serif;
  background: #c0c0c0;
}

h3 { margin-bottom: 0; }
p { margin-top:10px; line-height:0; }

button {
  background: #c0c0c0;
  color: black;
  border: 2px solid;
  border-color: #fff #404040 #404040 #fff;
  padding: 4px 8px;
  font-size: 12px;
  cursor: pointer;
}
button:hover { background:#e0e0e0; }
button:active {
  border-color: #404040 #fff #fff #404040;
  background: #b0b0b0;
}

.container {
  display: grid;
}
.card {
  background: #c0c0c0;
  border: 2px solid;
  border-color: #ffffff #808080 #808080 #ffffff;
  padding: 10px;
  display: block;
  max-width: 100%;
  overflow: hidden;
}
/* scrollbar */
@media (hover: none) and (pointer: coarse) {
::-webkit-scrollbar {
  width: 24px;
  height: 24px;
  background: #c0c0c0;
}
::-webkit-scrollbar-track {
  background: #d9d9d9;
  border-top: 2px solid #ffffff;
  border-left: 2px solid #ffffff;
  border-bottom: 2px solid #000000;
  border-right: 2px solid #000000;
}
::-webkit-scrollbar-thumb {
  background: #aaaaaa;
  border-top: 2px solid #ffffff;
  border-left: 2px solid #ffffff;
  border-bottom: 2px solid #000000;
  border-right: 2px solid #000000;
}
}

@media (min-width: 0px) {
  .container { grid-template-columns: 1fr; }
}

@media (min-width: 1100px) {
  .container { grid-template-columns: 1fr 1fr; }
}

#input {
  width: 100%;
  height: 200px;
  border: 2px solid;
  border-color: #808080 #ffffff #ffffff #808080;
  box-sizing: border-box;
  white-space: pre;
  overflow: auto;
  resize: vertical;
}

.preview {
  background: white;
  border:2px solid;
  border-color: #808080 #ffffff #ffffff #808080;
  padding: 2px;
  margin-top: 10px;
  min-height: 40px;
  max-height: 200px;
  white-space: pre;
  overflow: auto;
  font-size: 12px
}

/* Chaque bloc a sa propre police */
#preview1, .p1 { font-family: Courier New; }
#preview2, .p2 { font-family: Lucida Console; }
#preview3, .p3 { font-family: Consolas; }
#preview4, .p4 { font-family: monospace; }
#preview5, .p5 { font-family: Arial; }
#preview6, .p6 { font-family: Verdana; }
#preview7, .p7 { font-family: Times New Roman; }
#preview8, .p8 { font-family: Georgia; }
#preview9, .p9 { font-family: sans-serif; }
#preview10, .p10 { font-family: Comic Sans MS; }
#preview11, .p11 { font-family: Impact; }
#preview12, .p12 { font-family: Trebuchet MS; }
</style>
</head>
<body>

<h2>Tester polices</h2>

<h3>Texte</h3>

<textarea id="input" onkeyup="updateText();"></textarea><br>
<button id="importFileBtn">Importer fichier…</button>
<input type="file" id="fileInput" style="display:none;">

<h3>Affichage des polices</h3>

<div class="container">

<div class="card">
<p class="p1">Courier New</p>
<div id="preview1" class="preview"></div>
</div>

<div class="card">
<p class="p2">Lucida Console</p>
<div id="preview2" class="preview"></div>
</div>

<div class="card">
<p class="p3">Consolas</p>
<div id="preview3" class="preview"></div>
</div>

<div class="card">
<p class="p4">monospace</p>
<div id="preview4" class="preview"></div>
</div>

<div class="card">
<p class="p5">Arial</p>
<div id="preview5" class="preview"></div>
</div>

<div class="card">
<p class="p6">Verdana</p>
<div id="preview6" class="preview"></div>
</div>

<div class="card">
<p class="p7">Times New Roman</p>
<div id="preview7" class="preview"></div>
</div>

<div class="card">
<p class="p8">Georgia</p>
<div id="preview8" class="preview"></div>
</div>

<div class="card">
<p class="p9">sans-serif</p>
<div id="preview9" class="preview"></div>
</div>

<div class="card">
<p class="p10">Comic Sans MS</p>
<div id="preview10" class="preview"></div>
</div>

<div class="card">
<p class="p11">Impact</p>
<div id="preview11" class="preview"></div>
</div>

<div class="card">
<p class="p12">Trebuchet MS</p>
<div id="preview12" class="preview"></div>
</div>

</div>

<script>
function updateText() {
    var txt = document.getElementById("input").value;

    document.getElementById("preview1").innerHTML = txt;
    document.getElementById("preview2").innerHTML = txt;
    document.getElementById("preview3").innerHTML = txt;
    document.getElementById("preview4").innerHTML = txt;
    document.getElementById("preview5").innerHTML = txt;
    document.getElementById("preview6").innerHTML = txt;
    document.getElementById("preview7").innerHTML = txt;
    document.getElementById("preview8").innerHTML = txt;
    document.getElementById("preview9").innerHTML = txt;
    document.getElementById("preview10").innerHTML = txt;
    document.getElementById("preview11").innerHTML = txt;
    document.getElementById("preview12").innerHTML = txt;
}

// Glisser-déposer
var input = document.getElementById("input");

input.addEventListener("dragover", function(e) {

    // Si un fichier est glissé → empêcher le comportement natif
    if (e.dataTransfer.types &&
        (e.dataTransfer.types.indexOf("Files") !== -1 ||
         e.dataTransfer.types.indexOf("application/x-moz-file") !== -1)) {

        e.preventDefault(); // autorise le drop fichier
    }

    // Sinon → NE RIEN FAIRE
    // Le navigateur affiche le curseur d’insertion
});

input.addEventListener("drop", function(e) {

    // Si fichier → on gère nous-même
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        e.preventDefault();

        var file = e.dataTransfer.files[0];
        var reader = new FileReader();

        reader.onload = function(ev) {
            // On met le fichier brut dans la zone
            input.value = ev.target.result;
            updateText();
        };

        reader.readAsText(file);
        return;
    }

    // Sinon → laisser le navigateur coller le texte
});

// Bouton Importer fichier…
document.getElementById("importFileBtn").onclick = function () {
    document.getElementById("fileInput").click();
};

document.getElementById("fileInput").addEventListener("change", function () {
    var file = this.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (e) {
        document.getElementById("input").value = e.target.result;
        updateText();
    };
    reader.readAsText(file);
});
</script>

</body>
</html>
